<!doctype html>
<html lang="en" data-chrome="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bento Studio</title>
<link rel="icon" id="favicon">
<!--
  BENTO STUDIO — canvas-first visual page editor.
  Single file. No dependencies. No build step.

  Coordinate model: the page has a LOGICAL size (state.canvas.w/h) stored in
  state. The canvas element is laid out at that logical size and scaled to fit
  the viewport with a CSS transform. Pointer deltas are divided by the measured
  scale, so dragging is exactly 1:1 at any zoom, compositions are portable
  across viewports, and export is pixel-identical to the editor.

  Styling model: ALL page/card CSS is generated at runtime by pageCSS()
  and themeCSS(). The static stylesheet below only styles editor chrome. The
  same two generators feed the export, which is what makes preview == export.
  No colour literal appears below the token layer.
-->
<style>
/* ==========================================================================
   EDITOR CHROME ONLY.
   Page + card styles are generated by pageCSS() / themeCSS() into
   #pageStyle at boot. Do not add card styles here.
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

:root {
  --chromeBg: rgba(255,253,250,.90);
  --chromeInk: #1d1916;
  --chromeInkSoft: rgba(29,25,22,.58);
  --chromeLine: rgba(29,25,22,.12);
  --chromeHover: #fff;
  --chromeSolid: #fffdfa;
  --chromeShadow: 0 8px 30px rgba(60,45,30,.13);
  --focus: #3b6fe0;
  --danger: #c2402a;
  --sheetBg: #17181c;
  --sheetInk: #f1eee8;
  --sheetLine: rgba(255,255,255,.11);
  --sheetField: #101116;
}
html[data-chrome="dark"] {
  --chromeBg: rgba(20,22,27,.86);
  --chromeInk: #eef1f6;
  --chromeInkSoft: rgba(238,241,246,.58);
  --chromeLine: rgba(255,255,255,.13);
  --chromeHover: rgba(255,255,255,.16);
  --chromeSolid: #1b1e24;
  --chromeShadow: 0 10px 34px rgba(0,0,0,.45);
  --focus: #8ea8ff;
  --danger: #ff8f75;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  color: var(--chromeInk);
  /* The theme fills the whole screen — there is no outer application frame.
     Theme tokens are emitted on :root as well as .gallery for exactly this. */
  background: var(--canvasBg, #14151a);
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- stage + canvas ------------------------------------------------ */

.app { position: fixed; inset: 0; overflow: hidden; background: var(--canvasBg, #14151a); }

/* The stage scrolls; the plane is centred inside it.
   margin:auto rather than place-items:center — with centring, the top and
   left of an oversized child cannot be reached by scrolling at all. */
.stage {
  position: absolute;
  inset: 0;
  overflow: auto;
  display: flex;
  padding: 0;
  /* Chrome's scroll anchoring fights programmatic centring when the plane
     resizes underneath it. */
  overflow-anchor: none;
  -webkit-overflow-scrolling: touch;
}

/* Sized in JS to the scaled canvas footprint so scrolling behaves.
   A hairline is the only thing marking where the exportable frame ends. */
.canvasFrame {
  position: relative;
  flex: none;
  margin: auto;
  outline: 1px solid color-mix(in srgb, var(--ink, #888) 15%, transparent);
}
body[data-mode="preview"] .canvasFrame { outline-color: transparent; }

.canvas {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: 0 0;
  /* width/height/transform set in JS from state.canvas + measured scale */
}

.layer { position: absolute; inset: 0; pointer-events: none; }
#itemLayer { pointer-events: auto; }
/* Frame handles must sit above the item layer, or the full-plane #itemLayer
   swallows every pointerdown before a handle or edge can see it. */
#frameHandles { z-index: 5; }

/* ---------- export frame ------------------------------------------------- */

.exportFrame {
  position: absolute;
  pointer-events: none;
  outline: calc(1.5px / var(--k, 1)) solid color-mix(in srgb, var(--ink, #888) 40%, transparent);
  /* One enormous shadow dims the whole plane except this rectangle. */
  box-shadow: 0 0 0 99999px var(--outsideDim, rgba(128,128,128,.10));
  transition: box-shadow .2s;
}
.exportFrame.sel { outline-color: var(--focus); }
.frameTag {
  position: absolute;
  left: 0;
  bottom: 100%;
  /* Clear of the Bento labels, which sit in the band just above the frame. */
  margin-bottom: calc(23px / var(--k, 1));
  display: flex;
  align-items: center;
  gap: calc(5px / var(--k, 1));
  padding: calc(4px / var(--k, 1)) calc(9px / var(--k, 1));
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: calc(11px / var(--k, 1));
  line-height: 1.4;
  white-space: nowrap;
  color: var(--chromeInk);
  background: var(--chromeBg);
  border: calc(1px / var(--k, 1)) solid var(--chromeLine);
  border-radius: calc(7px / var(--k, 1));
  pointer-events: auto;
}
.frameTag b {
  font-weight: 600;
  max-width: calc(340px / var(--k, 1));
  overflow: hidden;
  text-overflow: ellipsis;
}
.frameWord { opacity: .5; font-size: .92em; }
.frameTag:hover { background: var(--chromeHover); }
/* The name reads as editable text, because that is exactly what it is. */
.frameTag b { cursor: text; border-radius: calc(4px / var(--k, 1)); }
.frameTag:hover b { text-decoration: underline dotted; text-underline-offset: calc(2px / var(--k, 1)); }
.exportFrame.sel .frameTag { background: var(--focus); border-color: var(--focus); color: #fff; }

#frameHandles .fHandle {
  position: absolute;
  width: calc(12px / var(--k, 1));
  height: calc(12px / var(--k, 1));
  margin: calc(-6.5px / var(--k, 1)) 0 0 calc(-6.5px / var(--k, 1));
  background: var(--focus);
  border: calc(1.5px / var(--k, 1)) solid #fff;
  border-radius: calc(3px / var(--k, 1));
  pointer-events: auto;
  touch-action: none;
}
#frameHandles .fHandle[data-dir="nw"], #frameHandles .fHandle[data-dir="se"] { cursor: nwse-resize; }
#frameHandles .fHandle[data-dir="ne"], #frameHandles .fHandle[data-dir="sw"] { cursor: nesw-resize; }
#frameHandles .fHandle[data-dir="n"], #frameHandles .fHandle[data-dir="s"] { cursor: ns-resize; }
#frameHandles .fHandle[data-dir="e"], #frameHandles .fHandle[data-dir="w"] { cursor: ew-resize; }
/* Four thin strips along the frame edges — dragging any of them moves the
   frame. The interior is deliberately left free so Bentos stay clickable. */
#frameHandles .fMove {
  position: absolute;
  pointer-events: auto;
  cursor: move;
  background: transparent;
}

/* In preview the frame is the whole world: everything outside is hidden. */
body[data-mode="preview"] .exportFrame {
  outline-color: transparent;
  box-shadow: 0 0 0 99999px var(--canvasBg);
}
body[data-mode="preview"] .frameTag,
body[data-mode="preview"] #frameHandles { display: none; }

/* A count of anything that would be cropped. */
.outsideWarn {
  position: fixed;
  z-index: 295;
  left: 50%;
  bottom: 52px;
  transform: translateX(-50%);
  display: none;
  align-items: center;
  gap: 9px;
  padding: 7px 8px 7px 14px;
  font-size: 12px;
  color: var(--chromeInk);
  background: var(--chromeBg);
  border: 1px solid var(--chromeLine);
  border-radius: 999px;
  box-shadow: var(--chromeShadow);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}
.outsideWarn.on { display: flex; }
body[data-mode="preview"] .outsideWarn { display: none; }
.outsideWarn button {
  height: 26px;
  padding: 0 11px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 999px;
  color: var(--chromeSolid);
  background: var(--chromeInk);
}

/* ---------- Bento name labels -------------------------------------------- */

/* One label per Bento, sitting just above it — the canvas equivalent of a
   layer list. Editor only: never previewed, never exported. */
#labelLayer .bLabel {
  position: absolute;
  transform: translate3d(var(--dx, 0px), var(--dy, 0px), 0);
  max-width: 100%;
  padding: calc(2px / var(--k, 1)) calc(6px / var(--k, 1));
  margin-bottom: calc(5px / var(--k, 1));
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: calc(10.5px / var(--k, 1));
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--chromeInkSoft);
  background: transparent;
  border: 0;
  border-radius: calc(5px / var(--k, 1));
  pointer-events: auto;
  cursor: text;
  transition: color .12s, background .12s;
}
#labelLayer .bLabel:hover { color: var(--chromeInk); background: var(--chromeHover); }
#labelLayer .bLabel.sel { color: #fff; background: var(--focus); }
#labelLayer .bLabel.untitled { font-style: italic; opacity: .68; }
body[data-mode="preview"] #labelLayer { display: none; }

/* Renaming happens where the name lives. */
#labelLayer .bLabelEdit, .frameTag .frameEdit {
  font: inherit;
  color: var(--chromeInk);
  background: var(--chromeSolid);
  border: calc(1.5px / var(--k, 1)) solid var(--focus);
  border-radius: calc(5px / var(--k, 1));
  padding: calc(1px / var(--k, 1)) calc(5px / var(--k, 1));
  outline: none;
  min-width: calc(60px / var(--k, 1));
}
#labelLayer .bLabelEdit {
  position: absolute;
  transform: translate3d(var(--dx, 0px), var(--dy, 0px), 0);
  pointer-events: auto;
  /* The layer sets no font, so the input has to state the label's own. */
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: calc(10.5px / var(--k, 1));
  line-height: 1.5;
}
.frameTag .frameEdit { max-width: calc(340px / var(--k, 1)); font-weight: 600; }

/* ---------- selection + guides (counter-scaled by --k) ------------------- */

#guideLayer .guide {
  position: absolute;
  background: var(--focus);
  opacity: .85;
}
#guideLayer .guide.v { width: calc(1px / var(--k, 1)); top: 0; bottom: 0; }
#guideLayer .guide.h { height: calc(1px / var(--k, 1)); left: 0; right: 0; }
#guideLayer .gap {
  position: absolute;
  border: calc(1px / var(--k,1)) dashed var(--focus);
  opacity: .5;
}

#selectionLayer .ring {
  position: absolute;
  border: calc(1.5px / var(--k, 1)) solid var(--focus);
  border-radius: calc(3px / var(--k, 1));
  pointer-events: none;
}
#selectionLayer .handle {
  position: absolute;
  width: calc(11px / var(--k, 1));
  height: calc(11px / var(--k, 1));
  margin: calc(-6px / var(--k, 1)) 0 0 calc(-6px / var(--k, 1));
  background: #fff;
  border: calc(1.5px / var(--k, 1)) solid var(--focus);
  border-radius: calc(3px / var(--k, 1));
  pointer-events: auto;
  touch-action: none;
}
#selectionLayer .handle[data-dir="nw"] { cursor: nwse-resize; }
#selectionLayer .handle[data-dir="ne"] { cursor: nesw-resize; }
#selectionLayer .handle[data-dir="se"] { cursor: nwse-resize; }
#selectionLayer .handle[data-dir="sw"] { cursor: nesw-resize; }
#selectionLayer .handle[data-dir="n"], #selectionLayer .handle[data-dir="s"] { cursor: ns-resize; }
#selectionLayer .handle[data-dir="e"], #selectionLayer .handle[data-dir="w"] { cursor: ew-resize; }

#selectionLayer .rotHandle {
  position: absolute;
  width: calc(13px / var(--k,1));
  height: calc(13px / var(--k,1));
  margin: calc(-7px / var(--k,1)) 0 0 calc(-7px / var(--k,1));
  border-radius: 50%;
  background: var(--focus);
  border: calc(1.5px / var(--k,1)) solid #fff;
  pointer-events: auto;
  cursor: grab;
  touch-action: none;
}

#selectionLayer .badge {
  position: absolute;
  display: flex;
  gap: calc(3px / var(--k,1));
  padding: calc(3px / var(--k,1));
  background: var(--focus);
  border-radius: calc(7px / var(--k,1));
  pointer-events: auto;
  white-space: nowrap;
}
#selectionLayer .badge button {
  width: calc(22px / var(--k,1));
  height: calc(22px / var(--k,1));
  font-size: calc(12px / var(--k,1));
  line-height: 1;
  color: #fff;
  border-radius: calc(5px / var(--k,1));
  display: grid;
  place-items: center;
}
#selectionLayer .badge button:hover { background: rgba(255,255,255,.25); }

/* Marquee selection rectangle */
#marquee {
  position: absolute;
  display: none;
  border: calc(1px / var(--k,1)) solid var(--focus);
  background: color-mix(in srgb, var(--focus) 14%, transparent);
  pointer-events: none;
}

/* ---------- brand ------------------------------------------------------- */

.brand {
  position: fixed;
  z-index: 300;
  top: 18px;
  left: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px 7px 8px;
  border: 1px solid transparent;
  border-radius: 15px;
  color: var(--chromeInk);
  text-align: left;
  transition: background .16s, border-color .16s, opacity .2s;
}
.brand:hover { background: var(--chromeBg); border-color: var(--chromeLine); }
.brandMark { flex: none; width: 25px; height: 25px; }
.brandMark svg { display: block; fill: currentColor; }
.brandText { min-width: 0; }
.brandText b {
  display: block;
  /* The brand adopts the page's own display face, so chrome and canvas
     read as one surface rather than an app wrapped around a document. */
  font-family: var(--display, Georgia, serif);
  font-weight: 500;
  font-size: 15px;
  line-height: 1.1;
  letter-spacing: var(--displayTrack, -.01em);
}
.brandText small {
  display: block;
  font-family: var(--mono, ui-monospace, monospace);
  font-size: 9.5px;
  letter-spacing: .07em;
  color: var(--chromeInkSoft);
  margin-top: 2px;
  max-width: 20ch;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* The brand stays up in preview too, now reading "Bento Page". */
body[data-mode="preview"] .brand { opacity: 1; }

/* ---------- floating chrome --------------------------------------------- */

.floatTop {
  position: fixed;
  z-index: 300;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px;
  background: var(--chromeBg);
  border: 1px solid var(--chromeLine);
  border-radius: 20px;
  box-shadow: var(--chromeShadow);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  max-width: calc(100vw - 24px);
  transition: opacity .2s, transform .2s;
}
.floatTop .sep { width: 1px; height: 22px; background: var(--chromeLine); margin: 0 2px; }

.iconBtn, .pillBtn {
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 0 13px;
  font-size: 13px;
  font-weight: 550;
  color: var(--chromeInk);
  transition: background .14s, transform .14s, opacity .14s;
}
.iconBtn { width: 36px; padding: 0; font-size: 16px; }
.iconBtn:hover:not(:disabled), .pillBtn:hover:not(:disabled) { background: var(--chromeHover); }
.iconBtn:disabled, .pillBtn:disabled { opacity: .34; cursor: default; }
.pillBtn.primary { background: var(--chromeInk); color: var(--chromeSolid); }
.pillBtn.primary:hover { opacity: .87; background: var(--chromeInk); }
.zoomRead {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--chromeInkSoft);
  min-width: 38px;
  text-align: center;
}

.drawerTab {
  position: fixed;
  z-index: 300;
  top: 50%;
  width: 52px;
  height: 84px;
  display: grid;
  place-content: center;
  gap: 5px;
  background: var(--chromeBg);
  border: 1px solid var(--chromeLine);
  color: var(--chromeInk);
  box-shadow: var(--chromeShadow);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  transition: background .16s, transform .16s, opacity .2s;
}
.drawerTab b { font-size: 22px; font-weight: 400; line-height: 1; }
.drawerTab small { font-size: 9px; letter-spacing: .14em; color: var(--chromeInkSoft); }
.leftTab  { left: 0;  border-left: 0;  border-radius: 0 16px 16px 0; transform: translateY(-50%); }
.rightTab { right: 0; border-right: 0; border-radius: 16px 0 0 16px; transform: translateY(-50%); }
.leftTab:hover  { transform: translateY(-50%) translateX(2px); background: var(--chromeHover); }
.rightTab:hover { transform: translateY(-50%) translateX(-2px); background: var(--chromeHover); }

.hint {
  position: fixed;
  z-index: 290;
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  padding: 7px 14px;
  font-size: 11px;
  color: var(--chromeInkSoft);
  background: var(--chromeBg);
  border: 1px solid var(--chromeLine);
  border-radius: 999px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: opacity .2s;
  white-space: nowrap;
  overflow: hidden;
  max-width: calc(100vw - 32px);
}
.hint kbd {
  font: inherit;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  color: var(--chromeInk);
  background: var(--chromeHover);
  border: 1px solid var(--chromeLine);
  border-radius: 4px;
  padding: 0 4px;
}

/* Preview mode hides all editing chrome. */
body[data-mode="preview"] .floatTop,
body[data-mode="preview"] .drawerTab,
body[data-mode="preview"] .hint { opacity: 0; pointer-events: none; }
body[data-mode="preview"] .exitPreview { opacity: 1; pointer-events: auto; }
.exitPreview {
  position: fixed;
  z-index: 320;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 40px;
  padding: 0 8px 0 16px;
  font-size: 13px;
  font-weight: 550;
  background: var(--chromeBg);
  border: 1px solid var(--chromeLine);
  border-radius: 999px;
  box-shadow: var(--chromeShadow);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: opacity .2s;
}
.exitPreview kbd {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 11px;
  padding: 3px 7px;
  border: 1px solid var(--chromeLine);
  border-radius: 6px;
  color: var(--chromeInkSoft);
}

/* ---------- tool rail ---------------------------------------------------- */

.rail {
  position: fixed;
  z-index: 300;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px;
  background: var(--chromeBg);
  border: 1px solid var(--chromeLine);
  border-radius: 18px;
  box-shadow: var(--chromeShadow);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  max-height: calc(100vh - 40px);
  transition: opacity .2s;
}
.railTools { display: contents; }
.railSep { width: 22px; height: 1px; background: var(--chromeLine); margin: 3px 0; }

.tool {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: var(--chromeInk);
  border: 1px solid transparent;
  transition: background .13s, color .13s, transform .13s;
}
.tool:hover { background: var(--chromeHover); }
.tool[aria-pressed="true"] {
  background: var(--chromeInk);
  color: var(--chromeSolid);
}
.tool .tIcon { font-size: 17px; line-height: 1; font-weight: 400; }
.tool .tIcon.small { font-size: 12px; letter-spacing: -.03em; }
.lockTool[aria-pressed="true"] { background: var(--focus); color: #fff; border-color: var(--focus); }
.tool:active { transform: scale(.94); }

/* Tooltip on the rail, since the buttons are icon-only. */
.tool::after {
  content: attr(data-label);
  position: absolute;
  left: 58px;
  padding: 5px 9px;
  font-size: 11.5px;
  font-weight: 550;
  white-space: nowrap;
  color: var(--chromeSolid);
  background: var(--chromeInk);
  border-radius: 7px;
  opacity: 0;
  pointer-events: none;
  transform: translateX(-4px);
  transition: opacity .12s, transform .12s;
}
.tool:hover::after { opacity: .96; transform: none; }
.tool { position: relative; }

.railMore {
  position: fixed;
  z-index: 310;
  left: 66px;
  top: 50%;
  transform: translateY(-50%);
  width: 232px;
  padding: 10px;
  background: var(--chromeBg);
  border: 1px solid var(--chromeLine);
  border-radius: 16px;
  box-shadow: var(--chromeShadow);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
}
.railMore[hidden] { display: none; }
.railMoreGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.railMoreGrid .tool {
  width: auto;
  height: 36px;
  grid-template-columns: 20px 1fr;
  justify-items: start;
  align-items: center;
  gap: 7px;
  display: grid;
  padding: 0 9px;
  font-size: 12px;
  font-weight: 500;
}
.railMoreGrid .tool::after { display: none; }

/* The ghost that follows the pointer when a tool is dragged onto the canvas. */
.toolGhost {
  position: fixed;
  z-index: 900;
  pointer-events: none;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--chromeSolid);
  background: var(--chromeInk);
  border-radius: 10px;
  opacity: .9;
  transform: translate(-50%, -50%);
  padding: 8px 12px;
}
.toolGhost[hidden] { display: none; }

body[data-tool]:not([data-tool=""]) .stage { cursor: crosshair; }

/* ---------- properties panel --------------------------------------------- */

.panel[hidden] { display: none; }
.panel {
  position: fixed;
  z-index: 300;
  right: 14px;
  top: 74px;
  bottom: 14px;
  width: 300px;
  display: flex;
  flex-direction: column;
  background: var(--chromeBg);
  border: 1px solid var(--chromeLine);
  border-radius: 18px;
  box-shadow: var(--chromeShadow);
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  transition: width .22s cubic-bezier(.2,.85,.25,1), background .2s;
  overflow: hidden;
}
.panelHead {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 8px 11px 15px;
  border-bottom: 1px solid var(--chromeLine);
}
.panelTitle {
  flex: 1;
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--chromeInkSoft);
  white-space: nowrap;
  overflow: hidden;
}
.panelCount { font-size: 10px; color: var(--chromeInkSoft); white-space: nowrap; }
.panelToggle {
  flex: none;
  width: 28px; height: 28px;
  border-radius: 8px;
  font-size: 17px;
  color: var(--chromeInk);
  transition: background .13s;
}
.panelToggle:hover { background: var(--chromeHover); }
.panelBody {
  flex: 1;
  overflow: auto;
  padding: 4px 15px 18px;
  overscroll-behavior: contain;
}

body[data-mode="preview"] .panel,
body[data-mode="preview"] .rail,
body[data-mode="preview"] .railMore { opacity: 0; pointer-events: none; }

/* Panel fields keep the dark sheet styling they already had. */
.panel .sectionLabel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 9px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--chromeInkSoft);
  margin: 18px 0 9px;
}
.panelBody > div:first-child > .sectionLabel:first-child,
.panelBody > .sectionLabel:first-child { margin-top: 4px; }

.panel .field { margin-bottom: 11px; }
.panel .field > label {
  display: block;
  font-size: 9px;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--chromeInkSoft);
  margin-bottom: 5px;
}
.panel .field input[type="text"], .panel .field input[type="url"],
.panel .field input[type="number"], .panel .field input[type="date"],
.panel .field textarea, .panel .field select {
  width: 100%;
  background: var(--fieldBg, rgba(0,0,0,.05));
  border: 1px solid var(--chromeLine);
  border-radius: 9px;
  padding: 8px 9px;
  font-size: 12.5px;
  color: var(--chromeInk);
  outline: none;
}
html[data-chrome="dark"] .panel .field input, html[data-chrome="dark"] .panel .field textarea,
html[data-chrome="dark"] .panel .field select { --fieldBg: rgba(255,255,255,.07); }
.panel .field textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
.panel .field input:focus, .panel .field textarea:focus, .panel .field select:focus { border-color: var(--focus); }
.panel .field .row { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.panel .help { font-size: 11px; line-height: 1.5; color: var(--chromeInkSoft); margin: -3px 0 11px; }
.panel .empty {
  font-size: 12px; line-height: 1.6;
  color: var(--chromeInkSoft);
  padding: 12px;
  border: 1px dashed var(--chromeLine);
  border-radius: 11px;
}

.btnRow { display: flex; gap: 6px; flex-wrap: wrap; }
.sBtn {
  flex: 1;
  min-width: 0;
  height: 32px;
  padding: 0 10px;
  font-size: 12px;
  font-weight: 550;
  color: var(--chromeInk);
  background: var(--chromeHover);
  border: 1px solid var(--chromeLine);
  border-radius: 9px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sBtn:hover { background: var(--chromeInk); color: var(--chromeSolid); }
.sBtn.danger { color: var(--danger); }
.sBtn.danger:hover { background: var(--danger); color: #fff; }

.zRow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
.chipRow { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  padding: 5px 10px;
  font-size: 11.5px;
  color: var(--chromeInk);
  background: var(--chromeHover);
  border: 1px solid var(--chromeLine);
  border-radius: 999px;
}
.chip:hover { background: var(--chromeInk); color: var(--chromeSolid); }
.chip[aria-pressed="true"] { background: var(--focus); border-color: var(--focus); color: #fff; }

.themeGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.themeCard {
  text-align: left;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--chromeLine);
  border-radius: 11px;
  color: var(--chromeInk);
  background: var(--chromeHover);
}
.themeCard:hover { border-color: var(--chromeInk); }
.themeCard[aria-pressed="true"] { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
/* Each card previews its theme: the band is painted in the theme's own canvas
   colour, with chips for its surface, accent and ink. */
.themeCard .themeSwatch { height: 46px; display: flex; align-items: center; gap: 7px; padding: 0 11px; }
.themeCard .themeSwatch i { width: 20px; height: 20px; border-radius: 6px; flex: none; box-shadow: inset 0 0 0 1px rgba(128,128,128,.28); }
.themeCard span { display: block; padding: 6px 8px 7px; }
.themeCard b { display: block; font-size: 9px; letter-spacing: .1em; }
.themeCard small { display: block; font-size: 10px; opacity: .55; margin-top: 1px; }

.fileMeta {
  display: flex; align-items: center; gap: 9px;
  padding: 9px;
  font-size: 11.5px;
  background: var(--chromeHover);
  border: 1px solid var(--chromeLine);
  border-radius: 9px;
  margin-bottom: 7px;
  overflow: hidden;
}
.fileMeta b { display: block; word-break: break-all; font-weight: 550; }
.fileMeta small { opacity: .55; }
.fileMeta .glyph { font-size: 16px; opacity: .7; flex: none; }

.pageRow {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  padding: 8px 9px;
  margin-bottom: 5px;
  text-align: left;
  background: var(--chromeHover);
  border: 1px solid var(--chromeLine);
  border-radius: 10px;
  color: var(--chromeInk);
}
.pageRow:hover { border-color: var(--chromeInk); }
.pageRow[aria-current="true"] { border-color: var(--focus); }
.pageRow .gInfo { flex: 1; min-width: 0; }
.pageRow b { display: block; font-size: 12.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pageRow small { font-size: 10px; opacity: .55; }
.pageRow .gAct { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; opacity: .55; color: var(--chromeInk); }
.pageRow .gAct:hover { opacity: 1; background: var(--chromeHover); }

/* ---------- modals ------------------------------------------------------- */

.modalWrap {
  position: fixed;
  inset: 0;
  z-index: 600;
  display: none;
  place-items: center;
  padding: 20px;
  background: rgba(8,8,10,.62);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.modalWrap.on { display: grid; }
.modal {
  width: min(440px, 100%);
  max-height: calc(100vh - 40px);
  overflow: auto;
  padding: 24px;
  background: var(--sheetBg);
  color: var(--sheetInk);
  border: 1px solid var(--sheetLine);
  border-radius: 18px;
  box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.modal h3 { margin: 0 0 4px; font-family: Georgia, serif; font-size: 23px; font-weight: 500; }
.modal .sub { font-size: 12px; opacity: .55; margin-bottom: 20px; line-height: 1.5; }
.modal .foot { display: flex; gap: 8px; margin-top: 20px; }
.modal .foot .sBtn.primary { background: var(--sheetInk); color: var(--sheetBg); border-color: var(--sheetInk); }
.checkRow { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; font-size: 13px; cursor: pointer; }
.checkRow input { margin: 2px 0 0; flex: none; width: 16px; height: 16px; accent-color: var(--focus); }
.checkRow span small { display: block; font-size: 11px; opacity: .5; margin-top: 2px; line-height: 1.45; }

.exportChoice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.exportChoice button {
  padding: 14px 12px;
  text-align: left;
  background: #1f2127;
  border: 1px solid var(--sheetLine);
  border-radius: 13px;
  color: var(--sheetInk);
}
.exportChoice button:hover { background: #292c33; }
.exportChoice button[aria-pressed="true"] { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.exportChoice b { display: block; font-size: 14px; margin-bottom: 4px; }
.exportChoice small { font-size: 11px; opacity: .55; line-height: 1.45; display: block; }

/* Lightbox + story sheet (also replicated into the export) */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 700;
  display: none;
  place-items: center;
  padding: 4vmin;
  background: rgba(6,6,8,.9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.lightbox.on { display: grid; }
.lightbox img { max-width: 100%; max-height: 84vh; object-fit: contain; border-radius: 6px; box-shadow: 0 30px 90px rgba(0,0,0,.6); }
.lightbox .lbCap { margin-top: 14px; text-align: center; color: #f1eee8; font-family: Georgia, serif; font-size: 17px; }
.lightbox .lbCap small { display: block; font-family: system-ui, sans-serif; font-size: 12px; opacity: .6; margin-top: 5px; }
.lbClose {
  position: fixed; top: 18px; right: 18px;
  width: 40px; height: 40px; border-radius: 12px;
  font-size: 20px; color: #f1eee8;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18);
}
.lbClose:hover { background: rgba(255,255,255,.22); }

/* ---------- document viewer ---------------------------------------------- */

#docViewer { align-content: center; }
.docStage {
  position: relative;
  display: grid;
  place-items: center;
  max-height: 78vh;
  min-height: 120px;
  min-width: 180px;
}
#docPage {
  max-width: min(920px, 94vw);
  max-height: 78vh;
  object-fit: contain;
  border-radius: 3px;
  background: #fff;
  box-shadow: 0 30px 90px rgba(0,0,0,.6);
}
.docSpin {
  position: absolute;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(242,239,233,.7);
  display: none;
}
.docSpin.on { display: block; }

.docCtl {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 16px auto 0;
  padding: 6px;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 14px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  flex-wrap: wrap;
  justify-content: center;
  max-width: 94vw;
}
.docBtn {
  min-width: 34px;
  height: 32px;
  padding: 0 9px;
  font-size: 15px;
  font-weight: 600;
  color: #f2efe9;
  border-radius: 9px;
}
.docBtn.wide { font-size: 12px; font-weight: 550; padding: 0 12px; }
.docBtn:hover:not(:disabled) { background: rgba(255,255,255,.18); }
.docBtn:disabled { opacity: .3; cursor: default; }
.docPos {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 11px;
  color: rgba(242,239,233,.8);
  min-width: 56px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.docDiv { width: 1px; height: 20px; background: rgba(255,255,255,.2); margin: 0 3px; }
.docCtl.single .docBtn[aria-label$="page"], .docCtl.single .docPos, .docCtl.single .docDiv { display: none; }

/* ---------- toast -------------------------------------------------------- */

.toastWrap {
  position: fixed;
  z-index: 800;
  bottom: 78px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column-reverse;
  align-items: center;
  gap: 7px;
  pointer-events: none;
  max-width: calc(100vw - 32px);
}
.toast {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 15px;
  font-size: 12.5px;
  font-weight: 500;
  color: #f2efe9;
  background: rgba(24,25,29,.95);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .2s, transform .2s;
  pointer-events: auto;
  max-width: 100%;
}
.toast.in { opacity: 1; transform: none; }
.toast.warn { border-color: rgba(255,178,80,.5); }
.toast.err  { border-color: rgba(255,120,90,.55); }
.toast .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast .undoBtn { flex: none; font-size: 12px; font-weight: 600; color: #9db4ff; text-decoration: underline; }

.sr {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

@media (max-width: 1120px) {
  .brandText { display: none; }
}
@media (max-width: 860px) {
  .panel { width: 260px; }
}
@media (max-width: 700px) {
  .brand { display: none; }
  .rail { left: 8px; gap: 2px; padding: 4px; border-radius: 14px; }
  .tool { width: 34px; height: 34px; border-radius: 10px; }
  .panel { top: auto; bottom: 8px; right: 8px; left: 8px; width: auto; max-height: 46vh; }
  .floatTop { top: 10px; gap: 3px; padding: 5px; border-radius: 16px; }
  .iconBtn, .pillBtn { height: 34px; padding: 0 10px; font-size: 12px; border-radius: 10px; }
  .iconBtn { width: 34px; }
  .drawerTab { width: 44px; height: 72px; }
  .hint { display: none; }
  .zoomRead { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; }
}

<body data-mode="edit">

<div class="app" id="app">

          </button>

    <span class="sep" aria-hidden="true"></span>
    <button class="iconBtn" id="bZoomOut" title="Zoom out" aria-label="Zoom out">−</button>

    <span class="sep" aria-hidden="true"></span>

        <div class="themeGrid" id="themeGrid"></div>
        <div class="sectionLabel"><span>This page</span></div>
        <div id="pagePanel"></div>
        <div class="sectionLabel"><span>Your pages</span><button class="gAct" id="bNewPage" title="New page" aria-label="New page" style="width:22px;height:22px">＋</button></div>
        <div id="pageList"></div>

  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"${extra ? ' ' + extra : ''}>${BENTO_MARK}</svg>`;

const themeOf = id => THEMES[id] || THEMES.editorial;

/**
 * Emit a theme's tokens as custom properties.
 * The Studio scopes them to `.gallery` so chrome is unaffected; the export
 * puts them on `:root` so the page background inherits them too.
 */
function themeCSS(id, sel = '.gallery') {
  const t = themeOf(id);
  const body = Object.entries(t.vars)
    .map(([k, v]) => `  --${k}: ${v};`).join('\n');
  return `${sel} {\n${body}\n}\n`;
}

/* --------------------------------------------------------------------------
   2. PAGE STYLESHEET
   Generated once and shared verbatim by the editor canvas and the export.
   This single source of truth is what makes preview == export. Sizes are in
   container-query units so a card renders identically at any canvas scale
   and in any output — no viewport units, no editor/export divergence.
   -------------------------------------------------------------------------- */

function pageCSS() {
  return `
/* The page stylesheet must be fully self-contained: it is used inside the
   SVG rasteriser and inside exported pages, neither of which inherit the
   editor's reset. Without this, padded boxes measure 40px too wide and text
   wraps in the wrong place. */
.gallery, .gallery *, .gallery *::before, .gallery *::after { box-sizing: border-box; }

/* Mobile browsers inflate text on narrow viewports, which would silently
   break a composition whose type sizes are tied to card dimensions. */
.gallery { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

.gallery {
  --outsideDim: color-mix(in srgb, var(--ink) 9%, transparent);
  position: relative;
  font-family: var(--body);
  color: var(--ink);
  background-color: var(--canvasBg);
  background-image: var(--texture);
  background-size: var(--textureSize);
  background-position: 0 0;
}

.gallery .item {
  position: absolute;
  transform: translate3d(var(--dx, 0px), var(--dy, 0px), 0) rotate(var(--rot, 0deg));
  will-change: transform;
}
.gallery .bento {
  container-type: size;
  position: relative;
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  border-radius: var(--radius);
  border: var(--borderW) solid var(--borderC);
  box-shadow: var(--shadow);
  background: var(--surface);
  color: var(--surfaceInk);
  transition: box-shadow .18s ease, transform .18s ease;
}

/* Whole-card link target. Inert while editing so clicks select instead. */
.gallery .hit {
  display: block;
  width: 100%;
  height: 100%;
  color: inherit;
  text-decoration: none;
  border-radius: var(--radius);
  outline-offset: 3px;
}
.gallery[data-interactive="0"] .hit { pointer-events: none; }

/* Interactive affordances only exist where activation is possible. */
.gallery[data-interactive="1"] .item[data-live="1"] { cursor: pointer; }
.gallery[data-interactive="1"] .item[data-live="1"]:hover .bento {
  box-shadow: var(--shadowLift);
  transform: translateY(-2px);
}
.gallery .bento::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow: inset 0 0 0 var(--borderW) rgba(128,128,128,0);
}

.gallery .pad {
  position: relative;
  width: 100%;
  height: 100%;
  padding: var(--pad);
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: clamp(5px, 1.6cqi, 12px);
  overflow: hidden;
}
.gallery .pad.top { justify-content: flex-start; }
.gallery .pad.between { justify-content: space-between; }

/* When a card is too small for its content, only the prose may give way —
   and it fades rather than being sliced mid-line. Without this, flexbox
   shrinks every child and headings get cut through the middle at larger
   type scales. */
.gallery .pad > * { flex: 0 0 auto; min-height: 0; }
.gallery .pad > .bdy, .gallery .pad > .md { flex: 0 1 auto; }

/* ---- type ramp (container-relative, identical everywhere) ---- */
.gallery .dsp {
  margin: 0;
  font-family: var(--display);
  font-weight: var(--displayWeight);
  letter-spacing: var(--displayTrack);

.gallery .item[data-clip~="bdy"] .bdy,

/* --------------------------------------------------------------------------
   3. UTILITIES
   -------------------------------------------------------------------------- */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const num = (v, fb = 0) => { const n = Number(v); return Number.isFinite(n) ? n : fb; };

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, m =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

/** Strip dangerous schemes. Allows http(s), mailto, tel, data, blob, #, relative. */
function safeURL(u) {
  const s = String(u ?? '').trim();
  if (!s) return '';
  // Test a probe with whitespace and control characters removed, so that
  // obfuscations like "java\tscript:" cannot slip through.
  const probe = s.replace(/[\s\u0000-\u001f\u007f]/g, '').toLowerCase();
  if (/^(javascript|vbscript|file|about):/.test(probe)) return '';
  return s;
}

function hostOf(u) {
  try { return new URL(u).host.replace(/^www\./, ''); }
  catch { return String(u || '').replace(/^\w+:\/\//, '').split('/')[0] || String(u || ''); }
}

function formatBytes(n) {
  if (!n) return '';
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (v >= 10 || i === 0 ? Math.round(v) : v.toFixed(1)) + ' ' + u[i];
}

/** Stable signed hash in [-1, 1] — used so jitter never changes between renders. */
function stableUnit(id) {
  let h = 2166136261;
  const s = 'bento' + id;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (((h >>> 0) % 2000) / 1000) - 1;
}

const uid = () => 'g' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

function debounce(fn, ms) {
  let t;
  const w = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  w.flush = () => { clearTimeout(t); fn(); };
  w.cancel = () => clearTimeout(t);
  return w;
}

function fileToDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error || new Error('read failed'));
    r.readAsDataURL(file);
  });
}
function fileToText(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result));
    r.onerror = () => rej(r.error || new Error('read failed'));
    r.readAsText(file);
  });
}

/** Best-effort inline of a remote image so exports are self-contained.
 *  Bounded by a timeout: a stalling host must never hang the export — it
 *  fails fast, the caller marks the image as "could not embed", and the
 *  file simply links to it instead. */
async function urlToDataURL(url) {
  if (!url || /^data:/i.test(url)) return url || '';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  let r;
  try {
    r = await fetch(url, { mode: 'cors', cache: 'force-cache', signal: ctrl.signal });
  } finally {
    clearTimeout(timer);
  }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const b = await r.blob();
  return await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result));
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(b);
  });
}

/* ---- tiny markdown renderer (headings, lists, quote, code, inline) ---- */

function mdInline(t) {
  return t
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
      (m, a, b) => `<a href="${esc(safeURL(b))}" target="_blank" rel="noopener noreferrer">${a}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/__([^_]+)__/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>');
}

function mdToHTML(src) {
  const lines = esc(src || '').split(/\r?\n/);
  const out = [];
  let list = null, fence = false, buf = [];
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };

  for (const raw of lines) {
    if (/^\s*```/.test(raw)) {
      if (fence) { out.push(`<pre>${buf.join('\n')}</pre>`); buf = []; fence = false; }
      else { closeList(); fence = true; }
      continue;
    }
    if (fence) { buf.push(raw); continue; }

    if (/^\s*$/.test(raw)) { closeList(); continue; }

    let m;
    if ((m = raw.match(/^(#{1,4})\s+(.*)$/))) {
      closeList();
      const n = m[1].length;
      out.push(`<h${n}>${mdInline(m[2])}</h${n}>`);
    } else if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(raw)) {
      closeList(); out.push('<hr>');
    } else if ((m = raw.match(/^\s*[-*+]\s+(.*)$/))) {
      if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
      out.push(`<li>${mdInline(m[1])}</li>`);
    } else if ((m = raw.match(/^\s*\d+[.)]\s+(.*)$/))) {
      if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
      out.push(`<li>${mdInline(m[1])}</li>`);
    } else if ((m = raw.match(/^\s*&gt;\s?(.*)$/))) {
      closeList(); out.push(`<blockquote>${mdInline(m[1])}</blockquote>`);
    } else {
      closeList(); out.push(`<p>${mdInline(raw)}</p>`);
    }
  }
  if (fence && buf.length) out.push(`<pre>${buf.join('\n')}</pre>`);
  closeList();
  return out.join('');
}

/** Plain text → simple paragraphs, used by the story sheet. */
function textToHTML(s) {
  return String(s || '').split(/\n{2,}/)
    .map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('');
}

/* --------------------------------------------------------------------------
   4. TYPE REGISTRY
   Adding a content type means adding one entry here plus one renderer.
   -------------------------------------------------------------------------- */

const TYPES = {
  image:    { label: 'Image',    glyph: '▧',   w: 380, h: 260 },
  text:     { label: 'Text',     glyph: 'T',   w: 320, h: 210 },
  quote:    { label: 'Quote',    glyph: '“', w: 300, h: 210 },
  link:     { label: 'Link',     glyph: '↗',   w: 300, h: 210 },
  number:   { label: 'Number',   glyph: '123', w: 250, h: 200 },
  markdown: { label: 'Markdown', glyph: '≡',   w: 340, h: 260 },
  video:    { label: 'Video',    glyph: '▶',   w: 380, h: 240 },
  audio:    { label: 'Audio',    glyph: '♪',   w: 300, h: 150 },
  pdf:      { label: 'PDF',      glyph: '▤',   w: 280, h: 200 },
  embed:    { label: 'Embed',    glyph: '</>', w: 340, h: 250 },
  place:    { label: 'Place',    glyph: '◎',   w: 320, h: 230 },
  person:   { label: 'Person',   glyph: '☺',   w: 300, h: 160 },
  file:     { label: 'File',     glyph: '◇',   w: 280, h: 190 },
  spacer:   { label: 'Spacer',   glyph: '□',   w: 240, h: 170 }
};

/** Which types the Add drawer offers, in order. */
const ADD_ORDER = ['image', 'text', 'quote', 'link', 'number', 'markdown',
  'video', 'audio', 'pdf', 'embed', 'place', 'person', 'spacer'];

/** Map a dropped file onto a content type. */
function typeForFile(file) {
  const n = (file.name || '').toLowerCase();
  const m = (file.type || '').toLowerCase();
  if (m.startsWith('image/')) return 'image';
  if (m.startsWith('video/')) return 'video';
  if (m.startsWith('audio/')) return 'audio';
  if (m.includes('pdf') || /\.pdf$/.test(n)) return 'pdf';
  if (/\.(md|markdown)$/.test(n)) return 'markdown';
  if (m.includes('html') || /\.html?$/.test(n)) return 'embed';
  if (/\.(txt|csv|json)$/.test(n) || m.startsWith('text/')) return 'text';
  return 'file';
}

function glyphFor(item) {
  if (item.type === 'pdf') return 'PDF';
  if (item.type === 'file') {
    const ext = (item.name || '').split('.').pop();
    if (ext && ext.length <= 4 && ext !== item.name) return ext.toUpperCase();
  }
  return (TYPES[item.type] || TYPES.file).glyph;
}

/* --------------------------------------------------------------------------
   5. DEFAULT CONTENT
   Self-contained: the seed image is a generated data URI so a first run works
   offline and the default composition is never a broken-image icon.
   -------------------------------------------------------------------------- */

function seedImage() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
<defs>
<linearGradient id="s" x1="0" y1="0" x2=".7" y2="1">
<stop offset="0" stop-color="#2c4a63"/><stop offset=".45" stop-color="#7d6a86"/>
<stop offset="1" stop-color="#d9a06a"/></linearGradient>
<radialGradient id="g" cx=".72" cy=".2" r=".55">
<stop offset="0" stop-color="#ffe9c4" stop-opacity=".95"/>
<stop offset="1" stop-color="#ffe9c4" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="800" fill="url(#s)"/>
<circle cx="864" cy="160" r="300" fill="url(#g)"/>
<path d="M0 640 L250 470 L430 600 L640 420 L840 560 L1040 430 L1200 520 L1200 800 L0 800Z" fill="#1d2a38" opacity=".82"/>
<path d="M0 720 L300 590 L560 700 L820 600 L1060 690 L1200 640 L1200 800 L0 800Z" fill="#141d27" opacity=".9"/>
</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace(/\n/g, ''));
}

function defaultPage(w, h) {
  const cw = clamp(Math.round(w || 1440), 900, 2400);
  const ch = clamp(Math.round(h || 900), 640, 2000);
  const sx = cw / 1440, sy = ch / 900;
  let seq = 0;
  const S = (x, y, iw, ih) => ({
    x: Math.round(x * sx), y: Math.round(y * sy),
    w: Math.round(iw * sx), h: Math.round(ih * sy),
    z: ++seq, rot: 0
  });
  return {
    version: SCHEMA,
    id: uid(),
    title: 'Untitled Page',
    description: '',
    date: new Date().toISOString().slice(0, 10),
    author: '',
    updated: Date.now(),
    theme: 'editorial',
    frame: { x: 0, y: 0, w: cw, h: ch },
    canvas: { w: cw, h: ch },
    next: 8,
    items: [
      { id: 1, type: 'image', ...S(64, 70, 470, 320), title: 'Somewhere worth remembering', body: 'The light was better than the photo.', image: seedImage(), fit: 'cover', focal: '50% 50%', story: 'Every page starts with one thing you did not want to forget.\n\nClick any Bento in Preview to open its link, expand its image, or read its story.' },
      { id: 2, type: 'quote', ...S(560, 70, 330, 230), body: 'The things you make become places you can return to.', by: 'a note to self' },
      { id: 3, type: 'link', ...S(916, 70, 300, 320), title: 'Something I Built', body: 'A small experiment that became something bigger.', url: 'https://github.com', href: 'https://github.com' },
      { id: 4, type: 'number', ...S(560, 326, 330, 230), title: '37', body: 'things shipped' },
      { id: 5, type: 'text', ...S(64, 416, 470, 240), title: 'Bento Page', body: 'A canvas for anything worth showing — projects, places, ideas, people, memories. No categories required. Drag, resize, restyle, then export it as your own standalone artifact.' },
      { id: 6, type: 'markdown', ...S(916, 416, 300, 240), title: 'Notes', body: '### How this works\n\n- **Drop** a file anywhere\n- **Drag** to move, **⌥** for free placement\n- **⇧** keeps the ratio while resizing\n\nThen `Export` and it is yours.' },
      { id: 7, type: 'place', ...S(64, 676, 470, 180), title: 'Kyoto', body: 'Third visit. Still not enough.', meta: '35.0116, 135.7681', href: 'https://www.openstreetmap.org/?mlat=35.0116&mlon=135.7681#map=12/35.0116/135.7681' }
    ]
  };
}

/* --------------------------------------------------------------------------
   6. SCHEMA MIGRATION + VALIDATION
   A malformed or legacy blob must never produce a blank, unrecoverable app.
   -------------------------------------------------------------------------- */

function migrate(raw) {
  if (!raw || typeof raw !== 'object') throw new Error('not an object');
  const s = { ...raw };
  const v = num(s.version, 1);

  // v1/v2 -> v3: fixed 1100x720 canvas; "blank" became "spacer";
  // "artifact" split into typed cards; href/story/z did not exist.
  if (v < 3) {
    s.canvas = s.canvas && num(s.canvas.w) ? s.canvas : { w: 1100, h: 720 };
    s.theme = ({ light: 'editorial', dark: 'midnight', paper: 'paper', neon: 'neon' })[s.theme] || 'editorial';
    s.items = (Array.isArray(s.items) ? s.items : []).map(it => {
      const o = { ...it };
      if (o.type === 'blank') o.type = 'spacer';
      if (o.type === 'artifact') {
        o.type = typeForFile({ name: o.name || '', type: o.mime || '' });
        if (o.type === 'image' && !o.image) o.image = o.data || '';
      }
      if (o.type === 'link' && o.url && !o.href) o.href = o.url;
      return o;
    });
  }

  s.version = SCHEMA;
  s.id = typeof s.id === 'string' && s.id ? s.id : uid();
  s.title = typeof s.title === 'string' ? s.title : 'Untitled Page';
  s.description = typeof s.description === 'string' ? s.description : '';
  s.date = typeof s.date === 'string' ? s.date : new Date().toISOString().slice(0, 10);
  s.author = typeof s.author === 'string' ? s.author : '';
  s.updated = Math.max(0, Math.round(num(s.updated, 0)));
  s.theme = THEMES[s.theme] ? s.theme : 'editorial';

  // v3 -> v4: the canvas stopped being a wall and became an export frame on
  // an otherwise unbounded plane.
  const cw = clamp(Math.round(num(s.canvas?.w ?? s.frame?.w, 1440)), 200, 20000);
  const ch = clamp(Math.round(num(s.canvas?.h ?? s.frame?.h, 900)), 200, 20000);
  s.frame = {
    x: Math.round(num(s.frame?.x, 0)),
    y: Math.round(num(s.frame?.y, 0)),
    w: cw, h: ch
  };
  // Kept as a mirror of the frame size so older code paths and exports that
  // ask for "the canvas" still get a sensible answer.
  s.canvas = { w: cw, h: ch };

  const seen = new Set();
  s.items = (Array.isArray(s.items) ? s.items : []).map((it, idx) => {
    if (!it || typeof it !== 'object') return null;
    const o = { ...it };
    o.type = TYPES[o.type] ? o.type : 'text';
    let id = Math.round(num(o.id, idx + 1));
    while (seen.has(id) || id <= 0) id++;
    seen.add(id);
    o.id = id;
    o.w = clamp(Math.round(num(o.w, TYPES[o.type].w)), MIN_W, 20000);
    o.h = clamp(Math.round(num(o.h, TYPES[o.type].h)), MIN_H, 20000);
    o.x = Math.round(num(o.x, 0));
    o.y = Math.round(num(o.y, 0));
    o.z = Math.round(num(o.z, idx + 1));
    o.rot = clamp(num(o.rot, 0), -45, 45);
    for (const k of ['title', 'body', 'by', 'url', 'href', 'story', 'name', 'mime', 'image', 'data', 'alt', 'meta', 'fit', 'focal', 'html', 'poster', 'preview'])
      if (o[k] != null && typeof o[k] !== 'string') o[k] = String(o[k]);
    o.size = Math.max(0, Math.round(num(o.size, 0)));
    if (o.pages != null) o.pages = Math.max(0, Math.round(num(o.pages, 0))) || undefined;
    if (o.fit !== 'contain') o.fit = 'cover';
    if (!o.focal) o.focal = '50% 50%';
    return o;
  }).filter(Boolean);

  // Normalise z to a dense 1..n stack.
  s.items.sort((a, b) => a.z - b.z).forEach((it, i) => { it.z = i + 1; });

  // Re-origin the plane so content always sits a constant pad from the top
  // left of the element, whatever coordinates it was saved with.
  const boxes = s.items.map(i => ({ x: i.x, y: i.y, w: i.w, h: i.h })).concat([s.frame]);
  const minX = Math.min(...boxes.map(b => b.x));
  const minY = Math.min(...boxes.map(b => b.y));
  const ox = Math.round(PLANE_PAD - minX), oy = Math.round(PLANE_PAD - minY);
  if (ox || oy) {
    for (const it of s.items) { it.x += ox; it.y += oy; }
    s.frame.x += ox;
    s.frame.y += oy;
  }
  s.next = Math.max(1, Math.round(num(s.next, 1)), ...s.items.map(i => i.id + 1));
  return s;
}

/* --------------------------------------------------------------------------
   7. STORAGE
   IndexedDB primary (base64 media blows the ~5MB localStorage quota fast),
   localStorage fallback for environments where IDB is unavailable. Writes are
   debounced and every failure surfaces to the user rather than being swallowed.
   -------------------------------------------------------------------------- */

const DB_NAME = 'bento-pages';
const STORE = 'pages';
const IDX_KEY = 'bento:index';
const LAST_KEY = 'bento:last';
const LS_PREFIX = 'bento:p:';

// Pre-rebrand namespace. Kept solely so a one-time migration can lift existing
// work into the new names above. The originals are never deleted — they remain
// untouched as a rollback backup.
const LEGACY_DB = 'bento-gallery';
const LEGACY_STORE = 'galleries';
const LEGACY_LS_PREFIX = 'bento:g:';
const MIGRATED_KEY = 'bento:migrated';

const Store = {
  mode: 'pending',
  _db: null,

  async init() {
    try {
      this._db = await this._openIDB();
      this.mode = 'idb';
    } catch {
      this.mode = this._lsOK() ? 'ls' : 'none';
    }
    try { await this._migrate(); } catch {}
    return this.mode;
  },

  _lsOK() {
    try { localStorage.setItem('bento:probe', '1'); localStorage.removeItem('bento:probe'); return true; }
    catch { return false; }
  },

  _openIDB() {
    return new Promise((res, rej) => {
      if (!self.indexedDB) return rej(new Error('no idb'));
      let done = false;
      const timer = setTimeout(() => { if (!done) { done = true; rej(new Error('idb timeout')); } }, 2500);
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = () => { if (!done) { done = true; clearTimeout(timer); res(req.result); } };
      req.onerror = () => { if (!done) { done = true; clearTimeout(timer); rej(req.error); } };
      req.onblocked = () => { if (!done) { done = true; clearTimeout(timer); rej(new Error('blocked')); } };
    });
  },

  _tx(mode, run) {
    return new Promise((res, rej) => {
      const tx = this._db.transaction(STORE, mode);
      const req = run(tx.objectStore(STORE));
      tx.oncomplete = () => res(req ? req.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('aborted'));
    });
  },

  /* One-time lift of pre-rebrand data into the new namespace, then tear the
     originals down. Idempotent and retried until it completes (the flag is only
     set at the end); each original is removed only after its copy is confirmed
     in the new namespace, so an interrupted run can never lose data. */
  async _migrate() {
    if (localStorage.getItem(MIGRATED_KEY) === '1') return;

    // localStorage fallback: bento:g:<id> -> bento:p:<id>, dropping each
    // original the moment its copy is written.
    try {
      for (const k of Object.keys(localStorage)) {
        if (!k.startsWith(LEGACY_LS_PREFIX)) continue;
        try {
          const nk = LS_PREFIX + k.slice(LEGACY_LS_PREFIX.length);
          if (localStorage.getItem(nk) == null) localStorage.setItem(nk, localStorage.getItem(k));
          localStorage.removeItem(k);
        } catch {}
      }
    } catch {}

    // IndexedDB: bento-gallery/galleries -> bento-pages/pages
    if (this.mode === 'idb') {
      const old = await this._openLegacyIDB();
      if (old) {
        let copied = false;
        try {
          const records = await new Promise((res, rej) => {
            const out = [];
            const cur = old.transaction(LEGACY_STORE, 'readonly').objectStore(LEGACY_STORE).openCursor();
            cur.onsuccess = e => { const c = e.target.result; if (c) { out.push([c.key, c.value]); c.continue(); } else res(out); };
            cur.onerror = () => rej(cur.error);
          });
          // put by the same key, so re-running is a harmless overwrite.
          for (const [key, value] of records) await this._tx('readwrite', s => s.put(value, key));
          copied = true;
        } catch {} finally { old.close(); }
        // only drop the legacy DB once its contents are safely in the new one.
        if (copied) { try { indexedDB.deleteDatabase(LEGACY_DB); } catch {} }
      }
    }

    try { localStorage.setItem(MIGRATED_KEY, '1'); } catch {}
  },

  /* Open the legacy DB only if it truly exists with the old store. If opening
     would create it fresh (a clean install), tear that empty DB back down so we
     never leave one behind. */
  _openLegacyIDB() {
    return new Promise(res => {
      if (!self.indexedDB) return res(null);
      let fresh = false, req;
      try { req = indexedDB.open(LEGACY_DB); } catch { return res(null); }
      req.onupgradeneeded = () => { fresh = true; };
      req.onsuccess = () => {
        const db = req.result;
        if (fresh || !db.objectStoreNames.contains(LEGACY_STORE)) {
          db.close();
          if (fresh) { try { indexedDB.deleteDatabase(LEGACY_DB); } catch {} }
          return res(null);
        }
        res(db);
      };
      req.onerror = () => res(null);
      req.onblocked = () => res(null);
    });
  },

  async get(id) {
    if (this.mode === 'idb') return await this._tx('readonly', s => s.get(id));
    if (this.mode === 'ls') {
      const raw = localStorage.getItem(LS_PREFIX + id);
      return raw ? JSON.parse(raw) : undefined;
    }
  },

  async put(id, data) {
    if (this.mode === 'idb') return await this._tx('readwrite', s => s.put(data, id));
    if (this.mode === 'ls') localStorage.setItem(LS_PREFIX + id, JSON.stringify(data));
  },

  async del(id) {
    if (this.mode === 'idb') return await this._tx('readwrite', s => s.delete(id));
    if (this.mode === 'ls') localStorage.removeItem(LS_PREFIX + id);
  },

  /* The index is small and always in localStorage so the page switcher
     renders instantly, before IDB has opened. */
  index() {
    try {
      const a = JSON.parse(localStorage.getItem(IDX_KEY) || '[]');
      return Array.isArray(a) ? a.filter(e => e && typeof e.id === 'string') : [];
    } catch { return []; }
  },
  writeIndex(list) {
    try { localStorage.setItem(IDX_KEY, JSON.stringify(list.slice(0, 200))); } catch {}
  },
  touchIndex(state) {
    const list = this.index().filter(e => e.id !== state.id);
    list.unshift({
      id: state.id,
      title: state.title || 'Untitled Page',
      theme: state.theme,
      count: state.items.length,
      updated: Date.now()
    });
    this.writeIndex(list);
  },
  dropIndex(id) { this.writeIndex(this.index().filter(e => e.id !== id)); },

  last() { try { return localStorage.getItem(LAST_KEY) || ''; } catch { return ''; } },
  setLast(id) { try { localStorage.setItem(LAST_KEY, id); } catch {} },

  /** Park a blob we could not parse so the user's bytes are never destroyed. */
  quarantine(raw) {
    try {
      const k = 'bento:corrupt:' + Date.now();
      localStorage.setItem(k, typeof raw === 'string' ? raw.slice(0, 500000) : JSON.stringify(raw).slice(0, 500000));
      return k;
    } catch { return ''; }
  }
};

/* ==========================================================================
   Part 2/3 — state, layout, rendering, direct manipulation, history.
   ========================================================================== */

/* --------------------------------------------------------------------------
   8. STATE
   -------------------------------------------------------------------------- */

let state = defaultPage(1440, 900);

const view = {
  k: 1,                 // measured canvas scale (screen px per logical px)
  zoom: 'fit',          // 'fit' | number
  mode: 'edit',         // 'edit' | 'preview'
  sel: new Set(),       // selected item ids
  frameSel: false,      // is the export frame the current selection?
  tool: '',             // armed Bento type, '' for the select tool
  lastPointer: null     // last known world coords
};

const el = {
  stage: $('#stage'), frame: $('#canvasFrame'), canvas: $('#canvas'),
  exportFrame: $('#exportFrame'), frameHandles: $('#frameHandles'),
  items: $('#itemLayer'), labels: $('#labelLayer'),
  guides: $('#guideLayer'), selection: $('#selectionLayer'),
  marquee: $('#marquee'), toastWrap: $('#toastWrap')
};

const byId = id => state.items.find(i => i.id === id);
const selected = () => state.items.filter(i => view.sel.has(i.id));

/** Drop selected ids whose items no longer exist. */
function pruneSelection() {
  if (!view.sel.size) return;
  for (const id of [...view.sel]) if (!byId(id)) view.sel.delete(id);
}

function soleSelected() {
  pruneSelection();
  return view.sel.size === 1 ? byId([...view.sel][0]) : null;
}

/* --------------------------------------------------------------------------
   9. TOASTS
   Every message the app wants to give the user actually appears, and is
   removed from the DOM afterwards.
   -------------------------------------------------------------------------- */

function flash(msg, kind = '', action = null) {
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  const tx = document.createElement('span');
  tx.className = 'tx';
  tx.textContent = msg;
  t.appendChild(tx);
  if (action) {
    const b = document.createElement('button');
    b.className = 'undoBtn';
    b.textContent = action.label;
    b.addEventListener('click', () => { action.run(); dismiss(); });
    t.appendChild(b);
  }
  el.toastWrap.appendChild(t);
  requestAnimationFrame(() => t.classList.add('in'));
  let done = false;
  const dismiss = () => {
    if (done) return;
    done = true;
    t.classList.remove('in');
    setTimeout(() => t.remove(), 250);
  };
  setTimeout(dismiss, action ? 5200 : 2100);
  while (el.toastWrap.children.length > 4) el.toastWrap.firstElementChild.remove();
  return dismiss;
}

/* --------------------------------------------------------------------------
   10. HISTORY
   begin() snapshots before a mutation; commit() only records if something
   actually changed, so plain selection clicks never pollute the stack.
   -------------------------------------------------------------------------- */

const History = {
  undo: [], redo: [], pending: null, MAX: 120,

  begin() { if (this.pending === null) this.pending = JSON.stringify(state); },

  commit(label = 'Edit') {
    if (this.pending === null) return false;
    const before = this.pending;
    this.pending = null;
    if (before === JSON.stringify(state)) return false;   // no-op gesture
    this.undo.push({ snap: before, label });
    if (this.undo.length > this.MAX) this.undo.shift();
    this.redo.length = 0;
    save();
    syncHistoryUI();
    return true;
  },

  abort() { this.pending = null; },

  step(dir) {
    const from = dir === 'undo' ? this.undo : this.redo;
    const to = dir === 'undo' ? this.redo : this.undo;
    if (!from.length) return;
    const entry = from.pop();
    to.push({ snap: JSON.stringify(state), label: entry.label });
    const keep = [...view.sel];
    try { state = migrate(JSON.parse(entry.snap)); }
    catch { flash('Could not restore that step', 'err'); return; }
    view.sel = new Set(keep.filter(id => byId(id)));   // preserve selection
    applyTheme();
    layout();
    render();
    updateOutsideWarning();
    save();
    syncHistoryUI();
    flash((dir === 'undo' ? 'Undo · ' : 'Redo · ') + entry.label);
  }
};

function syncHistoryUI() {
  $('#bUndo').disabled = !History.undo.length;
  $('#bRedo').disabled = !History.redo.length;
  $('#bUndo').title = History.undo.length ? `Undo ${History.undo.at(-1).label} (⌘Z)` : 'Nothing to undo';
  $('#bRedo').title = History.redo.length ? `Redo ${History.redo.at(-1).label} (⇧⌘Z)` : 'Nothing to redo';
}

/** Debounced typing transaction: one history entry per burst of edits. */
const commitTyping = debounce(() => History.commit('Content edit'), 550);

/* --------------------------------------------------------------------------
   11. PERSISTENCE
   Autosave on every change. Failures are reported, never swallowed.
   -------------------------------------------------------------------------- */

let saveWarned = false;

const save = debounce(async () => {
  try {
    state.updated = Date.now();
    await Store.put(state.id, state);
    Store.touchIndex(state);
    Store.setLast(state.id);
    renderPageList();
    saveWarned = false;
  } catch (err) {
    const quota = err && /quota|exceeded|storage/i.test(err.name + ' ' + err.message);
    if (!saveWarned) {
      saveWarned = true;
      flash(quota
        ? 'Out of local storage — export this page to keep it safe'
        : 'Could not autosave: ' + (err?.message || 'unknown error'), 'err');
    }
  }
}, 500);

/** Mobile Safari never fires beforeunload reliably; pagehide does. */
function flushSave() {
  save.flush?.();
  try {
    Store.touchIndex(state);
    Store.setLast(state.id);
  } catch {}
}
addEventListener('pagehide', flushSave);
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
addEventListener('beforeunload', flushSave);

/* --------------------------------------------------------------------------
   12. LAYOUT
   The single place the logical→screen scale is decided. Everything that needs
   to convert between the two reads view.k, which is measured, never assumed.
   -------------------------------------------------------------------------- */

/** Below this the canvas stops being legible, so the stage scrolls instead. */
const MIN_FIT = 0.3;

/**
 * The plane has no edges: it is sized to whatever the content and the frame
 * currently span, plus a pad in every direction. Dragging past the pad simply
 * grows it (see normaliseWorld), so there is never a wall to hit.
 */
function planeBounds() {
  const boxes = state.items.map(i => ({ x: i.x, y: i.y, w: i.w, h: i.h }));
  boxes.push(state.frame);
  const x = Math.min(...boxes.map(b => b.x));
  const y = Math.min(...boxes.map(b => b.y));
  const r = Math.max(...boxes.map(b => b.x + b.w));
  const b = Math.max(...boxes.map(b => b.y + b.h));
  return { x, y, w: r - x, h: b - y };
}

/**
 * Shift the whole world so nothing sits at a negative coordinate, keeping a
 * constant pad around it. Called after a gesture, never during one, and the
 * stage is scrolled by the same amount so the view does not jump.
 */
function normaliseWorld({ keepView = true } = {}) {
  const b = planeBounds();
  const dx = Math.round(PLANE_PAD - b.x);
  const dy = Math.round(PLANE_PAD - b.y);
  if (!dx && !dy) return false;
  for (const it of state.items) { it.x += dx; it.y += dy; }
  state.frame.x += dx;
  state.frame.y += dy;
  if (keepView) {
    const k = measuredScale();
    el.stage.scrollLeft += dx * k;
    el.stage.scrollTop += dy * k;
  }
  return true;
}

function planeSize() {
  const b = planeBounds();
  return { w: Math.ceil(b.w + PLANE_PAD * 2), h: Math.ceil(b.h + PLANE_PAD * 2) };
}

/** Fit the export frame — that is the part anyone else will ever see. */
/**
 * The rail and panel float over the canvas rather than resizing it, so the
 * "visible" area is the stage minus whatever they cover. Fitting and centring
 * both use this, which makes an open panel feel docked without the canvas
 * ever changing size. A closed panel covers nothing, so it costs nothing.
 */
function visibleInset() {
  // In preview the brand sits at the top-left, so reserve room for it — the fit
  // and centring both read this, which keeps the page clear of the logo.
  if (view.mode === 'preview') return { left: 40, right: 40, top: 116, bottom: 40 };
  const rail = document.querySelector('.rail');
  const panelEl = document.querySelector('.panel');
  const panel = panelEl && !panelEl.hidden ? panelEl : null;
  const narrow = innerWidth <= 700;
  return {
    left: (rail ? rail.getBoundingClientRect().width + 26 : 78),
    right: narrow ? 20 : (panel ? panel.getBoundingClientRect().width + 26 : 40),
    // The frame wears its name chip above itself, so leave that room too —
    // otherwise the page's name lands on top of the brand.
    top: 122,
    bottom: narrow && panel ? panel.getBoundingClientRect().height + 20 : 74
  };
}

function fitScale() {
  const ins = visibleInset();
  const availW = Math.max(120, el.stage.clientWidth - ins.left - ins.right);
  const availH = Math.max(120, el.stage.clientHeight - ins.top - ins.bottom);
  const fit = Math.min(1, availW / state.frame.w, availH / state.frame.h);
  return Math.min(1, Math.max(fit, MIN_FIT));
}

function layout(opts = {}) {
  const k = view.zoom === 'fit' ? fitScale() : clamp(view.zoom, 0.1, 4);
  view.k = k;
  const plane = planeSize();

  el.canvas.style.width = plane.w + 'px';
  el.canvas.style.height = plane.h + 'px';
  el.canvas.style.transform = `scale(${k})`;
  el.canvas.style.setProperty('--k', k);
  el.frame.style.width = Math.round(plane.w * k) + 'px';
  el.frame.style.height = Math.round(plane.h * k) + 'px';

  const f = state.frame;
  const fe = el.exportFrame;
  fe.style.left = f.x + 'px';
  fe.style.top = f.y + 'px';
  fe.style.width = f.w + 'px';
  fe.style.height = f.h + 'px';
  $('#frameSize').textContent = `${Math.round(f.w)} × ${Math.round(f.h)}`;
  const fn = $('#frameName');
  if (fn) fn.textContent = state.title || 'Untitled Page';
  fe.classList.toggle('sel', view.frameSel);
  $('#bFrame')?.setAttribute('aria-pressed', String(view.frameSel));

  $('#zoomRead').textContent = Math.round(k * 100) + '%';
  $('#bZoomFit').setAttribute('aria-pressed', String(view.zoom === 'fit'));

  renderFrameHandles();
  if (opts.centreFrame) centreOnFrame();
  updateOutsideWarning();
}

/** Scroll so the export frame sits in the middle of the viewport. */
function centreOnFrame() {
  const f = state.frame;
  // Force the pending transform/size to flush, or the scroll is computed
  // against the previous plane and the browser clamps or re-anchors it.
  void el.stage.scrollHeight;
  const k = measuredScale();
  const ins = visibleInset();
  // Centre within the part of the stage that is not under a panel.
  const cx = ins.left + (el.stage.clientWidth - ins.left - ins.right) / 2;
  const cy = ins.top + (el.stage.clientHeight - ins.top - ins.bottom) / 2;
  el.stage.scrollLeft = Math.max(0, (f.x + f.w / 2) * k - cx);
  el.stage.scrollTop = Math.max(0, (f.y + f.h / 2) * k - cy);
}

function renderFrameHandles() {
  const box = el.frameHandles;
  box.innerHTML = '';
  if (!view.frameSel || view.mode === 'preview') return;
  const f = state.frame;
  const dirs = [['nw', 0, 0], ['n', .5, 0], ['ne', 1, 0], ['e', 1, .5],
                ['se', 1, 1], ['s', .5, 1], ['sw', 0, 1], ['w', 0, .5]];
  // Four invisible strips over the frame edges make it draggable to move,
  // while leaving the interior free so the Bentos underneath stay clickable.
  const EDGE = 16;   // screen-px thickness of each grabbable edge
  const strip = css => {
    const d = document.createElement('div');
    d.className = 'fMove';
    d.dataset.dir = 'move';
    d.style.cssText = css;
    box.appendChild(d);
  };
  const thin = `calc(${EDGE}px / var(--k, 1))`;
  const off = `calc(${-EDGE / 2}px / var(--k, 1))`;
  strip(`left:${f.x}px;width:${f.w}px;top:${f.y}px;height:${thin};margin-top:${off}`);           // top
  strip(`left:${f.x}px;width:${f.w}px;top:${f.y + f.h}px;height:${thin};margin-top:${off}`);      // bottom
  strip(`top:${f.y}px;height:${f.h}px;left:${f.x}px;width:${thin};margin-left:${off}`);           // left
  strip(`top:${f.y}px;height:${f.h}px;left:${f.x + f.w}px;width:${thin};margin-left:${off}`);     // right
  for (const [dir, fx, fy] of dirs) {
    const h = document.createElement('div');
    h.className = 'fHandle';
    h.dataset.dir = dir;
    h.style.left = (f.x + f.w * fx) + 'px';
    h.style.top = (f.y + f.h * fy) + 'px';
    box.appendChild(h);
  }
}

/** Anything not fully inside the frame will be cropped — say so. */
function itemsOutsideFrame() {
  const f = state.frame;
  return state.items.filter(i =>
    i.x < f.x || i.y < f.y || i.x + i.w > f.x + f.w || i.y + i.h > f.y + f.h);
}

function updateOutsideWarning() {
  const n = itemsOutsideFrame().length;
  const box = $('#outsideWarn');
  box.classList.toggle('on', n > 0 && view.mode !== 'preview');
  if (n) $('#outsideMsg').textContent =
    `${n} Bento${n === 1 ? '' : 's'} outside the export frame`;
}

/** Screen → world coordinates on the plane. */
function toLogical(clientX, clientY) {
  const r = el.canvas.getBoundingClientRect();
  const k = measuredScale();
  return { x: (clientX - r.left) / k, y: (clientY - r.top) / k, k };
}

/** Measured scale — never trust view.k for pointer maths. */
function measuredScale() {
  const r = el.canvas.getBoundingClientRect();
  const planeW = el.canvas.offsetWidth || 1;
  return r.width / planeW || 1;
}

/* --------------------------------------------------------------------------
   13. CARD RENDERING
   cardHTML() and itemHTML() are the *only* place card markup exists, and the
   export calls exactly these functions. That is what guarantees preview,
   editor and export are the same pixels.
   -------------------------------------------------------------------------- */

/**
 * When true, cards render static equivalents instead of live media. Set only
 * while rasterising a PNG, where iframes and <video> cannot paint.
 */
let FLAT = false;

/** `${id}:${part}` for every text block measured as overflowing its card. */
const CLIPPED = new Set();

/**
 * Measure which text blocks actually overflow and record it. Runs after every
 * render; the result is written to the DOM immediately and reused by export.
 */
function markOverflow() {
  CLIPPED.clear();
  for (const node of el.items.querySelectorAll('.item')) {
    const parts = [];
    for (const n of node.querySelectorAll('.bdy, .md, .q')) {
      if (n.scrollHeight <= n.clientHeight + 1) continue;
      parts.push(n.classList.contains('md') ? 'md' : n.classList.contains('q') ? 'q' : 'bdy');
    }
    if (parts.length) {
      node.dataset.clip = parts.join(' ');
      parts.forEach(p => CLIPPED.add(node.dataset.id + ':' + p));
    } else {
      node.removeAttribute('data-clip');
    }
  }
}

const clipAttr = item => {
  const parts = ['bdy', 'md', 'q'].filter(p => CLIPPED.has(item.id + ':' + p));
  return parts.length ? ` data-clip="${parts.join(' ')}"` : '';
};

function rotFor(item) {
  const j = parseFloat(themeOf(state.theme).vars.jitter) || 0;
  return num(item.rot, 0) + (j ? j * stableUnit(item.id) : 0);
}

/** What happens when this card is activated, if anything. */
/**
 * Clicking any Bento opens the focus view. The kind only decides which glyph
 * the corner button shows and whether a real <a href> is worth emitting.
 */
function activationOf(item) {
  const f = focusOf(item);
  if (!f) return null;
  const href = safeURL(item.href || item.url);
  if (href && /^https?:|^mailto:|^tel:/i.test(href)) return { kind: f.kind, href };
  // No external URL, but a document or file still has something real behind
  // it — keep it in the anchor so "save link as" works.
  if (f.kind === 'doc' || f.kind === 'file') {
    const media = safeURL(item.data);
    if (media) return { kind: f.kind, href: media, local: true };
  }
  return { kind: f.kind, href: '' };
}

const ACT_GLYPH = {
  image: '⤢', video: '▶', embedVideo: '▶', audio: '♪', doc: '▤',
  html: '</>', page: '↗', reader: '⤢', file: '↓', text: '⤢'
};

/**
 * Corner buttons. The story marker shows in preview; the "open" marker shows
 * while editing, where a plain click has to mean "select".
 */
function dotsHTML(item) {
  const act = activationOf(item);
  const bits = [];
  if (act) {
    bits.push(`<button type="button" class="dot actDot" data-act-dot="1" tabindex="-1" title="Expand"><span aria-hidden="true">${ACT_GLYPH[act.kind] || '⤢'}</span></button>`);
  }
  if (item.story) {
    bits.push(`<button type="button" class="dot storyDot" data-story="1" tabindex="-1" title="Read more"><span aria-hidden="true">＋</span></button>`);
  }
  return bits.length ? `<span class="dots">${bits.join('')}</span>` : '';
}

function cardHTML(item) {
  const T = item.type;
  const title = esc(item.title || '');
  const body = esc(item.body || '');
  const dot = dotsHTML(item);

  if (T === 'image') {
    const cap = (item.title || item.body)
      ? `<figcaption>${item.title ? `<b>${title}</b>` : ''}${item.body ? `<span>${body}</span>` : ''}</figcaption>` : '';
    const img = item.image
      ? `<img src="${esc(safeURL(item.image))}" alt="${esc(item.alt || item.title || '')}" draggable="false" loading="lazy">`
      : `<div class="noimg">NO IMAGE</div>`;
    return `<figure class="bento b-image" style="--fit:${esc(item.fit || 'cover')};--focal:${esc(item.focal || '50% 50%')}">${img}${cap ? '<div class="shade"></div>' : ''}${cap}${dot}</figure>`;
  }

  if (T === 'video') {
    const src = safeURL(item.data || item.image || item.url);
    const cap = (item.title || item.body)
      ? `<figcaption>${item.title ? `<b>${title}</b>` : ''}${item.body ? `<span>${body}</span>` : ''}</figcaption>` : '';
    const poster = safeURL(item.poster);
    const media = (!FLAT && src)
      ? `<video src="${esc(src)}"${poster ? ` poster="${esc(poster)}"` : ''} playsinline preload="metadata" controls muted></video>`
      // A rasterised PNG cannot paint a <video>, so the captured frame stands in.
      : poster
        ? `<img src="${esc(poster)}" alt="${esc(item.alt || item.title || '')}" draggable="false">`
        : `<div class="noimg">${src ? 'VIDEO' : 'NO VIDEO'}</div>`;
    return `<figure class="bento b-video">${media}<div class="playGlyph">▶</div>${cap ? '<div class="shade"></div>' : ''}${cap}${dot}</figure>`;
  }

  if (T === 'quote') {
