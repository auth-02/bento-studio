    return `<blockquote class="bento b-quote"><span class="mk" aria-hidden="true">“</span><div class="pad"><p class="q">${body || 'Something worth remembering.'}</p>${item.by ? `<cite>— ${esc(item.by)}</cite>` : ''}</div>${dot}</blockquote>`;
  }

  if (T === 'number') {
    return `<div class="bento b-number"><div class="pad"><div class="num">${title || '0'}</div>${item.body ? `<div class="lbl">${body}</div>` : ''}</div>${dot}</div>`;
  }

  if (T === 'link') {
    const u = item.url || item.href || '';
    return `<div class="bento b-link"><div class="pad between"><span class="kick">↗ Link</span><div style="display:flex;flex-direction:column;gap:6px"><h3 class="dsp">${title || 'Untitled link'}</h3>${item.body ? `<p class="bdy">${body}</p>` : ''}</div>${u ? `<span class="url">${esc(hostOf(u))}</span>` : ''}</div>${dot}</div>`;
  }

  if (T === 'markdown') {
    return `<div class="bento b-md"><div class="pad top">${item.title ? `<span class="kick">${title}</span>` : ''}<div class="md">${mdToHTML(item.body)}</div></div>${dot}</div>`;
  }

  if (T === 'audio') {
    const src = safeURL(item.data || item.url);
    return `<div class="bento b-audio"><div class="pad"><span class="kick">♪ Audio</span><h3 class="dsp">${title || 'Untitled'}</h3>${(!FLAT && src) ? `<audio src="${esc(src)}" controls preload="metadata"></audio>` : `<span class="meta">${src ? esc(item.name || 'audio') : 'No file'}</span>`}</div>${dot}</div>`;
  }

  if (T === 'pdf' || T === 'file') {
    const facts = [
      item.name,
      item.size ? formatBytes(item.size) : '',
      item.pages ? item.pages + (item.pages === 1 ? ' page' : ' pages') : ''
    ].filter(Boolean).join(' · ');
    const open = (item.data || item.href) ? `<span class="cta">Open ↗</span>` : '';

    // A rendered first page beats an icon: the card shows the document itself.
    if (T === 'pdf' && item.poster) {
      return `<figure class="bento b-pdf hasPoster"><img class="pageImg" src="${esc(safeURL(item.poster))}" alt="${esc(item.alt || ('First page of ' + (item.name || 'document')))}" draggable="false" loading="lazy"><span class="docChip">PDF</span><figcaption class="docBar"><span class="docTx"><b>${title || esc(item.name || 'Document')}</b>${facts ? `<span class="meta">${esc(facts)}</span>` : ''}</span>${open}</figcaption>${dot}</figure>`;
    }

    return `<div class="bento b-${T === 'pdf' ? 'pdf' : 'file'}"><div class="pad between"><span class="glyph">${esc(glyphFor(item))}</span><div style="display:flex;flex-direction:column;gap:5px"><h3 class="dsp">${title || esc(item.name || 'File')}</h3>${item.body ? `<p class="bdy">${body}</p>` : ''}</div><div style="display:flex;flex-direction:column;gap:6px"><span class="meta">${esc(facts)}</span>${open}</div></div>${dot}</div>`;
  }

  if (T === 'embed') {
    const doc = item.html || '';
    const src = item.data && /^data:/.test(item.data) ? item.data : '';
    const fallback = `<div class="pad between"><span class="glyph">&lt;/&gt;</span><h3 class="dsp">${title || 'Embed'}</h3><span class="meta">${esc(item.name || (doc || src ? 'embedded page' : 'drop an HTML file'))}</span></div>`;
    const inner = FLAT ? fallback
      : doc
        ? `<iframe sandbox="" srcdoc="${esc(doc)}" title="${esc(item.title || 'Embedded page')}" tabindex="-1"></iframe>`
        : src
          ? `<iframe sandbox="" src="${esc(src)}" title="${esc(item.title || 'Embedded page')}" tabindex="-1"></iframe>`
          : fallback;
    return `<div class="bento b-embed">${inner}${(!FLAT && (doc || src)) ? `<span class="embedTag">${esc(item.title || item.name || 'HTML')}</span>` : ''}${dot}</div>`;
  }

  if (T === 'place') {
    const map = item.image ? `<img src="${esc(safeURL(item.image))}" alt="" draggable="false"><div class="shade"></div>` : '';
    return `<div class="bento b-place${item.image ? ' hasMap' : ''}">${map}<div class="pad"><span class="kick">◎ Place</span><h3 class="dsp">${title || 'Somewhere'}</h3>${item.body ? `<p class="bdy">${body}</p>` : ''}${item.meta ? `<span class="meta">${esc(item.meta)}</span>` : ''}</div>${dot}</div>`;
  }

  if (T === 'person') {
    const initials = (item.title || '?').trim().split(/\s+/).slice(0, 2).map(s => s[0] || '').join('').toUpperCase();
    const av = item.image
      ? `<img src="${esc(safeURL(item.image))}" alt="" draggable="false">`
      : esc(initials);
    return `<div class="bento b-person"><div class="pad"><div class="who"><div class="avatar">${av}</div><div class="whoTx"><h3 class="dsp">${title || 'Someone'}</h3>${item.body ? `<p class="bdy">${body}</p>` : ''}</div></div></div>${dot}</div>`;
  }

  if (T === 'spacer') return `<div class="bento b-spacer"></div>`;

  // text (default)
  return `<div class="bento b-text"><div class="pad">${item.title ? `<h3 class="dsp">${title}</h3>` : ''}${item.body ? `<p class="bdy">${body}</p>` : ''}</div>${dot}</div>`;
}

/**
 * Full positioned card. `interactive` controls whether activation is live —
 * false in the editor (clicks select), true in preview and in the export.
 */
function itemHTML(item, interactive) {
  const act = activationOf(item);
  const inner = cardHTML(item);
  const rot = rotFor(item);
  const style = `left:${item.x}px;top:${item.y}px;width:${item.w}px;height:${item.h}px;z-index:${num(item.z, 1)};--rot:${rot.toFixed(3)}deg`;
  const attrs = `class="item" data-id="${item.id}" data-type="${item.type}"${act ? ' data-live="1"' : ''}${clipAttr(item)} style="${style}"`;

  // A real anchor wherever a real URL exists: keyboard, middle-click and
  // "open in new tab" all work, and the export needs no JS for links.
  // A real anchor wherever a real URL exists, so middle-click and "open in
  // new tab" keep working; a plain left click is intercepted and opens the
  // focus view instead.
  let wrapped = inner;
  if (act) {
    wrapped = act.href
      ? `<a class="hit" href="${esc(act.href)}" target="_blank" rel="noopener noreferrer" data-focus="1">${inner}</a>`
      : `<a class="hit" href="#" role="button" data-focus="1">${inner}</a>`;
  }
  return `<div ${attrs}>${wrapped}</div>`;
}


/* --------------------------------------------------------------------------
   13b. FOCUS VIEW — the expanded form of any Bento
   One shared builder produces the overlay contents for every type, so the
   editor, preview and the exported page all show the same thing. Iframes are
   emitted with data-src and only loaded when the view actually opens.
   -------------------------------------------------------------------------- */

/** Recognise the video services worth embedding rather than just linking. */
function embeddableVideo(url) {
  const u = String(url || '');
  let m;
  if ((m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{6,})/i)))
    return { kind: 'YouTube', src: `https://www.youtube-nocookie.com/embed/${m[1]}?rel=0`, thumb: `https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg` };
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/i)))
    return { kind: 'Vimeo', src: `https://player.vimeo.com/video/${m[1]}` };
  if ((m = u.match(/loom\.com\/(?:share|embed)\/([\w-]+)/i)))
    return { kind: 'Loom', src: `https://www.loom.com/embed/${m[1]}` };
  return null;
}

/** Which expanded views this Bento could offer, best first. */
function previewOptions(item) {
  const href = safeURL(item.href || item.url);
  const media = safeURL(item.data);
  const video = embeddableVideo(href);
  const web = href && /^https?:/i.test(href);
  const out = [];

  if (item.type === 'image' && item.image) out.push('image');
  if (item.type === 'video' && media) out.push('video');
  if (item.type === 'audio' && media) out.push('audio');
  if (item.type === 'pdf' && (media || item.poster)) out.push('doc');
  if (item.type === 'embed' && (item.html || media)) out.push('html');
  if (video) out.push('embedVideo');
  // A place or a person may have a photo as well as a map or profile link.
  if (!out.includes('image') && item.image) out.push('image');
  if (web && !out.includes('embedVideo')) out.push('page');
  if (item.type === 'markdown') out.push('reader');
  if (item.type === 'file' && media) out.push('file');
  out.push('card');
  return [...new Set(out)];
}

/**
 * What the focus view should show. `item.preview` lets the user override the
 * default — a place with both a photo and a map can be either.
 */
function focusOf(item) {
  if (item.type === 'spacer') return null;
  const href = safeURL(item.href || item.url);
  const video = embeddableVideo(href);
  const opts = previewOptions(item);
  const want = opts.includes(item.preview) ? item.preview : opts[0];
  if (want === 'card') return { kind: 'text', href };
  if (want === 'embedVideo') return { kind: 'embedVideo', href, video };
  return { kind: want, href };
}

const PREVIEW_LABEL = {
  image: 'Photo', video: 'Video', embedVideo: 'Player', audio: 'Audio',
  doc: 'Document', html: 'Embed', page: 'Web page', reader: 'Notes',
  file: 'File', card: 'The card itself'
};

const hostLabel = u => { const h = hostOf(u); return h || u; };

/**
 * The big view of one Bento. Returns markup for the stage, the notes beneath
 * it, and the buttons in the header.
 */
function focusBodyHTML(item) {
  const f = focusOf(item);
  if (!f) return null;
  const title = esc(item.title || item.name || '');
  const href = f.href;
  const media = safeURL(item.data);

  let stage = '';
  let note = '';

  switch (f.kind) {
    case 'image':
      stage = `<img class="fImg" src="${esc(safeURL(item.image))}" alt="${esc(item.alt || item.title || '')}">`;
      break;
    case 'video':
      stage = `<video class="fMedia" src="${esc(media)}"${item.poster ? ` poster="${esc(safeURL(item.poster))}"` : ''} controls playsinline preload="metadata"></video>`;
      break;
    case 'embedVideo': {
      // Players like YouTube refuse to run from a file:// page (null origin →
      // error 153), so ship a watch-link fallback that the hydrator shows there.
      const thumb = f.video.thumb ? `<img class="fFallImg" src="${esc(f.video.thumb)}" alt="">` : '';
      stage = `<div class="fFrameWrap"><iframe class="fFrame" data-src="${esc(f.video.src)}" title="${title || f.video.kind + ' video'}" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>` +
        `<div class="fBlocked fFall">${thumb}<span>${f.video.kind} needs a hosted page to play inline.</span>` +
        `<a class="fFallBtn" href="${esc(href)}" target="_blank" rel="noopener noreferrer">Watch on ${esc(hostLabel(href))} ↗</a></div></div>`;
      note = `<span class="fNote">${f.video.kind} · plays from ${esc(hostLabel(href))}</span>`;
      break;
    }
    case 'audio':
      stage = `<div class="fPane"><div class="fGlyph">♪</div><div class="fPaneTitle">${title || 'Audio'}</div><audio class="fAudio" src="${esc(media)}" controls preload="metadata"></audio></div>`;
      break;
    case 'doc':
      // Page one is the poster we already hold; the rest are appended as they
      // are needed, so the whole document scrolls.
      stage = `<div class="fDoc">${item.pageImages && item.pageImages.length
        ? item.pageImages.map((src, n) => `<img class="fPage" data-page="${n + 1}" src="${esc(safeURL(src))}" alt="Page ${n + 1}">`).join('')
        : `<img class="fPage" data-page="1" src="${esc(safeURL(item.poster || ''))}" alt="${esc('Page 1 of ' + (item.name || 'document'))}">`}</div>`;
      break;
    case 'html':
      stage = `<div class="fFrameWrap"><iframe class="fFrame" sandbox="allow-same-origin" ${item.html ? `data-srcdoc="${esc(item.html)}"` : `data-src="${esc(media)}"`} title="${title || 'Embedded page'}"></iframe></div>`;
      note = `<span class="fNote">Embedded page · runs without scripts</span>`;
      break;
    case 'page':
      stage = `<div class="fFrameWrap"><iframe class="fFrame" data-src="${esc(href)}" title="${title || esc(hostLabel(href))}" referrerpolicy="no-referrer" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
        <div class="fBlocked"><b>${esc(hostLabel(href))} will not display inside another page.</b><span>Many sites refuse to be embedded. Open it in a new tab to see it.</span></div></div>`;
      note = `<span class="fNote">${esc(hostLabel(href))}</span>`;
      break;
    case 'reader':
      stage = `<div class="fRead md">${mdToHTML(item.body)}</div>`;
      break;
    case 'file':
      stage = `<div class="fPane"><div class="fGlyph">${esc(glyphFor(item))}</div><div class="fPaneTitle">${title || esc(item.name || 'File')}</div><div class="fPaneMeta">${esc(item.name || '')}${item.size ? ' · ' + formatBytes(item.size) : ''}</div></div>`;
      break;
    default: {
      // Text, quote, number, place, person — the card itself, shown large.
      // It must carry the .gallery class or none of the theme CSS applies.
      const ar = `${Math.max(1, item.w)} / ${Math.max(1, item.h)}`;
      stage = `<div class="fCard gallery" data-interactive="0" style="aspect-ratio:${ar}">${cardHTML(item)}</div>`;
    }
  }

  // Everything worth reading, under the stage.
  const parts = [];
  if (f.kind !== 'text' && item.title) parts.push(`<h2 class="fTitle">${title}</h2>`);
  if (item.body && f.kind !== 'reader' && f.kind !== 'text' && item.type !== 'markdown')
    parts.push(`<p class="fBody">${esc(item.body)}</p>`);
  if (item.story) parts.push(`<div class="fStory">${textToHTML(item.story)}</div>`);
  if (item.meta) parts.push(`<p class="fMeta">${esc(item.meta)}</p>`);
  if (note) parts.push(note);

  const acts = [];
  if (href) acts.push({ id: 'open', label: 'Open in new tab', href });
  if (media) acts.push({ id: 'save', label: 'Download' });

  return { kind: f.kind, stage, foot: parts.join(''), acts, href, media };
}

/* --------------------------------------------------------------------------
   14. RENDER
   -------------------------------------------------------------------------- */

/** Document title and the brand's subtitle both follow the page name. */
function syncTitles() {
  const name = state.title || 'Untitled Page';
  // In the editor this is Bento Studio; once you preview or share it, it is a
  // Bento Page. The tab title and the brand mark both follow the mode.
  const app = view.mode === 'preview' ? 'Bento Page' : 'Bento Studio';
  document.title = name + ' · ' + app;
  const appEl = $('#brandName');
  if (appEl) appEl.textContent = app;
  const b = $('#brandTitle');
  if (b) b.textContent = name;
  // The page wears its name on the canvas too, above its frame — the same
  // idea as each Bento's label, one level up.
  const f = $('#frameName');
  if (f) { f.textContent = name; f.title = name; }
}

function applyTheme() {
  const t = themeOf(state.theme);
  $('#themeStyle').textContent = themeCSS(state.theme, ':root, .gallery');
  document.documentElement.dataset.chrome = t.chrome;
  $$('#themeGrid .themeCard').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.theme === state.theme)));
}

function render() {
  const interactive = view.mode === 'preview';
  el.canvas.dataset.interactive = interactive ? '1' : '0';
  el.items.innerHTML = state.items
    .slice().sort((a, b) => a.z - b.z)
    .map(it => itemHTML(it, interactive)).join('');
  markOverflow();
  renderLabels();
  renderSelection();
  renderInspector();
  renderPagePanel();
  syncTitles();
}

/** Update one card in place without touching the rest of the DOM. */
function refreshItem(item) {
  const node = el.items.querySelector(`.item[data-id="${item.id}"]`);
  if (!node) return render();
  node.outerHTML = itemHTML(item, view.mode === 'preview');
  markOverflow();
  const lbl = el.labels.querySelector(`[data-label-id="${item.id}"]`);
  if (lbl) {
    lbl.textContent = labelFor(item);
    lbl.title = labelFor(item);
    lbl.classList.toggle('untitled', !(item.title || item.name || '').trim());
    positionLabel(item);
  }
  renderSelection();
}

function setBox(item) {
  const node = el.items.querySelector(`.item[data-id="${item.id}"]`);
  if (!node) return;
  node.style.left = item.x + 'px';
  node.style.top = item.y + 'px';
  node.style.width = item.w + 'px';
  node.style.height = item.h + 'px';
  node.style.setProperty('--rot', rotFor(item).toFixed(3) + 'deg');
  node.style.removeProperty('--dx');
  node.style.removeProperty('--dy');
  positionLabel(item);
}

/* ---- name labels above each Bento ---- */

const labelFor = item =>
  (item.title || item.name || '').trim() || (TYPES[item.type]?.label || 'Bento');

function renderLabels() {
  // Per-Bento name labels are intentionally not shown. The page/frame name
  // still lives on the export-frame chip; individual Bentos are renamed from
  // the properties panel's Title field. A rebuild would throw away an input
  // mid-edit, so commit any in-progress rename before clearing.
  if (renaming && renaming.kind === 'item') endRename(true);
  el.labels.innerHTML = '';
}

function positionLabel(item) {
  const n = el.labels.querySelector(`[data-label-id="${item.id}"]`);
  if (!n) return;
  n.style.left = item.x + 'px';
  n.style.maxWidth = Math.max(80, item.w) + 'px';
  n.style.top = (item.y - n.offsetHeight) + 'px';
  n.style.removeProperty('--dx');
  n.style.removeProperty('--dy');
}

el.labels.addEventListener('pointerdown', ev => ev.stopPropagation());

el.labels.addEventListener('click', ev => {
  const b = ev.target.closest('[data-label-id]');
  if (!b || view.mode === 'preview') return;
  const id = Number(b.dataset.labelId);
  const add = ev.shiftKey || ev.metaKey || ev.ctrlKey;
  if (add) view.sel.add(id);
  else view.sel = new Set([id]);
  if (view.frameSel) selectFrame(false);
  renderSelection();
  renderInspector();
  // A name is a text field that happens to look like a label. One click on
  // it and you are typing — no panel, no dialog, no second step.
  if (!add) beginRename('item', id);
});

/* Everything else about a Bento still lives in the panel. */
el.labels.addEventListener('dblclick', ev => {
  const b = ev.target.closest('[data-label-id], .bLabelEdit');
  if (!b || view.mode === 'preview') return;
  endRename(true);
  setPanel(true);
});

/* --------------------------------------------------------------------------
   RENAME IN PLACE
   Names are edited where they are shown — above a Bento, or on the frame
   chip for the page itself. Nothing about it opens a panel.
   -------------------------------------------------------------------------- */

let renaming = null;

const isRenaming = () => !!renaming;

function beginRename(kind, id) {
  if (view.mode === 'preview') return;
  if (renaming) {
    if (renaming.kind === kind && renaming.id === id) return renaming.node.focus();
    endRename(true);
  }

  const inp = document.createElement('input');
  inp.type = 'text';
  inp.spellcheck = false;

  if (kind === 'item') {
    const item = byId(id);
    const btn = el.labels.querySelector(`[data-label-id="${id}"]`);
    if (!item || !btn) return;
    inp.className = 'bLabelEdit';
    inp.value = (item.title || item.name || '').trim();
    inp.placeholder = TYPES[item.type]?.label || 'Bento';
    inp.setAttribute('aria-label', 'Bento name');
    inp.style.left = item.x + 'px';
    inp.style.width = Math.max(150, item.w) + 'px';
    btn.replaceWith(inp);
    inp.style.top = (item.y - inp.offsetHeight) + 'px';
  } else {
    const b = $('#frameName');
    if (!b) return;
    inp.className = 'frameEdit';
    inp.value = (state.title || '').trim();
    inp.placeholder = 'Untitled Page';
    inp.setAttribute('aria-label', 'Page name');
    inp.size = Math.max(12, Math.min(40, inp.value.length + 2));
    b.hidden = true;
    b.after(inp);
  }

  renaming = { kind, id, node: inp };

  inp.addEventListener('pointerdown', ev => ev.stopPropagation());
  inp.addEventListener('click', ev => ev.stopPropagation());
  inp.addEventListener('dblclick', ev => ev.stopPropagation());
  inp.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') { ev.preventDefault(); endRename(true); }
    else if (ev.key === 'Escape') { ev.preventDefault(); endRename(false); }
  });
  inp.addEventListener('blur', () => endRename(true));

  inp.focus();
  inp.select();
}

function endRename(commit) {
  const r = renaming;
  if (!r) return;
  renaming = null;
  const val = r.node.value.trim();

  if (r.kind === 'item') {
    const item = byId(r.id);
    r.node.remove();
    if (!item) { renderLabels(); return; }
    if (commit && val !== (item.title || '').trim()) {
      History.begin();
      item.title = val;
      History.commit('Rename Bento');
      refreshItem(item);
      renderInspector();
    }
    renderLabels();
    renderSelection();
  } else {
    r.node.remove();
    const b = $('#frameName');
    if (b) b.hidden = false;
    if (commit && val && val !== (state.title || '').trim()) {
      History.begin();
      state.title = val;
      History.commit('Rename page');
      syncTitles();
      renderPagePanel();
      renderInspector();
    }
    syncTitles();
  }
}

/* ---- selection overlay (lives outside the cards, so z-order is honest) ---- */

function renderSelection() {
  el.selection.innerHTML = '';
  pruneSelection();
  for (const n of el.items.querySelectorAll('.item.isSel')) n.classList.remove('isSel');
  for (const n of el.labels.querySelectorAll('.bLabel.sel')) n.classList.remove('sel');
  for (const id of view.sel) {
    el.items.querySelector(`.item[data-id="${id}"]`)?.classList.add('isSel');
    el.labels.querySelector(`[data-label-id="${id}"]`)?.classList.add('sel');
  }
  if (view.mode === 'preview' || !view.sel.size) return;

  const items = selected();
  for (const it of items) {
    const ring = document.createElement('div');
    ring.className = 'ring';
    ring.style.cssText = `left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;transform:rotate(${rotFor(it).toFixed(3)}deg)`;
    el.selection.appendChild(ring);
  }

  const one = soleSelected();
  if (!one) {
    // Group bounds + group actions
    const b = bboxOf(items);
    const ring = document.createElement('div');
    ring.className = 'ring';
    ring.style.cssText = `left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;opacity:.55`;
    el.selection.appendChild(ring);
    addBadge(b, ['dup', 'del']);
    return;
  }

  const dirs = [['nw', 0, 0], ['n', .5, 0], ['ne', 1, 0], ['e', 1, .5],
                ['se', 1, 1], ['s', .5, 1], ['sw', 0, 1], ['w', 0, .5]];
  for (const [dir, fx, fy] of dirs) {
    const h = document.createElement('div');
    h.className = 'handle';
    h.dataset.dir = dir;
    h.style.left = (one.x + one.w * fx) + 'px';
    h.style.top = (one.y + one.h * fy) + 'px';
    el.selection.appendChild(h);
  }
  const rh = document.createElement('div');
  rh.className = 'rotHandle';
  rh.dataset.rot = '1';
  rh.title = 'Rotate (⇧ for 15° steps)';
  rh.style.left = (one.x + one.w / 2) + 'px';
  rh.style.top = (one.y - 26 / Math.max(view.k, .2)) + 'px';
  el.selection.appendChild(rh);

  addBadge(one, ['edit', 'dup', 'del']);
}

function addBadge(box, actions) {
  const labels = { edit: ['✎', 'Edit content'], dup: ['⧉', 'Duplicate (⌘D)'], del: ['⌫', 'Delete'] };
  const b = document.createElement('div');
  b.className = 'badge';
  b.innerHTML = actions.map(a =>
    `<button data-badge="${a}" title="${labels[a][1]}" aria-label="${labels[a][1]}">${labels[a][0]}</button>`).join('');
  b.style.left = (box.x + box.w) + 'px';
  b.style.top = (box.y - 34 / Math.max(view.k, .2)) + 'px';
  b.style.transform = 'translateX(-100%)';
  el.selection.appendChild(b);
}

function bboxOf(items) {
  const x = Math.min(...items.map(i => i.x));
  const y = Math.min(...items.map(i => i.y));
  const r = Math.max(...items.map(i => i.x + i.w));
  const b = Math.max(...items.map(i => i.y + i.h));
  return { x, y, w: r - x, h: b - y };
}

/* --------------------------------------------------------------------------
   15. SNAPPING + GUIDES
   -------------------------------------------------------------------------- */

function snapTargets(excludeIds) {
  // The export frame is the most useful thing on the plane to align against.
  const f = state.frame;
  const xs = [f.x, f.x + f.w / 2, f.x + f.w];
  const ys = [f.y, f.y + f.h / 2, f.y + f.h];
  for (const it of state.items) {
    if (excludeIds.has(it.id)) continue;
    xs.push(it.x, it.x + it.w / 2, it.x + it.w);
    ys.push(it.y, it.y + it.h / 2, it.y + it.h);
  }
  return { xs, ys };
}

/** Best single-axis snap: returns {delta, line} or null. */
function bestSnap(edges, targets, tol) {
  let best = null;
  for (const e of edges) {
    for (const t of targets) {
      const d = t - e;
      if (Math.abs(d) <= tol && (!best || Math.abs(d) < Math.abs(best.delta))) {
        best = { delta: d, line: t };
      }
    }
  }
  return best;
}

function drawGuides(vLines, hLines) {
  const g = el.guides;
  [...g.querySelectorAll('.guide')].forEach(n => n.remove());
  for (const x of new Set(vLines)) {
    const n = document.createElement('div');
    n.className = 'guide v';
    n.style.left = x + 'px';
    g.appendChild(n);
  }
  for (const y of new Set(hLines)) {
    const n = document.createElement('div');
    n.className = 'guide h';
    n.style.top = y + 'px';
    g.appendChild(n);
  }
}
const clearGuides = () => drawGuides([], []);

/* --------------------------------------------------------------------------
   16. GESTURES
   One pointermove/pointerup pair on window per gesture, added on start and
   removed on end. Card listeners are delegated, so nothing accumulates.
   -------------------------------------------------------------------------- */

let gesture = null;

function endGesture() {
  if (gesture?.kind === 'pan') el.stage.style.cursor = spaceHeld ? 'grab' : '';
  removeEventListener('pointermove', onGestureMove);
  removeEventListener('pointerup', onGestureEnd);
  removeEventListener('pointercancel', onGestureEnd);
  gesture = null;
  clearGuides();
  el.marquee.style.display = 'none';
}

function beginGesture(g) {
  gesture = g;
  addEventListener('pointermove', onGestureMove, { passive: false });
  addEventListener('pointerup', onGestureEnd);
  addEventListener('pointercancel', onGestureEnd);
}

/* A failed image should say so, not render as a browser glyph.
   `error` does not bubble, so this listens in the capture phase. */
el.items.addEventListener('error', ev => {
  const img = ev.target;
  if (img.tagName !== 'IMG' || img.dataset.failed) return;
  img.dataset.failed = '1';
  img.style.display = 'none';
  const bento = img.closest('.bento');
  if (bento && !bento.querySelector('.noimg')) {
    const n = document.createElement('div');
    n.className = 'noimg';
    n.textContent = 'IMAGE UNAVAILABLE';
    bento.prepend(n);
  }
}, true);

/* ---- the export frame: select, move, resize ---- */

function selectFrame(on) {
  view.frameSel = !!on;
  if (on) { view.sel.clear(); renderSelection(); }
  el.exportFrame.classList.toggle('sel', view.frameSel);
  $('#bFrame')?.setAttribute('aria-pressed', String(view.frameSel));
  renderFrameHandles();
  renderInspector();
}

$('#frameTag').addEventListener('pointerdown', ev => ev.stopPropagation());
$('#frameTag').addEventListener('click', ev => {
  ev.preventDefault();
  ev.stopPropagation();
  if (view.mode === 'preview') return;
  // The page's name is edited the same way a Bento's is: click it, type.
  if (ev.target.closest('#frameName')) { selectFrame(true); return beginRename('page'); }
  selectFrame(!view.frameSel);
});

/* Double-click the chip for everything else about the frame and the page. */
$('#frameTag').addEventListener('dblclick', ev => {
  ev.preventDefault();
  ev.stopPropagation();
  if (view.mode === 'preview') return;
  endRename(true);
  selectFrame(true);
  setPanel(true);
});

el.frameHandles.addEventListener('pointerdown', ev => {
  if (ev.button !== 0) return;
  const h = ev.target.closest('.fHandle, .fMove');
  if (!h) return;
  ev.preventDefault();
  ev.stopPropagation();
  History.begin();
  beginGesture({
    kind: 'frame',
    dir: h.dataset.dir,
    startX: ev.clientX, startY: ev.clientY,
    k: measuredScale(),
    box: { ...state.frame }
  });
}, { passive: false });

/* ---- card pointerdown (delegated) ---- */

el.items.addEventListener('pointerdown', ev => {
  if (view.mode === 'preview') return;
  if (spaceHeld || ev.button === 1) return;
  if (ev.button !== 0) return;
  const node = ev.target.closest('.item');
  if (!node) return;
  if (ev.target.closest('.dot')) return;      // corner buttons handle their own clicks
  const item = byId(Number(node.dataset.id));
  if (!item) return;

  ev.preventDefault();
  if (view.frameSel) selectFrame(false);

  const additive = ev.shiftKey || ev.metaKey || ev.ctrlKey;
  if (additive) {
    if (view.sel.has(item.id) && view.sel.size > 1) view.sel.delete(item.id);
    else view.sel.add(item.id);
  } else if (!view.sel.has(item.id)) {
    view.sel = new Set([item.id]);
  }
  renderSelection();
  renderInspector();

  History.begin();
  const moving = selected();
  beginGesture({
    kind: 'move',
    startX: ev.clientX, startY: ev.clientY,
    k: measuredScale(),
    alt: ev.altKey,
    items: moving.map(i => ({ item: i, x0: i.x, y0: i.y })),
    ids: new Set(moving.map(i => i.id)),
    moved: false
  });
}, { passive: false });

/* ---- handles + badges (delegated) ---- */

el.selection.addEventListener('pointerdown', ev => {
  if (ev.button !== 0) return;
  const h = ev.target.closest('.handle, .rotHandle');
  if (!h) return;
  const one = soleSelected();
  if (!one) return;
  ev.preventDefault();
  ev.stopPropagation();
  History.begin();

  if (h.dataset.rot) {
    beginGesture({
      kind: 'rotate', item: one,
      cx: one.x + one.w / 2, cy: one.y + one.h / 2,
      rot0: num(one.rot, 0),
      a0: null, shift: ev.shiftKey
    });
  } else {
    beginGesture({
      kind: 'resize', item: one, dir: h.dataset.dir,
      startX: ev.clientX, startY: ev.clientY,
      k: measuredScale(),
      box: { x: one.x, y: one.y, w: one.w, h: one.h },
      ratio: one.w / Math.max(1, one.h)
    });
  }
}, { passive: false });

el.selection.addEventListener('click', ev => {
  const b = ev.target.closest('[data-badge]');
  if (!b) return;
  ev.preventDefault();
  ev.stopPropagation();
  if (b.dataset.badge === 'edit') setPanel(true);
  if (b.dataset.badge === 'dup') duplicateSelection();
  if (b.dataset.badge === 'del') deleteSelection();
});

/* ---- panning: hold space, or drag with the middle button ---- */

let spaceHeld = false;
addEventListener('keydown', ev => {
  if (ev.code !== 'Space' || spaceHeld) return;
  if (typingIn(ev.target)) return;
  spaceHeld = true;
  el.stage.style.cursor = 'grab';
  ev.preventDefault();
});
addEventListener('keyup', ev => {
  if (ev.code !== 'Space') return;
  spaceHeld = false;
  el.stage.style.cursor = '';
});
addEventListener('blur', () => { spaceHeld = false; el.stage.style.cursor = ''; });

el.stage.addEventListener('pointerdown', ev => {
  if (!(spaceHeld || ev.button === 1)) return;
  ev.preventDefault();
  el.stage.style.cursor = 'grabbing';
  beginGesture({
    kind: 'pan',
    startX: ev.clientX, startY: ev.clientY,
    sl: el.stage.scrollLeft, st: el.stage.scrollTop
  });
}, { passive: false });

/* ---- empty canvas: marquee select / deselect ---- */

el.stage.addEventListener('pointerdown', ev => {
  if (spaceHeld || ev.button === 1) return;
  if (view.mode === 'preview' || ev.button !== 0) return;
  if (ev.target.closest('.item, .handle, .rotHandle, .badge, .fHandle, .fMove, .frameTag')) return;
  // An armed tool turns a click on empty canvas into a placement.
  if (view.tool) { ev.preventDefault(); placeArmedTool(ev.clientX, ev.clientY); return; }
  if (view.frameSel) selectFrame(false);
  const p = toLogical(ev.clientX, ev.clientY);
  view.lastPointer = p;
  if (!(ev.shiftKey || ev.metaKey)) {
    if (view.sel.size) { view.sel.clear(); renderSelection(); renderInspector(); }
  }
  beginGesture({
    kind: 'marquee', x0: p.x, y0: p.y,
    base: new Set(view.sel), moved: false
  });
});

/* ---- move handler ---- */

function onGestureMove(ev) {
  if (!gesture) return;
  const g = gesture;

  if (g.kind === 'pan') {
    ev.preventDefault();
    el.stage.scrollLeft = g.sl - (ev.clientX - g.startX);
    el.stage.scrollTop = g.st - (ev.clientY - g.startY);
    return;
  }

  if (g.kind === 'move') {
    ev.preventDefault();
    const dxRaw = (ev.clientX - g.startX) / g.k;
    const dyRaw = (ev.clientY - g.startY) / g.k;
    if (!g.moved && Math.hypot(ev.clientX - g.startX, ev.clientY - g.startY) < 3) return;
    g.moved = true;

    const free = ev.altKey || g.alt;
    const b0 = bboxOf(g.items.map(e => ({ x: e.x0, y: e.y0, w: e.item.w, h: e.item.h })));
    // The plane is unbounded: no clamping here at all.
    let dx = dxRaw, dy = dyRaw;

    const vg = [], hg = [];
    if (!free) {
      const tol = SNAP / Math.max(g.k, .15);
      const { xs, ys } = snapTargets(g.ids);
      const sx = bestSnap([b0.x + dx, b0.x + dx + b0.w / 2, b0.x + dx + b0.w], xs, tol);
      const sy = bestSnap([b0.y + dy, b0.y + dy + b0.h / 2, b0.y + dy + b0.h], ys, tol);
      if (sx) { dx += sx.delta; vg.push(sx.line); } else { dx = Math.round((b0.x + dx) / GRID) * GRID - b0.x; }
      if (sy) { dy += sy.delta; hg.push(sy.line); } else { dy = Math.round((b0.y + dy) / GRID) * GRID - b0.y; }
    }
    drawGuides(vg, hg);

    for (const e of g.items) {
      for (const node of [el.items.querySelector(`.item[data-id="${e.item.id}"]`),
                          el.labels.querySelector(`[data-label-id="${e.item.id}"]`)]) {
        if (!node) continue;
        node.style.setProperty('--dx', dx + 'px');
        node.style.setProperty('--dy', dy + 'px');
      }
    }
    g.dx = dx; g.dy = dy;
    // Keep the selection ring glued to the cards while dragging.
    el.selection.style.transform = `translate3d(${dx}px,${dy}px,0)`;
    return;
  }

  if (g.kind === 'resize') {
    ev.preventDefault();
    const dx = (ev.clientX - g.startX) / g.k;
    const dy = (ev.clientY - g.startY) / g.k;
    const d = g.dir;
    let { x, y, w, h } = g.box;

    if (d.includes('e')) w = g.box.w + dx;
    if (d.includes('s')) h = g.box.h + dy;
    if (d.includes('w')) { w = g.box.w - dx; x = g.box.x + dx; }
    if (d.includes('n')) { h = g.box.h - dy; y = g.box.y + dy; }

    if (ev.shiftKey && d.length === 2) {
      // Preserve aspect from the dominant axis.
      if (Math.abs(dx) > Math.abs(dy)) h = w / g.ratio; else w = h * g.ratio;
      if (d.includes('n')) y = g.box.y + g.box.h - h;
      if (d.includes('w')) x = g.box.x + g.box.w - w;
    }

    // Clamp to canvas and minimum size without letting edges cross over.
    if (w < MIN_W) { if (d.includes('w')) x -= (MIN_W - w); w = MIN_W; }
    if (h < MIN_H) { if (d.includes('n')) y -= (MIN_H - h); h = MIN_H; }

    const vg = [], hg = [];
    if (!ev.altKey) {
      const tol = SNAP / Math.max(g.k, .15);
      const { xs, ys } = snapTargets(new Set([g.item.id]));
      if (d.includes('e')) { const s = bestSnap([x + w], xs, tol); if (s) { w += s.delta; vg.push(s.line); } }
      if (d.includes('w')) { const s = bestSnap([x], xs, tol); if (s) { x += s.delta; w -= s.delta; vg.push(s.line); } }
      if (d.includes('s')) { const s = bestSnap([y + h], ys, tol); if (s) { h += s.delta; hg.push(s.line); } }
      if (d.includes('n')) { const s = bestSnap([y], ys, tol); if (s) { y += s.delta; h -= s.delta; hg.push(s.line); } }
    }
    drawGuides(vg, hg);

    Object.assign(g.item, {
      x: Math.round(x), y: Math.round(y),
      w: Math.round(Math.max(MIN_W, w)), h: Math.round(Math.max(MIN_H, h))
    });
    setBox(g.item);
    markOverflow();
    renderSelection();
    return;
  }

  if (g.kind === 'rotate') {
    ev.preventDefault();
    const p = toLogical(ev.clientX, ev.clientY);
    const a = Math.atan2(p.y - g.cy, p.x - g.cx) * 180 / Math.PI;
    if (g.a0 === null) { g.a0 = a; return; }
    let r = g.rot0 + (a - g.a0);
    if (ev.shiftKey) r = Math.round(r / 15) * 15;
    if (Math.abs(r) < 1.2 && !ev.shiftKey) r = 0;      // easy snap back to square
    g.item.rot = clamp(Math.round(r * 10) / 10, -45, 45);
    setBox(g.item);
    renderSelection();
    return;
  }

  if (g.kind === 'frame') {
    ev.preventDefault();
    const dx = (ev.clientX - g.startX) / g.k;
    const dy = (ev.clientY - g.startY) / g.k;
    const d = g.dir;
    let { x, y, w, h } = g.box;

    if (d === 'move') { x += dx; y += dy; }
    else {
      if (d.includes('e')) w = g.box.w + dx;
      if (d.includes('s')) h = g.box.h + dy;
      if (d.includes('w')) { w = g.box.w - dx; x = g.box.x + dx; }
      if (d.includes('n')) { h = g.box.h - dy; y = g.box.y + dy; }
      if (ev.shiftKey && d.length === 2) {
        const ratio = g.box.w / Math.max(1, g.box.h);
        if (Math.abs(dx) > Math.abs(dy)) h = w / ratio; else w = h * ratio;
        if (d.includes('n')) y = g.box.y + g.box.h - h;
        if (d.includes('w')) x = g.box.x + g.box.w - w;
      }
      if (w < 200) { if (d.includes('w')) x -= (200 - w); w = 200; }
      if (h < 200) { if (d.includes('n')) y -= (200 - h); h = 200; }
    }

    // The frame snaps to the Bentos, which is how you wrap it around them.
    const vg = [], hg = [];
    if (!ev.altKey) {
      const tol = SNAP / Math.max(g.k, .15);
      const xs = [], ys = [];
      for (const it of state.items) {
        xs.push(it.x, it.x + it.w / 2, it.x + it.w);
        ys.push(it.y, it.y + it.h / 2, it.y + it.h);
      }
      const snapEdge = (vals, targets, apply) => {
        const s = bestSnap(vals, targets, tol);
        if (s) apply(s.delta, s.line);
      };
      if (d === 'move') {
        snapEdge([x, x + w / 2, x + w], xs, (dd, line) => { x += dd; vg.push(line); });
        snapEdge([y, y + h / 2, y + h], ys, (dd, line) => { y += dd; hg.push(line); });
      } else {
        if (d.includes('e')) snapEdge([x + w], xs, (dd, line) => { w += dd; vg.push(line); });
        if (d.includes('w')) snapEdge([x], xs, (dd, line) => { x += dd; w -= dd; vg.push(line); });
        if (d.includes('s')) snapEdge([y + h], ys, (dd, line) => { h += dd; hg.push(line); });
        if (d.includes('n')) snapEdge([y], ys, (dd, line) => { y += dd; h -= dd; hg.push(line); });
      }
    }
    drawGuides(vg, hg);

    state.frame = {
      x: Math.round(x), y: Math.round(y),
      w: Math.round(Math.max(200, w)), h: Math.round(Math.max(200, h))
    };
    state.canvas = { w: state.frame.w, h: state.frame.h };
    const fe = el.exportFrame;
    fe.style.left = state.frame.x + 'px';
    fe.style.top = state.frame.y + 'px';
    fe.style.width = state.frame.w + 'px';
    fe.style.height = state.frame.h + 'px';
    $('#frameSize').textContent = `${state.frame.w} × ${state.frame.h}`;
    renderFrameHandles();
    updateOutsideWarning();
    return;
  }

  if (g.kind === 'marquee') {
    const p = toLogical(ev.clientX, ev.clientY);
    g.moved = true;
    const x = Math.min(g.x0, p.x), y = Math.min(g.y0, p.y);
    const w = Math.abs(p.x - g.x0), h = Math.abs(p.y - g.y0);
    Object.assign(el.marquee.style, {
      display: 'block', left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px'
    });
    const hits = state.items.filter(it =>
      it.x < x + w && it.x + it.w > x && it.y < y + h && it.y + it.h > y).map(i => i.id);
    view.sel = new Set([...g.base, ...hits]);
    renderSelection();
  }
}

function onGestureEnd() {
  if (!gesture) return;
  const g = gesture;
  el.selection.style.transform = '';

  if (g.kind === 'pan') { endGesture(); return; }

  if (g.kind === 'move') {
    if (g.moved && (g.dx || g.dy)) {
      for (const e of g.items) {
        e.item.x = Math.round(e.x0 + g.dx);
        e.item.y = Math.round(e.y0 + g.dy);
        setBox(e.item);
      }
      settleWorld();
      History.commit(g.items.length > 1 ? 'Move ' + g.items.length + ' Bentos' : 'Move');
    } else {
      for (const e of g.items) setBox(e.item);
      History.abort();          // a plain selecting click records nothing
    }
    renderSelection();
    renderInspector();
  } else if (g.kind === 'resize') {
    settleWorld();
    History.commit('Resize');
    renderInspector();
  } else if (g.kind === 'rotate') {
    History.commit('Rotate');
    renderInspector();
  } else if (g.kind === 'frame') {
    settleWorld();
    History.commit(g.dir === 'move' ? 'Move frame' : 'Resize frame');
    renderInspector();
  } else if (g.kind === 'marquee') {
    renderInspector();
  }
  endGesture();
}

/**
 * Re-origin the plane after an edit so content never sits at a negative
 * coordinate, then relay out. Runs on gesture end, never mid-drag.
 */
function settleWorld() {
  const moved = normaliseWorld();
  layout();
  if (moved) render(); else { renderSelection(); }
  return moved;
}

/* --------------------------------------------------------------------------
   17. PLACEMENT
   New Bentos appear where the user acted, and never fully hidden behind
   something that is already there.
   -------------------------------------------------------------------------- */

function overlaps(a, b) {
  const ox = Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x));
  const oy = Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  return (ox * oy) / Math.max(1, a.w * a.h);
}

function freeSpot(x, y, w, h) {
  let px = x, py = y;
  for (let i = 0; i < 30; i++) {
    const box = { x: px, y: py, w, h };
    if (!state.items.some(it => overlaps(box, it) > 0.55)) break;
    px += 28; py += 24;
  }
  return { x: Math.round(px), y: Math.round(py) };
}

/** Centre of the visible part of the plane, in world coordinates. */
function viewportCentre() {
  const sr = el.stage.getBoundingClientRect();
  return toLogical(sr.left + sr.width / 2, sr.top + sr.height / 2);
}

function nextZ() { return state.items.length ? Math.max(...state.items.map(i => i.z)) + 1 : 1; }

const DEFAULTS = {
  image:    { title: 'New image', body: 'Add a caption', fit: 'cover', focal: '50% 50%' },
  text:     { title: 'New Bento', body: 'Write anything here.' },
  quote:    { body: 'Something worth remembering.', by: 'you' },
  link:     { title: 'A link', body: 'Something on the web.', url: 'https://example.com', href: 'https://example.com' },
  number:   { title: '12', body: 'things worth noting' },
  markdown: { title: 'Notes', body: '### A heading\n\nSome **markdown** with a [link](https://example.com).\n\n- one\n- two' },
  video:    { title: 'Video', body: '' },
  audio:    { title: 'Audio' },
  pdf:      { title: 'Document', name: '', body: '' },
  embed:    { title: 'Embed' },
  place:    { title: 'Somewhere', body: 'Why it mattered.', meta: '' },
  person:   { title: 'Someone', body: 'How you know them.' },
  file:     { title: 'File', name: '' },
  spacer:   {}
};

/** Create and place an item without rendering — used for batched inserts. */
function makeItem(type, extra = {}, at = null) {
  const T = TYPES[type] || TYPES.text;
  const w = extra.w || T.w;
  const h = extra.h || T.h;
  // An explicit pointer position is a decision: honour it exactly. Only fall
  // back to nudging around existing Bentos when nobody pointed anywhere.
  const anchor = at || view.lastPointer || viewportCentre();
  const spot = at
    ? { x: Math.round(anchor.x - w / 2), y: Math.round(anchor.y - h / 2) }
    : freeSpot(anchor.x - w / 2, anchor.y - h / 2, w, h);
  const item = {
    id: state.next++, type, ...spot, w, h, z: nextZ(), rot: 0,
    ...(DEFAULTS[type] || {}), ...extra
  };
  state.items.push(item);
  return item;
}

function addItem(type, extra = {}, at = null) {
  History.begin();
  const item = makeItem(type, extra, at);
  view.sel = new Set([item.id]);
  render();
  History.commit('Add ' + (TYPES[type] || TYPES.text).label);
  flash((TYPES[type] || TYPES.text).label + ' added');
  return item;
}

/* --------------------------------------------------------------------------
   18. FILES IN
   -------------------------------------------------------------------------- */

const MAX_INLINE = 24 * 1024 * 1024;   // 24MB per file

async function buildFromFile(file, at, index = 0) {
  const type = typeForFile(file);
  if (file.size > MAX_INLINE) {
    flash(`${file.name} is ${formatBytes(file.size)} — too large to embed`, 'warn');
    return null;
  }
  const base = {
    name: file.name,
    mime: file.type || '',
    size: file.size,
    title: file.name.replace(/\.[^.]+$/, '')
  };
  const offset = at ? { x: at.x + index * 26, y: at.y + index * 22 } : null;

  if (type === 'image') {
    const data = await fileToDataURL(file);
    const dim = await imageSize(data).catch(() => null);
    let w = TYPES.image.w, h = TYPES.image.h;
    if (dim && dim.w && dim.h) h = Math.round(w * (dim.h / dim.w));
    return makeItem('image', { ...base, image: data, body: '', w, h: Math.max(MIN_H, h) }, offset);
  }
  if (type === 'markdown') {
    return makeItem('markdown', { ...base, body: await fileToText(file) }, offset);
  }
  if (type === 'text') {
    const txt = await fileToText(file);
    return makeItem('text', { ...base, body: txt.slice(0, 4000) }, offset);
  }
  if (type === 'embed') {
    return makeItem('embed', { ...base, html: (await fileToText(file)).slice(0, 400000) }, offset);
  }
  const data = await fileToDataURL(file);
  return makeItem(type, { ...base, data, body: '' }, offset);
}

function imageSize(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res({ w: im.naturalWidth, h: im.naturalHeight });
    im.onerror = () => rej(new Error('bad image'));
    im.src = src;
  });
}

/** A whole drop is one undoable action and one render, however many files. */
async function handleFiles(files, at) {
  const list = [...files];
  if (!list.length) return;
  History.begin();
  const added = [];
  for (let i = 0; i < list.length; i++) {
    try {
      const it = await buildFromFile(list[i], at, i);
      if (it) added.push(it.id);
    } catch (err) {
      console.error(err);
      flash('Could not add ' + list[i].name, 'err');
    }
  }
  if (!added.length) { History.abort(); return; }
  view.sel = new Set(added);
  render();
  History.commit(added.length > 1 ? `Add ${added.length} Bentos` : 'Add Bento');
  flash(added.length > 1 ? added.length + ' Bentos added' : 'Bento added');

  // Posters are generated after the drop lands so the canvas never stalls
  // waiting on a PDF render.
  for (const id of added) {
    const it = byId(id);
    if (it && !it.poster && (it.type === 'pdf' || it.type === 'video')) {
      ensurePoster(it, { fit: true, announce: list.length === 1 });
    }
  }
}


/* --------------------------------------------------------------------------
   18b. POSTERS — a PDF's first page and a video's first frame
   Rendered once, when the file arrives, and stored on the item as a data URL.
   Everything downstream (canvas, preview, exported HTML, PNG) then shows a
   plain image, so the exported artifact never depends on a PDF renderer,
   a network connection, or this editor.
   -------------------------------------------------------------------------- */

/*
 * pdf.js is bundled into this file (gzipped + base64) so page-one previews
 * work with no network at all. The CDN is only a fallback for the case where
 * the bundle has been stripped out or the browser lacks DecompressionStream.
 * Set window.BENTO_PDFJS = {lib, worker} to point at your own copy.
 */
const PDFJS_SOURCES = [
  {
    lib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'
  },
  {
    lib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js',
    worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js'
  }
];

let pdfjs = null;

function injectScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = () => res();
    s.onerror = () => rej(new Error('could not load ' + src));
    document.head.appendChild(s);
  });
}

/** Inflate one of the embedded gzip+base64 payloads. */
async function inflateEmbedded(id) {
  const node = document.getElementById(id);
  const b64 = node && node.textContent.trim();
  if (!b64) return null;
  if (typeof DecompressionStream === 'undefined') return null;
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}

/** Run a script's source text in the page, the way a <script src> would. */
function runScriptText(text) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => { URL.revokeObjectURL(url); res(); };
    s.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bundled pdf.js would not run')); };
    document.head.appendChild(s);
  });
}

async function loadPDFJS() {
  if (pdfjs) return pdfjs;

  // 1. The copy bundled into this file — no network involved.
  if (!self.BENTO_PDFJS) {
    try {
      const [libSrc, workerSrc] = await Promise.all([
        inflateEmbedded('pdfjsLibGz'), inflateEmbedded('pdfjsWorkerGz')
      ]);
      if (libSrc && workerSrc) {
        if (!self.pdfjsLib) await runScriptText(libSrc);
        if (self.pdfjsLib) {
          self.pdfjsLib.GlobalWorkerOptions.workerSrc =
            URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' }));
          pdfjs = self.pdfjsLib;
          return pdfjs;
        }
      }
    } catch (err) {
      console.warn('bundled pdf.js unavailable', err);
    }
  }

  // 2. A self-hosted copy, or the CDN.
  const sources = [].concat(self.BENTO_PDFJS || [], PDFJS_SOURCES);
  let last = null;
  for (const src of sources) {
    try {
      if (!self.pdfjsLib) await injectScript(src.lib);
      const lib = self.pdfjsLib;
      if (!lib) throw new Error('pdf.js did not initialise');
      // A cross-origin worker script cannot be used directly, so fetch it and
      // hand pdf.js a same-origin blob.
      try {
        const text = await (await fetch(src.worker)).text();
        lib.GlobalWorkerOptions.workerSrc =
          URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
      } catch {
        lib.GlobalWorkerOptions.workerSrc = src.worker;
      }
      pdfjs = lib;
      return lib;
    } catch (err) { last = err; }
  }
  throw new Error(last?.message || 'PDF renderer unavailable');
}

function dataURLToBlob(url) {
  const s = String(url);
  const head = s.slice(0, s.indexOf(','));
  const mime = (head.match(/^data:([^;,]+)/) || [, 'application/octet-stream'])[1];
  return new Blob([dataURLBytes(s)], { type: mime });
}

function dataURLBytes(url) {
  const comma = String(url).indexOf(',');
  if (comma < 0) throw new Error('not a data URL');
  const bin = atob(String(url).slice(comma + 1));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/** Render page 1 of a PDF to a JPEG data URL. */
async function pdfFirstPage(dataURL, targetW = 1100) {
  const lib = await loadPDFJS();
  const doc = await lib.getDocument({
    data: dataURLBytes(dataURL),
    isEvalSupported: false,
    disableAutoFetch: true
  }).promise;
  try {
    const page = await doc.getPage(1);
    const base = page.getViewport({ scale: 1 });
    const scale = clamp(targetW / base.width, 0.4, 4);
    const vp = page.getViewport({ scale });
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(vp.width));
    cv.height = Math.max(1, Math.round(vp.height));
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    return {
      poster: cv.toDataURL('image/jpeg', 0.85),
      pages: doc.numPages, w: cv.width, h: cv.height
    };
  } finally {
    try { doc.destroy(); } catch {}
  }
}

/** Grab a representative frame from a video. No dependencies needed. */
function videoFirstFrame(src) {
  return new Promise((res, rej) => {
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.preload = 'auto';
    v.crossOrigin = 'anonymous';
    let settled = false;
    const done = fn => (...a) => { if (settled) return; settled = true; clearTimeout(timer); cleanup(); fn(...a); };
    const cleanup = () => { try { v.removeAttribute('src'); v.load(); } catch {} };
    const fail = done(() => rej(new Error('could not read a frame from this video')));
    const timer = setTimeout(fail, 15000);
    const grab = () => {
      try {
        const cv = document.createElement('canvas');
        cv.width = v.videoWidth;
        cv.height = v.videoHeight;
        if (!cv.width || !cv.height) return fail();
        cv.getContext('2d').drawImage(v, 0, 0);
        const poster = cv.toDataURL('image/jpeg', 0.85);
        done(res)({ poster, w: cv.width, h: cv.height });
      } catch { fail(); }
    };
    v.addEventListener('error', fail, { once: true });
    v.addEventListener('loadeddata', () => {
      const at = Math.min(isFinite(v.duration) && v.duration ? v.duration * 0.1 : 0.1, 3);
      if (Math.abs(v.currentTime - at) < 0.02) return grab();
      v.addEventListener('seeked', grab, { once: true });
      try { v.currentTime = at; } catch { grab(); }
    }, { once: true });
    v.src = src;
  });
}

/** Reshape a card to the aspect ratio of its poster. */
function fitToPoster(item, w, h) {
  if (!w || !h) return;
  item.h = Math.round(Math.max(MIN_H, item.w * (h / w)));
}

/**
 * Produce (or refresh) the poster for a pdf/video card.
 * `fit` reshapes the card to the source's aspect ratio — wanted when the file
 * has just arrived, unwanted when the user has already sized the card.
 */
async function ensurePoster(item, { fit = false, announce = true } = {}) {
  const src = item.data || item.image || item.url;
  if (!src) { if (announce) flash('This Bento has no file yet', 'warn'); return false; }
  const busy = announce
    ? flash(item.type === 'pdf' ? 'Rendering page 1…' : 'Capturing a frame…')
    : null;
  try {
    const r = item.type === 'pdf' ? await pdfFirstPage(src) : await videoFirstFrame(src);
    if (!byId(item.id)) return false;          // deleted while we worked
    item.poster = r.poster;
    if (r.pages) item.pages = r.pages;
    if (fit) fitToPoster(item, r.w, r.h);
    refreshItem(item);
    renderInspector();
    save();
    busy?.();
    if (announce) flash(item.type === 'pdf'
      ? `Page 1 preview added${r.pages ? ` · ${r.pages} page${r.pages === 1 ? '' : 's'}` : ''}`
      : 'Video frame captured');
    return true;
  } catch (err) {
    busy?.();
    console.warn('poster failed', err);
    if (announce) {
      flash(item.type === 'pdf'
        ? 'Could not render page 1 — ' + (err?.message || 'renderer unavailable') +
          '. You can add a preview image by hand.'
        : 'Could not capture a frame — ' + (err?.message || 'unsupported format'), 'warn');
    }
    return false;
  }
}

/* --------------------------------------------------------------------------
   19. EDIT OPERATIONS
   -------------------------------------------------------------------------- */

function deleteSelection() {
  const items = selected();
  if (!items.length) return;
  const backup = JSON.stringify(state);
  History.begin();
  const ids = new Set(items.map(i => i.id));
  state.items = state.items.filter(i => !ids.has(i.id));
  view.sel.clear();
  settleWorld();
  render();
  History.commit(items.length > 1 ? `Delete ${items.length} Bentos` : 'Delete');
  flash(items.length > 1 ? `${items.length} Bentos deleted` : 'Bento deleted', '', {
    label: 'Undo',
    run: () => {
      try {
        state = migrate(JSON.parse(backup));
        view.sel = new Set(ids);
        applyTheme(); layout(); render(); save();
      } catch {}
    }
  });
}

function duplicateSelection() {
  const items = selected();
  if (!items.length) return;
  History.begin();
  const fresh = [];
  for (const it of items) {
    const spot = freeSpot(it.x + 26, it.y + 24, it.w, it.h);
    const copy = { ...it, id: state.next++, z: nextZ(), ...spot };
    state.items.push(copy);
    fresh.push(copy.id);
  }
  view.sel = new Set(fresh);
  render();
  History.commit(items.length > 1 ? `Duplicate ${items.length} Bentos` : 'Duplicate');
  flash('Duplicated');
}

function reorder(mode) {
  const items = selected();
  if (!items.length) return;
  History.begin();
  const sorted = state.items.slice().sort((a, b) => a.z - b.z);
  const ids = new Set(items.map(i => i.id));
  const rest = sorted.filter(i => !ids.has(i.id));
  const picked = sorted.filter(i => ids.has(i.id));

  let next;
  if (mode === 'front') next = [...rest, ...picked];
  else if (mode === 'back') next = [...picked, ...rest];
  else {
    next = sorted.slice();
    const dir = mode === 'forward' ? 1 : -1;
    const order = dir > 0 ? picked.slice().reverse() : picked;
    for (const it of order) {
      const i = next.indexOf(it);
      const j = i + dir;
      if (j < 0 || j >= next.length) continue;
      if (ids.has(next[j].id)) continue;
      next.splice(i, 1);
      next.splice(j, 0, it);
    }
  }
  next.forEach((it, i) => { it.z = i + 1; });
  render();
  History.commit('Reorder');
}

function alignSelection(how) {
  const items = selected();
  if (items.length < 2) return;
  History.begin();
  const b = bboxOf(items);
  for (const it of items) {
    if (how === 'left') it.x = b.x;
    if (how === 'right') it.x = b.x + b.w - it.w;
    if (how === 'hcenter') it.x = Math.round(b.x + (b.w - it.w) / 2);
    if (how === 'top') it.y = b.y;
    if (how === 'bottom') it.y = b.y + b.h - it.h;
    if (how === 'vcenter') it.y = Math.round(b.y + (b.h - it.h) / 2);
  }
  render();
  History.commit('Align');
}

function distributeSelection(axis) {
  const items = selected();
  if (items.length < 3) return;
  History.begin();
  const key = axis === 'x' ? 'x' : 'y';
  const size = axis === 'x' ? 'w' : 'h';
  const sorted = items.slice().sort((a, b) => a[key] - b[key]);
  const first = sorted[0], last = sorted.at(-1);
  const span = (last[key] + last[size]) - first[key];
  const used = sorted.reduce((s, i) => s + i[size], 0);
  const gap = (span - used) / (sorted.length - 1);
  let cur = first[key];
  for (const it of sorted) { it[key] = Math.round(cur); cur += it[size] + gap; }
  render();
  History.commit('Distribute');
}

function nudge(dx, dy) {
  const items = selected();
  if (!items.length) return;
  History.begin();
  for (const it of items) {
    it.x = Math.round(it.x + dx);
    it.y = Math.round(it.y + dy);
    setBox(it);
  }
  renderSelection();
  updateOutsideWarning();
  commitNudge();
}
const commitNudge = debounce(() => { settleWorld(); History.commit('Nudge'); }, 420);

function selectAll() {
  view.sel = new Set(state.items.map(i => i.id));
  renderSelection();
  renderInspector();
}

function setTheme(id) {
  if (!THEMES[id] || id === state.theme) return;
  History.begin();
  state.theme = id;
  applyTheme();
  render();
  History.commit('Theme · ' + themeOf(id).label);
}

/* --------------------------------------------------------------------------
   20. KEYBOARD
   -------------------------------------------------------------------------- */

const typingIn = t =>
  t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);

addEventListener('keydown', ev => {
  const meta = ev.metaKey || ev.ctrlKey;

  if (ev.key === 'Escape') {
    if ($('#focus').classList.contains('on')) return closeFocus();
    if (view.tool) return setTool('');
    if (!$('#railMore').hidden) { $('#railMore').hidden = true; return; }
    if ($$('.modalWrap.on').length) return closeModals();
    if (view.mode === 'preview') return setMode('edit');
    if (isRenaming()) return endRename(false);
    if (view.frameSel) return selectFrame(false);
    if (view.sel.size) { view.sel.clear(); renderSelection(); renderInspector(); return; }
    if (ui.panel) return setPanel(false);
    return;
  }

  // Inside the focus view the arrows page a document, or step between Bentos.
  if ($('#focus').classList.contains('on')) {
    const paging = !!$('#focusFoot .fPager');
    if (ev.key === 'ArrowRight' || ev.key === 'PageDown') {
      ev.preventDefault();
      paging ? showDocPage(docView.page + 1) : focusStep(1);
    } else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') {
      ev.preventDefault();
      paging ? showDocPage(docView.page - 1) : focusStep(-1);
    }
    return;
  }

  if (typingIn(ev.target)) {
    if (meta && ev.key.toLowerCase() === 's') { ev.preventDefault(); flushSave(); flash('Saved'); }
    return;
  }

  const k = ev.key.toLowerCase();

  // Single letters arm a tool, the way a drawing app does.
  if (!meta && !ev.altKey && k in TOOL_KEYS) { ev.preventDefault(); setTool(TOOL_KEYS[k]); return; }
  if (!meta && ev.key === '\\') { ev.preventDefault(); toggleDrawer(); return; }

  if (meta && k === 'z') { ev.preventDefault(); History.step(ev.shiftKey ? 'redo' : 'undo'); return; }
  if (meta && k === 'y') { ev.preventDefault(); History.step('redo'); return; }
  if (meta && k === 'd') { ev.preventDefault(); duplicateSelection(); return; }
  if (meta && k === 'a') { ev.preventDefault(); selectAll(); return; }
  if (meta && k === 'e') { ev.preventDefault(); openExport(); return; }
  if (meta && k === 's') { ev.preventDefault(); flushSave(); flash('Saved'); return; }
  if (meta && ev.shiftKey && k === 'p') { ev.preventDefault(); setMode(view.mode === 'preview' ? 'edit' : 'preview'); return; }
  if (meta && ev.key === ']') { ev.preventDefault(); reorder(ev.shiftKey ? 'front' : 'forward'); return; }
  if (meta && ev.key === '[') { ev.preventDefault(); reorder(ev.shiftKey ? 'back' : 'backward'); return; }
  if (meta && (ev.key === '=' || ev.key === '+')) { ev.preventDefault(); zoomBy(1.15); return; }
  if (meta && ev.key === '-') { ev.preventDefault(); zoomBy(1 / 1.15); return; }
  if (meta && ev.key === '0') { ev.preventDefault(); view.zoom = 'fit'; layout(); renderSelection(); return; }

  if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); deleteSelection(); return; }

  const step = ev.shiftKey ? 10 : 1;
  if (ev.key === 'ArrowLeft') { ev.preventDefault(); nudge(-step, 0); return; }
  if (ev.key === 'ArrowRight') { ev.preventDefault(); nudge(step, 0); return; }
  if (ev.key === 'ArrowUp') { ev.preventDefault(); nudge(0, -step); return; }
  if (ev.key === 'ArrowDown') { ev.preventDefault(); nudge(0, step); return; }

  // Only hijack Tab when a card is already selected and no panel is open,
  // so normal focus navigation still works everywhere else.
  if (ev.key === 'Tab' && state.items.length && view.sel.size &&
      !$('.modalWrap.on') && !$('#focus').classList.contains('on')) {
    ev.preventDefault();
    const order = state.items.slice().sort((a, b) => a.z - b.z);
    const cur = order.findIndex(i => view.sel.has(i.id));
    const nxt = order[(cur + (ev.shiftKey ? -1 : 1) + order.length) % order.length];
    view.sel = new Set([nxt.id]);
    renderSelection(); renderInspector();
  }
});

function zoomBy(f) {
  view.zoom = clamp((view.zoom === 'fit' ? view.k : view.zoom) * f, 0.1, 4);
  layout();
  renderSelection();
}

const fText = (id, label, val, ph = '') =>
  `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="text" value="${esc(val || '')}" placeholder="${esc(ph)}"></div>`;

const fArea = (id, label, val, ph = '') =>
  `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" placeholder="${esc(ph)}">${esc(val || '')}</textarea></div>`;

const fNum = (id, label, val, min, max) =>
  `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="number" value="${Math.round(num(val))}" min="${min}" max="${max}" step="1"></div>`;

function renderInspector() {
  const box = $('#inspector');
  pruneSelection();

  $('#selCount').textContent = n > 1 ? n + ' selected' : '';

        <button class="sBtn danger" data-op="del">Delete ${n}</button>
      </div>`;
    wireInspectorButtons();
    return;
  }

  const i = soleSelected();
  if (!i) { box.innerHTML = `<div class="empty">Nothing is selected.</div>`; return; }
  const T = TYPES[i.type] || TYPES.text;
  let h = `<div class="field"><label for="fType">Type</label><select id="fType">${
    Object.entries(TYPES).map(([k, v]) =>
      `<option value="${k}"${k === i.type ? ' selected' : ''}>${v.label}</option>`).join('')
  }</select></div>`;

  if (i.type !== 'spacer') {
    h += fText('fTitle', i.type === 'number' ? 'Number' : 'Title', i.title, T.label);
    h += fArea('fBody', i.type === 'quote' ? 'Quote' : i.type === 'markdown' ? 'Markdown' : 'Description', i.body);
  }

  if (i.type === 'quote') h += fText('fBy', 'Attribution', i.by, 'who said it');
  if (i.type === 'link') h += fText('fUrl', 'Displayed URL', i.url, 'https://…');
  if (i.type === 'place') h += fText('fMeta', 'Coordinates or note', i.meta, '35.0116, 135.7681');

  if (i.type === 'image' || i.type === 'place' || i.type === 'person') {
    h += fText('fImage', i.type === 'person' ? 'Avatar URL or data' : 'Image URL or data', i.image, 'https://… or drop a file');
    h += `<div class="btnRow" style="margin:-4px 0 12px"><button class="sBtn" data-pick="image">Replace image…</button>${i.image ? `<button class="sBtn" data-op="clearImage">Remove</button>` : ''}</div>`;
  }
  if (i.type === 'image') {
    h += `<div class="field"><label>Framing</label><div class="chipRow">
      <button class="chip" data-fit="cover" aria-pressed="${i.fit !== 'contain'}">Fill</button>
      <button class="chip" data-fit="contain" aria-pressed="${i.fit === 'contain'}">Fit whole image</button>
    </div></div>`;
    h += `<div class="field"><label>Focal point</label><div class="chipRow">${
      [['50% 50%', 'Centre'], ['50% 0%', 'Top'], ['50% 100%', 'Bottom'], ['0% 50%', 'Left'], ['100% 50%', 'Right']]
        .map(([v, l]) => `<button class="chip" data-focal="${v}" aria-pressed="${(i.focal || '50% 50%') === v}">${l}</button>`).join('')
    }</div></div>`;
    h += fText('fAlt', 'Alt text', i.alt, 'described for screen readers');
  }

  if (['video', 'audio', 'pdf', 'file', 'embed'].includes(i.type)) {
    const facts = [
      i.size ? formatBytes(i.size) : (i.html ? formatBytes(i.html.length) : ''),
      i.pages ? i.pages + (i.pages === 1 ? ' page' : ' pages') : ''
    ].filter(Boolean).join(' · ');
    h += `<div class="field"><label>File</label>${
      i.name || i.data || i.html
        ? `<div class="fileMeta"><span class="glyph">${esc(glyphFor(i))}</span><span><b>${esc(i.name || 'inline content')}</b><small>${esc(facts)}</small></span></div>`
        : `<div class="fileMeta"><span class="glyph">◇</span><span><b>No file yet</b><small>choose one below</small></span></div>`
    }<div class="btnRow">${i.type === 'pdf' && (i.data || i.poster) ? `<button class="sBtn" data-op="viewDoc">Open document</button>` : ''}<button class="sBtn" data-pick="file">${i.data || i.html ? 'Replace file…' : 'Choose file…'}</button></div></div>`;

  if (i.type === 'pdf' || i.type === 'video') {

    h += `<div class="field"><label>Preview image</label>
      ${i.poster
        ? `<img src="${esc(safeURL(i.poster))}" alt="" style="width:100%;max-height:150px;object-fit:contain;object-position:50% 0;background:#fff;border:1px solid var(--sheetLine);border-radius:9px;display:block;margin-bottom:8px">`
        : `<p class="help" style="margin:-2px 0 8px">No preview yet — the card shows an icon. Render the ${what}, or supply your own image.</p>`}
      <div class="btnRow">
        <button class="sBtn" data-op="poster">${i.poster ? 'Re-render' : 'Render ' + what}</button>
        <button class="sBtn" data-pick="poster">Use an image…</button>
        ${i.poster ? `<button class="sBtn" data-op="clearPoster">Remove</button>` : ''}
      </div>
      ${i.type === 'pdf'
        ? `<p class="help" style="margin-top:8px">Rendering a PDF page needs a one-off download of the PDF renderer, so it needs a connection the first time. The rendered image is then stored in the page and travels with your exports.</p>`
        : `<p class="help" style="margin-top:8px">The frame is also what an image export shows, since a PNG cannot hold video.</p>`}
    </div>`;
  }

  h += `<div class="sectionLabel"><span>Depth</span></div>`;
  const opts = previewOptions(i);
  if (opts.length > 1) {
    const chosen = opts.includes(i.preview) ? i.preview : opts[0];
    h += `<div class="field"><label>When expanded, show</label><div class="chipRow">${
      opts.map(o => `<button class="chip" data-preview="${o}" aria-pressed="${o === chosen}">${PREVIEW_LABEL[o] || o}</button>`).join('')
    }</div></div>`;
  }
  h += fText('fHref', 'Opens (link)', i.href, 'https://…');
  h += fArea('fStory', 'Story shown on click', i.story, 'The longer version. Leave empty for none.');
  h += `<p class="help">In Preview, a card with a link opens it; one with a story shows a “＋” you can click.</p>`;

  h += `<div class="sectionLabel"><span>Geometry</span></div>
    <div class="field"><div class="row">
      <span><label for="fX">X</label><input id="fX" type="number" value="${i.x - state.frame.x}" step="1"></span>
      <span><label for="fY">Y</label><input id="fY" type="number" value="${i.y - state.frame.y}" step="1"></span>
    </div></div>
    <div class="field"><div class="row">
      <span><label for="fW">Width</label><input id="fW" type="number" value="${i.w}" min="${MIN_W}" step="1"></span>
      <span><label for="fH">Height</label><input id="fH" type="number" value="${i.h}" min="${MIN_H}" step="1"></span>
    </div></div>
    <p class="help" style="margin:-6px 0 12px">X and Y are measured from the top-left of the export frame.</p>
    <div class="field"><label for="fRot">Rotation · <span id="rotRead">${num(i.rot, 0)}°</span></label>
      <input id="fRot" type="range" min="-45" max="45" step="0.5" value="${num(i.rot, 0)}" style="width:100%">
    </div>
    <div class="btnRow" style="margin:-4px 0 4px">
      <button class="sBtn" data-op="fitRatio">Match image ratio</button>
      <button class="sBtn" data-op="resetRot">Straighten</button>
    </div>`;

  h += zOrderRow();
  h += `<div class="btnRow" style="margin-top:12px">
      <button class="sBtn" data-op="dup">Duplicate</button>
      <button class="sBtn danger" data-op="del">Delete</button>
    </div>`;

  box.innerHTML = h;
  wireInspectorFields(i);
  wireInspectorButtons();
}

function frameInspectorHTML() {
  const f = state.frame;
  const outside = itemsOutsideFrame().length;
  return `
    <p class="help">This is the box that gets previewed and exported. Drag it or its handles on the canvas, or set it here. Moving it never moves your Bentos.</p>
    <div class="field"><label>Presets</label><div class="chipRow">${
      CANVAS_PRESETS.map(([l, w, hh]) =>
        `<button class="chip" data-fpreset="${w}x${hh}" aria-pressed="${f.w === w && f.h === hh}">${l}</button>`).join('')
    }</div></div>
    <div class="field"><div class="row">
      <span><label for="frW">Width</label><input id="frW" type="number" value="${f.w}" min="200" max="20000" step="10"></span>
      <span><label for="frH">Height</label><input id="frH" type="number" value="${f.h}" min="200" max="20000" step="10"></span>
    </div></div>
    ${outside ? `<p class="help" style="color:var(--danger)">${outside} Bento${outside === 1 ? '' : 's'} outside the frame would be cropped.</p>` : ''}
    <div class="btnRow">
      <button class="sBtn" id="frFit">Fit to content</button>
      <button class="sBtn" id="frDone">Done</button>
    </div>`;

function wireFrameInspector() {
  $$('#inspector [data-fpreset]').forEach(b => b.addEventListener('click', () => {
    const [w, h] = b.dataset.fpreset.split('x').map(Number);
    resizeFrame(w, h);
    renderInspector();
  }));
  const apply = () => resizeFrame(
    Math.round(clamp(num($('#frW').value, state.frame.w), 200, 20000)),
    Math.round(clamp(num($('#frH').value, state.frame.h), 200, 20000)));
  $('#frW')?.addEventListener('change', apply);
  $('#frH')?.addEventListener('change', apply);
  $('#frFit')?.addEventListener('click', () => { fitFrameToContent(); renderInspector(); });
  $('#frDone')?.addEventListener('click', () => selectFrame(false));
}

const zOrderRow = () => `
  <div class="sectionLabel"><span>Layer</span></div>
  <div class="zRow">
    <button class="sBtn" data-z="back" title="Send to back (⇧⌘[)">⤓</button>
    <button class="sBtn" data-z="backward" title="Send backward (⌘[)">↓</button>
    <button class="sBtn" data-z="forward" title="Bring forward (⌘])">↑</button>
    <button class="sBtn" data-z="front" title="Bring to front (⇧⌘])">⤒</button>
  </div>`;

function wireInspectorFields(i) {
  /* Text-ish fields: one history entry per burst of typing, live re-render. */
  const bindText = (id, key) => {
    const n = $('#' + id);
    if (!n) return;
    n.addEventListener('input', () => {
      History.begin();
      i[key] = n.value;
      refreshItem(i);
      commitTyping();
    });
  };
  ['fTitle:title', 'fBody:body', 'fBy:by', 'fUrl:url', 'fMeta:meta',
   'fHref:href', 'fStory:story', 'fAlt:alt', 'fImage:image']
    .forEach(p => { const [id, key] = p.split(':'); bindText(id, key); });

  /* Geometry: clamp, ignore empty input, never write NaN. */
  const bindNum = (id, key, lo, hi) => {
    const n = $('#' + id);
    if (!n) return;
    const apply = () => {
      if (n.value === '') return;
      const raw = Math.round(clamp(num(n.value, 0), lo(), hi()));
      // X/Y are shown relative to the frame; store them in world coordinates.
      const v = (key === 'x' || key === 'y') ? raw + state.frame[key] : raw;
      if (v === i[key]) return;
      History.begin();
      i[key] = v;
      setBox(i);
      renderSelection();
      updateOutsideWarning();
      commitTyping();
    };
    n.addEventListener('input', apply);
    n.addEventListener('change', () => {
      const shown = (key === 'x' || key === 'y') ? i[key] - state.frame[key] : i[key];
      if (n.value === '') n.value = shown;
      apply();
      n.value = (key === 'x' || key === 'y') ? i[key] - state.frame[key] : i[key];
      settleWorld();
    });
  };
  bindNum('fX', 'x', () => -1e6, () => 1e6);
  bindNum('fY', 'y', () => -1e6, () => 1e6);
  bindNum('fW', 'w', () => MIN_W, () => 20000);
  bindNum('fH', 'h', () => MIN_H, () => 20000);

  const rot = $('#fRot');
  if (rot) rot.addEventListener('input', () => {
    History.begin();
    i.rot = clamp(num(rot.value, 0), -45, 45);
    $('#rotRead').textContent = i.rot + '°';
    setBox(i);
    renderSelection();
    commitTyping();
  });

  const type = $('#fType');
  if (type) type.addEventListener('change', () => {
    History.begin();
    i.type = TYPES[type.value] ? type.value : 'text';
    render();
    History.commit('Change type');
  });

  $$('#inspector [data-fit]').forEach(b => b.addEventListener('click', () => {
    History.begin(); i.fit = b.dataset.fit; refreshItem(i); renderInspector(); History.commit('Framing');
  }));
  $$('#inspector [data-preview]').forEach(b => b.addEventListener('click', () => {
    History.begin();
    i.preview = b.dataset.preview;
    refreshItem(i);
    renderInspector();
    History.commit('Expanded view');
  }));
  $$('#inspector [data-focal]').forEach(b => b.addEventListener('click', () => {
    History.begin(); i.focal = b.dataset.focal; refreshItem(i); renderInspector(); History.commit('Focal point');
  }));
}

let pickTarget = null;

function wireInspectorButtons() {
  $$('#inspector [data-op]').forEach(b => b.addEventListener('click', async () => {
    const i = soleSelected();
    switch (b.dataset.op) {
      case 'dup': return duplicateSelection();
      case 'del': return deleteSelection();
      case 'clearImage':
        if (!i) return;
        History.begin(); i.image = ''; refreshItem(i); renderInspector(); History.commit('Remove image');
        return;
      case 'poster':
        if (!i) return;
        return void ensurePoster(i, { fit: false, announce: true });
      case 'viewDoc':
        if (!i) return;
        return void openDoc(i);
      case 'clearPoster':
        if (!i) return;
        History.begin(); i.poster = ''; refreshItem(i); renderInspector(); History.commit('Remove preview');
        return;
      case 'resetRot':
        if (!i) return;
        History.begin(); i.rot = 0; setBox(i); renderSelection(); renderInspector(); History.commit('Straighten');
        return;
      case 'fitRatio': {
        if (!i || !i.image) return flash('No image on this Bento', 'warn');
        try {
          const d = await imageSize(i.image);
          History.begin();
          i.h = Math.round(Math.max(MIN_H, i.w * (d.h / d.w)));
          setBox(i); settleWorld(); renderSelection(); renderInspector();
          History.commit('Match ratio');
        } catch { flash('Could not read that image', 'err'); }
        return;
      }
    }
  }));

  $$('#inspector [data-z]').forEach(b => b.addEventListener('click', () => reorder(b.dataset.z)));
  $$('#inspector [data-align]').forEach(b => b.addEventListener('click', () => alignSelection(b.dataset.align)));
  $$('#inspector [data-dist]').forEach(b => b.addEventListener('click', () => distributeSelection(b.dataset.dist)));

  $$('#inspector [data-pick]').forEach(b => b.addEventListener('click', () => {
    const i = soleSelected();
    if (!i) return;
    pickTarget = { id: i.id, kind: b.dataset.pick };
    const inp = $('#fileInput');
    inp.multiple = false;
    inp.accept = (b.dataset.pick === 'image' || b.dataset.pick === 'poster')
      ? 'image/*' : inp.getAttribute('data-all');
    inp.click();
  }));
}

/** Replace the media on an existing Bento rather than adding a new one. */
async function replaceOn(item, file) {
  History.begin();
  item.name = file.name;
  item.mime = file.type || '';
  item.size = file.size;
  if ((file.type || '').startsWith('image/')) {
    item.image = await fileToDataURL(file);
    if (item.type === 'file' || item.type === 'pdf') item.type = 'image';
  } else if (/\.html?$/i.test(file.name)) {
    item.html = (await fileToText(file)).slice(0, 400000);
    item.data = '';
    item.type = 'embed';
  } else if (/\.(md|markdown)$/i.test(file.name)) {
    item.body = await fileToText(file);
    item.type = 'markdown';
  } else {
    item.data = await fileToDataURL(file);
    const t = typeForFile(file);
    if (t !== 'text') item.type = t;
  }
  if (!item.title) item.title = file.name.replace(/\.[^.]+$/, '');
  item.poster = '';
  delete item.pages;
  render();
  History.commit('Replace file');
  flash('Replaced with ' + file.name);
  if (item.type === 'pdf' || item.type === 'video') ensurePoster(item, { fit: true });
}
