/** Resize the export frame about its own centre; Bentos are left alone. */
function resizeFrame(w, h) {
  if (w === state.frame.w && h === state.frame.h) return;
  History.begin();
  const f = state.frame;
  const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
  state.frame = { x: Math.round(cx - w / 2), y: Math.round(cy - h / 2), w, h };
  state.canvas = { w, h };
  normaliseWorld();
  view.zoom = 'fit';
  layout(); render();
  History.commit('Frame size');
}

/** The box every Bento fits inside, plus a margin. */
function contentBounds(pad = 0) {
  if (!state.items.length) return { ...state.frame };
  const b = bboxOf(state.items);
  return {
    x: Math.floor(b.x - pad), y: Math.floor(b.y - pad),
    w: Math.ceil(b.w + pad * 2), h: Math.ceil(b.h + pad * 2)
  };
}

/** Wrap the export frame around everything on the plane. */
function fitFrameToContent() {
  if (!state.items.length) return flash('There are no Bentos yet', 'warn');
  History.begin();
  const b = contentBounds(48);
  state.frame = { x: b.x, y: b.y, w: Math.max(200, b.w), h: Math.max(200, b.h) };
  state.canvas = { w: state.frame.w, h: state.frame.h };
  normaliseWorld();
  view.zoom = 'fit';
  layout({ centreFrame: true });
  render();
  History.commit('Fit frame');
  flash(`Frame is now ${state.frame.w} × ${state.frame.h}`);
}

const renderPageListSoon = debounce(() => renderPageList(), 400);

function renderPageList() {

  box.innerHTML = list.map(g => `
    <div class="pageRow" data-g="${esc(g.id)}"${g.id === state.id ? ' aria-current="true"' : ''}>

        <b>${esc(g.title || 'Untitled Page')}</b>
        <small>${g.count || 0} Bento${g.count === 1 ? '' : 's'} · ${themeOf(g.theme).label}${g.id === state.id ? ' · open' : ''}</small>
      </button>
      <button class="gAct" data-dupg="${esc(g.id)}" title="Duplicate" aria-label="Duplicate page">⧉</button>
      <button class="gAct" data-delg="${esc(g.id)}" title="Delete" aria-label="Delete page">⌫</button>
    </div>`).join('');

    b.addEventListener('click', () => deletePage(b.dataset.delg)));
}

function adoptState(next, label) {
  flushSave();
  state = next;
  view.sel.clear();
  view.zoom = 'fit';
  History.undo.length = 0;
  History.redo.length = 0;
  History.pending = null;
  syncHistoryUI();
  applyTheme();
  layout({ centreFrame: true });
  render();
  save();
  renderPageList();
  if (label) flash(label);
}

function newPage() {
  const g = defaultPage(state.frame.w, state.frame.h);
  g.items = [];
  g.next = 1;
  g.title = 'Untitled Page';
  adoptState(g, 'New page started — the canvas is yours');
}

async function openPage(id) {
  if (id === state.id) return setPanel(true, 'page');
  try {
    const raw = await Store.get(id);
    if (!raw) { Store.dropIndex(id); renderPageList(); return flash('That page is no longer stored', 'warn'); }
    adoptState(migrate(raw), 'Opened “' + (raw.title || 'Untitled') + '”');
  } catch (err) {
    flash('Could not open that page: ' + (err?.message || 'unreadable'), 'err');
  }
}

async function duplicatePage(id) {
  try {
    const raw = id === state.id ? JSON.parse(JSON.stringify(state)) : await Store.get(id);
    if (!raw) return;
    const copy = migrate(raw);
    copy.id = uid();
    copy.title = (copy.title || 'Untitled Page') + ' copy';
    await Store.put(copy.id, copy);
    Store.touchIndex(copy);
    renderPageList();
    flash('Duplicated to “' + copy.title + '”');
  } catch (err) { flash('Could not duplicate: ' + (err?.message || ''), 'err'); }
}

async function deletePage(id) {
  const entry = Store.index().find(e => e.id === id);
  const ok = await askConfirm('Delete this page?',
    `“${entry?.title || 'Untitled Page'}” will be removed from this browser. Exported files are unaffected. This cannot be undone.`, 'Delete');
  if (!ok) return;
  let backup = null;
  try { backup = await Store.get(id); } catch {}
  await Store.del(id).catch(() => {});
  Store.dropIndex(id);
  if (id === state.id) {
    const nextId = Store.index()[0]?.id;
    if (nextId) await openPage(nextId);
    else newPage();
  }
  renderPageList();
  flash('Page deleted', '', backup ? {
    label: 'Undo', run: async () => {
      try {
        const r = migrate(backup);
        await Store.put(r.id, r);
        Store.touchIndex(r);
        renderPageList();
        flash('Restored');
      } catch {}
    }
  } : null);
}

/* --------------------------------------------------------------------------
   23. PANEL + TOOL RAIL
   The rail is always available. The panel is not: it stays completely off
   the screen until you ask for it by double-clicking something, so the
   right-hand side is empty while you are just arranging Bentos. Naming
   never needs it — you click a name on the canvas and type.
   -------------------------------------------------------------------------- */

const UI_KEY = 'bento:ui';
const ui = (() => {
  try { return { lock: false, ...JSON.parse(localStorage.getItem(UI_KEY) || '{}'), panel: false }; }
  catch { return { lock: false, panel: false }; }
})();
// The panel is deliberately not remembered: every session starts clean.
const saveUI = () => {
  try { localStorage.setItem(UI_KEY, JSON.stringify({ lock: ui.lock })); } catch {}
};

function setPanel(open, mode) {
  const want = !!open;
  if (want) ui.panelMode = mode || 'sel';
  if (ui.panel === want) { if (want) renderPanel(); return; }
  ui.panel = want;
  $('#panel').hidden = !want;
  $('#panelToggle').setAttribute('aria-expanded', String(want));
  if (want) renderPanel();
  // The panel changes how much canvas is visible; in fit mode the frame
  // should stay centred in what is left rather than drifting up behind
  // the brand.
  layout({ centreFrame: view.zoom === 'fit' });
}

/**
 * The panel is only ever shown for something. Opened from a selection, it
 * leaves with that selection; opened for the page itself, it stays until
 * it is closed. Either way nothing you did not ask for is on screen.
 */
function syncPanel() {
  if (!ui.panel) return;
  if (ui.panelMode === 'sel' && !view.sel.size && !view.frameSel) setPanel(false);
  else renderPanel();
}

/** Title the panel by what it is currently showing. */
function renderPanel() {
  const n = view.sel.size;
  const page = $('#panelPage');
  const insp = $('#inspector');
  const showSel = n > 0 || view.frameSel;
  page.hidden = showSel;
  insp.hidden = !showSel;
  $('#panelTitle').textContent = view.frameSel ? 'Export frame'
    : n > 1 ? 'Selection'
    : n === 1 ? (TYPES[soleSelected()?.type]?.label || 'Bento')
    : 'Page';
}

/* Kept so existing call sites keep working: there are no drawers any more,
   but "show me the properties" is still a meaningful request. */
function openDrawer() { setPanel(true); }
function closeDrawers() { setPanel(false); }
function toggleDrawer() {
  if (ui.panel) return setPanel(false);
  setPanel(true, view.sel.size || view.frameSel ? 'sel' : 'page');
}

$('#panelToggle').addEventListener('click', () => setPanel(false));

/* ---- the tool rail ---- */

const RAIL_PRIMARY = ['image', 'text', 'quote', 'link', 'number', 'markdown'];
const RAIL_MORE = ADD_ORDER.filter(t => !RAIL_PRIMARY.includes(t));
const TOOL_KEYS = { v: '', i: 'image', t: 'text', q: 'quote', l: 'link', n: 'number', m: 'markdown' };

function toolButton(type, withLabel) {
  const T = TYPES[type];
  const glyph = esc(T.glyph);
  return `<button class="tool" data-tool="${type}" data-label="${esc(T.label)}" aria-pressed="false" title="${esc(T.label)}">` +
    `<span class="tIcon${glyph.length > 1 ? ' small' : ''}" aria-hidden="true">${glyph}</span>` +
    (withLabel ? `<span>${esc(T.label)}</span>` : '') + `</button>`;
}

function buildRail() {

  $('#railMoreGrid').innerHTML = RAIL_MORE.map(t => toolButton(t, true)).join('');
  $('#toolSelect').dataset.label = 'Select';
  $('#toolMore').dataset.label = 'More types';
  $('#toolUpload').dataset.label = 'Add a file';
  $('#toolLock').dataset.label = 'Keep tool armed';
  $('#toolLock').setAttribute('aria-pressed', String(ui.lock));

}

/** Arm a type. The next click on empty canvas places one. */
function setTool(type) {
  view.tool = type || '';
  document.body.dataset.tool = view.tool;
  for (const b of $$('[data-tool]')) {
    b.setAttribute('aria-pressed', String((b.dataset.tool || '') === view.tool));
  }
  if (view.tool) $('#railMore').hidden = true;
  $('#toolMore').setAttribute('aria-expanded', String(!$('#railMore').hidden));
}

function wireTools() {
  for (const b of $$('.rail [data-tool], #railMore [data-tool]')) {
    // A click arms the tool; a drag carries it onto the canvas.
    b.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      const type = b.dataset.tool || '';
      if (!type) return;
      ev.preventDefault();
      let dragging = false;
      const ghost = $('#toolGhost');

      const move = e => {
        if (!dragging && Math.hypot(e.clientX - ev.clientX, e.clientY - ev.clientY) < 5) return;
        if (!dragging) {
          dragging = true;
          ghost.textContent = TYPES[type].label;
          ghost.hidden = false;
        }
        ghost.style.left = e.clientX + 'px';
        ghost.style.top = e.clientY + 'px';
      };
      const up = e => {
        removeEventListener('pointermove', move);
        removeEventListener('pointerup', up);
        ghost.hidden = true;
        if (!dragging) { setTool(view.tool === type ? '' : type); return; }
        const overCanvas = el.stage.contains(document.elementFromPoint(e.clientX, e.clientY));
        if (overCanvas) {
          const at = toLogical(e.clientX, e.clientY);
          addItem(type, {}, at);
          if (!ui.lock) setTool('');
        }
      };
      addEventListener('pointermove', move);
      addEventListener('pointerup', up);
    });
  }

  $('#toolSelect').addEventListener('click', () => setTool(''));
  $('#toolMore').addEventListener('click', () => {
    const box = $('#railMore');
    box.hidden = !box.hidden;
    $('#toolMore').setAttribute('aria-expanded', String(!box.hidden));
  });
  $('#toolLock').addEventListener('click', () => {
    ui.lock = !ui.lock;
    $('#toolLock').setAttribute('aria-pressed', String(ui.lock));
    saveUI();
    flash(ui.lock ? 'Tool stays armed after placing' : 'Tool returns to select after placing');
  });
}

/* Clicking empty canvas with a tool armed places one there. */
function placeArmedTool(clientX, clientY) {
  if (!view.tool) return false;
  const at = toLogical(clientX, clientY);
  addItem(view.tool, {}, at);
  if (!ui.lock) setTool('');
  return true;
}

/* Keep Tab inside an open modal, so keyboard users cannot fall behind it.
   The panel and rail are not modal and are left alone. */
addEventListener('keydown', ev => {
  if (ev.key !== 'Tab') return;
  const modal = $('.modalWrap.on .modal');
  if (!modal || !modal.contains(document.activeElement)) return;
  const focusable = $$('a[href], button:not(:disabled), input:not(:disabled), textarea, select, [tabindex]:not([tabindex="-1"])', modal)
    .filter(n => n.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0], last = focusable.at(-1);
  if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
}, true);

function closeModals() {
  $$('.modalWrap.on').forEach(m => m.classList.remove('on'));
  if (confirmResolve) { confirmResolve(false); confirmResolve = null; }
}

let confirmResolve = null;

function askConfirm(title, msg, label = 'Confirm') {
  $('#confirmH').textContent = title;
  $('#confirmMsg').textContent = msg;
  $('#bConfirmYes').textContent = label;
  $('#confirmModal').classList.add('on');
  setTimeout(() => $('#bConfirmNo').focus(), 50);
  return new Promise(res => { confirmResolve = res; });
}

$('#bConfirmYes').addEventListener('click', () => {
  $('#confirmModal').classList.remove('on');
  const r = confirmResolve; confirmResolve = null; r?.(true);
});
$('#bConfirmNo').addEventListener('click', () => {
  $('#confirmModal').classList.remove('on');
  const r = confirmResolve; confirmResolve = null; r?.(false);
});

/* Click the backdrop to dismiss. */
$$('.modalWrap').forEach(m => m.addEventListener('pointerdown', ev => {
  if (ev.target === m) { m.classList.remove('on'); if (confirmResolve) { confirmResolve(false); confirmResolve = null; } }
}));

/* --------------------------------------------------------------------------
   24. FOCUS VIEW
   Every Bento expands into the same overlay: images, video, embedded players,
   web pages, documents, markdown and plain cards. Whatever the type, the
   header carries "Open in new tab" when there is somewhere to go.
   -------------------------------------------------------------------------- */

const focusView = { id: null, order: [] };

const KIND_LABEL = {
  image: 'Image', video: 'Video', embedVideo: 'Video', audio: 'Audio',
  doc: 'Document', html: 'Embed', page: 'Link', reader: 'Notes',
  file: 'File', text: 'Bento'
};

function focusableItems() {
  return state.items.slice().sort((a, b) => a.z - b.z).filter(i => focusOf(i));
}

function openFocus(item) {
  const built = focusBodyHTML(item);
  if (!built) return false;

  focusView.id = item.id;
  focusView.order = focusableItems().map(i => i.id);

  $('#focusKind').textContent = KIND_LABEL[built.kind] || 'Bento';
  $('#focusTitle').textContent = item.title || item.name || KIND_LABEL[built.kind] || '';
  $('#focusStage').innerHTML = built.stage;
  $('#focusFoot').innerHTML = built.foot;

  // Buttons: a real anchor for the link, a button for the download.
  const acts = [];
  if (built.href && !/^data:/i.test(built.href)) {
    acts.push(`<a class="primary" href="${esc(built.href)}" target="_blank" rel="noopener noreferrer">Open in new tab ↗</a>`);
  } else if (built.media) {
    acts.push(`<button type="button" class="primary" data-focus-act="open">Open in new tab ↗</button>`);
  }
  if (built.media) acts.push(`<button type="button" data-focus-act="save">Download</button>`);
  $('#focusActs').innerHTML = acts.join('');

  const wrap = $('#focus');
  wrap.dataset.single = focusView.order.length > 1 ? '0' : '1';
  wrap.classList.add('on');
  document.body.style.overflow = 'hidden';

  hydrateFocusFrames();
  if (built.kind === 'doc') mountDocScroller(item);
  $('#focusClose').focus();
  return true;
}

/** Iframes carry data-src so nothing loads until the view is actually open. */
function hydrateFocusFrames() {
  const local = location.protocol === 'file:';
  for (const f of $$('#focusStage iframe')) {
    const src = f.getAttribute('data-src');
    const doc = f.getAttribute('data-srcdoc');
    const wrap = f.closest('.fFrameWrap');
    // Embedded players cannot run from a file:// page, so go straight to the
    // watch-link fallback there instead of loading a broken player.
    if (local && wrap && wrap.querySelector('.fFall')) {
      wrap.classList.add('blocked');
      f.removeAttribute('data-src');
      f.removeAttribute('data-srcdoc');
      continue;
    }
    if (doc != null) f.srcdoc = doc;
    else if (src) f.src = src;
    f.removeAttribute('data-src');
    f.removeAttribute('data-srcdoc');

    // A site that refuses to be framed usually just stays blank, and there is
    // no reliable event for it — so say so if nothing has loaded in time.
    if (!wrap || !wrap.querySelector('.fBlocked')) continue;
    let loaded = false;
    f.addEventListener('load', () => { loaded = true; }, { once: true });
    setTimeout(() => { if (!loaded) wrap.classList.add('blocked'); }, 3500);
  }
}

function closeFocus() {
  const wrap = $('#focus');
  if (!wrap.classList.contains('on')) return;
  wrap.classList.remove('on');
  // Stop any media dead rather than leaving it playing behind the overlay.
  $('#focusStage').innerHTML = '';
  $('#focusFoot').innerHTML = '';
  $('#focusActs').innerHTML = '';
  document.body.style.overflow = '';
  docView.token++;
  docView.io?.disconnect();
  docView.io = null;
  docView.item = null;
  focusView.id = null;
}

function focusStep(dir) {
  const order = focusView.order;
  if (order.length < 2) return;
  const i = order.indexOf(focusView.id);
  const next = order[(i + dir + order.length) % order.length];
  const item = byId(next);
  if (item) openFocus(item);
}

$('#focusClose').addEventListener('click', closeFocus);
$('#focusPrev').addEventListener('click', () => focusStep(-1));
$('#focusNext').addEventListener('click', () => focusStep(1));
$('#focus').addEventListener('pointerdown', ev => {
  if (ev.target.id === 'focus' || ev.target.id === 'focusStage') closeFocus();
});
$('#focusActs').addEventListener('click', ev => {
  if (ev.target.closest('[data-focus-act="save"]')) releaseFile(byId(focusView.id), { save: true });
  if (ev.target.closest('[data-focus-act="open"]')) releaseFile(byId(focusView.id));
});

/* ---- documents: every page, scrollable ---- */

/**
 * Stack the whole document in the focus stage. Page one is the poster we
 * already have, so it appears instantly; the rest are sized from the PDF and
 * rendered only as they scroll into view.
 */
function mountDocScroller(item) {
  docView.item = item;
  docView.page = 1;
  docView.pages = Math.max(1, num(item.pages, 1));
  docView.doc = null;
  docView.ready = null;
  docView.cache.clear();
  docView.token++;
  docView.io?.disconnect();

  const label = document.createElement('span');
  label.className = 'fPageCount';
  label.id = 'docPos';
  label.textContent = docView.pages > 1 ? `Page 1 of ${docView.pages}` : 'Page 1';
  $('#focusFoot').prepend(label);

  const stack = $('#focusStage .fDoc');
  if (!stack) return;

  // Follow the scroll position so the counter means something.
  $('#focusStage').addEventListener('scroll', updateDocPosition, { passive: true });

  if (item.data) docView.ready = loadDocPages(item);
}

function updateDocPosition() {
  const stack = $('#focusStage .fDoc');
  const pos = $('#docPos');
  if (!stack || !pos) return;
  const mid = $('#focusStage').getBoundingClientRect().top + $('#focusStage').clientHeight / 2;
  let best = 1;
  for (const page of stack.children) {
    const r = page.getBoundingClientRect();
    if (r.top <= mid) best = Number(page.dataset.page) || best;
  }
  docView.page = best;
  pos.textContent = docView.pages > 1 ? `Page ${best} of ${docView.pages}` : 'Page 1';
}

/** Add correctly-sized placeholders for pages 2..N and render them lazily. */
async function buildDocPages() {
  const stack = $('#focusStage .fDoc');
  if (!stack || !docView.doc) return;
  const token = docView.token;

  for (let n = 2; n <= docView.doc.numPages; n++) {
    let ratio = 1.414;
    try {
      const pg = await docView.doc.getPage(n);
      const vp = pg.getViewport({ scale: 1 });
      ratio = vp.height / vp.width;
    } catch {}
    if (token !== docView.token) return;
    const ph = document.createElement('div');
    ph.className = 'fPagePh';
    ph.dataset.page = String(n);
    ph.style.aspectRatio = `1 / ${ratio}`;
    stack.appendChild(ph);
  }

  docView.io = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const n = Number(e.target.dataset.page);
      docView.io.unobserve(e.target);
      renderDocPage(n, e.target);
    }
  }, { root: $('#focusStage'), rootMargin: '600px 0px' });

  for (const ph of stack.querySelectorAll('.fPagePh')) docView.io.observe(ph);
  updateDocPosition();
}

async function renderDocPage(n, holder) {
  const token = docView.token;
  if (docView.cache.has(n)) { swapDocPage(holder, docView.cache.get(n), n); return; }
  if (!docView.doc) return;
  try {
    const page = await docView.doc.getPage(n);
    const base = page.getViewport({ scale: 1 });
    const scale = clamp(1400 / base.width, 0.5, 3);
    const vp = page.getViewport({ scale });
    const cv = document.createElement('canvas');
    cv.width = Math.round(vp.width);
    cv.height = Math.round(vp.height);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    if (token !== docView.token) return;
    const url = cv.toDataURL('image/jpeg', 0.86);
    docView.cache.set(n, url);
    swapDocPage(holder, url, n);
  } catch {
    if (token === docView.token) holder.classList.add('failed');
  }
}

function swapDocPage(holder, url, n) {
  if (!holder.isConnected) return;
  const img = document.createElement('img');
  img.className = 'fPage';
  img.dataset.page = String(n);
  img.src = url;
  img.alt = `Page ${n}`;
  holder.replaceWith(img);
}

/** Page controls are gone; the counter is all that is left to keep in step. */
function syncDocCtl() {
  const pos = $('#docPos');
  if (!pos) return;
  pos.textContent = docView.pages > 1 ? `Page ${docView.page} of ${docView.pages}` : 'Page 1';
}


/* ---- document paging, drawn into the focus stage ---- */

const docView = { item: null, page: 1, pages: 1, doc: null, ready: null, cache: new Map(), token: 0, io: null };

async function loadDocPages(item) {
  const token = docView.token;
  try {
    const lib = await loadPDFJS();
    const doc = await lib.getDocument({
      data: dataURLBytes(item.data), isEvalSupported: false, disableAutoFetch: true
    }).promise;
    if (token !== docView.token) { try { doc.destroy(); } catch {} return; }
    docView.doc = doc;
    docView.pages = doc.numPages;
    if (item.pages !== doc.numPages) { item.pages = doc.numPages; refreshItem(item); save(); }
    syncDocCtl();
    if (!item.poster) await showDocPage(1);
    await buildDocPages();
  } catch (err) {
    if (token !== docView.token) return;
    // No renderer: page one still shows, and the explicit actions remain.
    docView.pages = Math.max(1, num(item.pages, 1));
    syncDocCtl();
    if (!item.poster) flash('Could not render this document — use “Open in new tab” instead', 'warn');
  }
}

async function showDocPage(n) {
  const token = docView.token;
  docView.page = clamp(n, 1, docView.pages);
  syncDocCtl();

  const img = $('#focusStage .fPage[data-page="1"]') || $('#focusStage .fPage');
  if (!img) return;
  if (docView.page === 1 && docView.item?.poster && !docView.cache.has(1)) {
    img.src = safeURL(docView.item.poster);
    return;
  }
  if (docView.cache.has(docView.page)) {
    img.src = docView.cache.get(docView.page);
    return;
  }

  // The document may still be loading; wait rather than silently doing nothing.
  if (!docView.doc && docView.ready) { try { await docView.ready; } catch {} }
  if (token !== docView.token) return;
  if (!docView.doc) {
    flash('That page is not available without the PDF renderer', 'warn');
    return;
  }

  try {
    const page = await docView.doc.getPage(docView.page);
    const base = page.getViewport({ scale: 1 });
    const scale = clamp(1400 / base.width, 0.5, 3);
    const vp = page.getViewport({ scale });
    const cv = document.createElement('canvas');
    cv.width = Math.round(vp.width);
    cv.height = Math.round(vp.height);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    if (token !== docView.token) return;
    const url = cv.toDataURL('image/jpeg', 0.86);
    docView.cache.set(docView.page, url);
    const target = $('#focusStage .fPage[data-page="1"]') || $('#focusStage .fPage');
    if (target) target.src = url;
  } catch {
    if (token === docView.token) flash('Could not render page ' + docView.page, 'warn');
  }
}

/** Hand the original file to the browser, in a new tab or as a download. */
function releaseFile(item, { save: asDownload = false } = {}) {
  if (!item?.data) return false;
  let url;
  try { url = URL.createObjectURL(dataURLToBlob(item.data)); }
  catch { flash('Could not read this file', 'err'); return false; }

  if (asDownload) {
    const a = document.createElement('a');
    a.href = url;
    a.download = item.name || 'document';
    document.body.appendChild(a);
    a.click();
    a.remove();
  } else if (!window.open(url, '_blank', 'noopener')) {
    flash('Your browser blocked the new tab — use Download instead', 'warn');
    URL.revokeObjectURL(url);
    return false;
  }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return true;
}

/* ---- compatibility wrappers: everything expands the same way now ---- */
const openLightbox = item => openFocus(item);
const openStory = item => openFocus(item);
const openDoc = item => openFocus(item);
const closeLightbox = () => closeFocus();

function openEmbed(item) {
  if (item.html) {
    const url = URL.createObjectURL(new Blob([item.html], { type: 'text/html' }));
    window.open(url, '_blank', 'noopener');
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } else if (item.data) {
    window.open(item.data, '_blank', 'noopener');
  }
}

/** Perform a Bento's click action: for every type, that means expanding it. */
function activate(item) {
  return openFocus(item);
}

/* Card clicks: select while editing, expand while previewing. */
el.items.addEventListener('click', ev => {
  const node = ev.target.closest('.item');
  if (!node) return;
  const item = byId(Number(node.dataset.id));
  if (!item) return;

  // The corner buttons work in both modes — that is the whole point of them.
  if (ev.target.closest('[data-story]') || ev.target.closest('[data-act-dot]')) {
    ev.preventDefault();
    ev.stopPropagation();
    return void openFocus(item);
  }

  if (view.mode !== 'preview') { ev.preventDefault(); return; }

  const a = ev.target.closest('a.hit');
  if (!a) return;
  // Modified clicks keep their normal browser meaning on a real link.
  if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button === 1) return;
  ev.preventDefault();
  openFocus(item);
});

/* Double-click a card while editing opens its content in the inspector. */
el.items.addEventListener('dblclick', ev => {
  if (view.mode === 'preview') return;
  const node = ev.target.closest('.item');
  if (!node) return;
  endRename(true);
  if (view.frameSel) selectFrame(false);
  view.sel = new Set([Number(node.dataset.id)]);
  renderSelection();
  renderInspector();
  setPanel(true);
});

/* --------------------------------------------------------------------------
   25. PREVIEW MODE
   -------------------------------------------------------------------------- */

function setMode(mode) {
  view.mode = mode;
  document.body.dataset.mode = mode;
  if (mode === 'preview') {
    setTool('');
    view.sel.clear();
    view.frameSel = false;
    view.zoom = 'fit';
  }
  render();
  // Two passes: the first picks the scale for the new padding, the second
  // centres the frame against the size that scale actually produced.
  layout();
  requestAnimationFrame(() => layout({ centreFrame: true }));
  if (mode === 'preview') flash('Preview — click a Bento to open it');
}

/* --------------------------------------------------------------------------
   26. EXPORT
   Both formats are produced from the same cardHTML()/pageCSS() the editor
   uses, at the same logical size, so what you arranged is what you get.
   -------------------------------------------------------------------------- */

/** Void elements must be self-closed for the XHTML inside foreignObject. */
function xhtmlify(html) {
  return html.replace(
    /<(img|br|hr|input|source|track|area|base|col|link|meta|param|wbr)\b([^>]*?)\/?>/gi,
    (m, tag, attrs) => `<${tag}${attrs.replace(/\/$/, '')}/>`);
}

/** Collect every cross-origin (http/https) media URL currently in use — the
 *  user-linked remotes that the "embed remote image" choice governs. */
function remoteURLs() {
  const out = new Set();
  for (const it of state.items) {
    for (const k of ['image', 'data', 'poster']) {
      const v = it[k];
      if (v && /^https?:/i.test(v)) out.add(v);
    }
  }
  return [...out];
}

/** Same-origin media served from an assets/ folder — i.e. a folder-deployed,
 *  hosted Studio whose media were externalised on export. Unlike user-linked
 *  remotes these MUST always be re-inlined for a self-contained single file
 *  (leaving the relative paths behind just yields broken references), so they
 *  are gathered separately and inlined regardless of the remote-image choice. */
// Same-origin refs live either as a whole field value (image/data/poster) or
// inside an html/text field's src/href attribute (a journal, an embed). This
// attribute pattern deliberately anchors to `attr="assets/…"` so it can NEVER
// match an `assets/` substring that occurs by chance inside base64 — and we
// skip any value that is itself a data: URI for the same reason.
const ASSET_ATTR_RE = /(src|href|poster|data-src)(\s*=\s*["'])(assets\/[^"'\\]+)(["'])/gi;
function localAssetURLs() {
  const out = new Set();
  for (const it of state.items) {
    for (const v of Object.values(it)) {
      if (typeof v !== 'string' || !v || v.startsWith('data:')) continue;
      if (/^assets\/[^\s"'\\]+$/.test(v)) { out.add(v); continue; }   // whole-value media field
      if (v.includes('assets/')) {                                    // embedded in html/text
        let m; ASSET_ATTR_RE.lastIndex = 0;
        while ((m = ASSET_ATTR_RE.exec(v))) out.add(m[3]);
      }
    }
  }
  return [...out];
}

/** Replace external URLs with data: URIs so the artifact is self-contained.
 *  Same-origin assets/ paths are always inlined; cross-origin remotes are
 *  included unless localOnly is set (the "keep linking to originals" choice).
 *  Whole-value fields are swapped directly; refs embedded in html/text are
 *  rewritten only inside their attribute — never by blind substring match,
 *  which would corrupt any base64 that happens to contain the path. */
async function inlineRemote(items, { localOnly = false } = {}) {
  const urls = localOnly
    ? localAssetURLs()
    : [...new Set([...localAssetURLs(), ...remoteURLs()])];
  if (!urls.length) return { items, failed: [] };
  const map = new Map(), failed = [];
  await Promise.all(urls.map(async u => {
    try { map.set(u, await urlToDataURL(u)); }
    catch { failed.push(u); }
  }));
  if (!map.size) return { items, failed };
  const next = items.map(it => {
    const o = { ...it };
    for (const [k, v] of Object.entries(o)) {
      if (typeof v !== 'string' || !v || v.startsWith('data:')) continue;
      if (map.has(v)) { o[k] = map.get(v); continue; }               // whole-value
      if (v.includes('assets/')) {                                   // embedded refs
        o[k] = v.replace(ASSET_ATTR_RE, (full, a, eq, url, q) =>
          map.has(url) ? a + eq + map.get(url) + q : full);
      }
    }
    return o;
  });
  return { items: next, failed };
}

function frameFor(trim) {
  return trim ? contentBounds(36) : { ...state.frame };
}

/** Move items into frame-relative coordinates for export. */
function shiftItems(items, frame) {
  if (!frame.x && !frame.y) return items;
  return items.map(i => ({ ...i, x: i.x - frame.x, y: i.y - frame.y }));
}

function safeFilename(ext, suffix = '') {
  const base = (state.title || 'bento')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'bento';
  return base + (suffix ? '-' + suffix : '') + '.' + ext;
}

function download(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
}

/* ---- asset externalisation + store-only ZIP -----------------------------
   A folder (.zip) export keeps the heavy media in an assets/ folder beside a
   small index.html, so a served page loads fast and the big files stay
   separate. Everything here is a pure transform on the already-built HTML
   string, so the single-file path above is left completely untouched. */

const MIME_EXT = {
  'image/jpeg': 'jpg', 'image/jpg': 'jpg', 'image/png': 'png', 'image/webp': 'webp',
  'image/gif': 'gif', 'image/svg+xml': 'svg', 'image/avif': 'avif',
  'video/webm': 'webm', 'video/mp4': 'mp4', 'video/ogg': 'ogv', 'video/quicktime': 'mov',
  'audio/mpeg': 'mp3', 'audio/mp4': 'm4a', 'audio/wav': 'wav', 'audio/ogg': 'oga',
  'audio/webm': 'weba', 'application/pdf': 'pdf', 'text/html': 'html', 'application/json': 'json'
};

function extFromDataURL(u) {
  const m = /^data:([^;,]+)/.exec(u);
  return (m && MIME_EXT[m[1].toLowerCase()]) || 'bin';
}

/** Bytes of any data: URL — base64 or percent-encoded (e.g. inline SVG). */
function anyDataURLBytes(url) {
  const s = String(url);
  const comma = s.indexOf(',');
  if (comma < 0) throw new Error('not a data URL');
  const meta = s.slice(0, comma), payload = s.slice(comma + 1);
  if (/;base64/i.test(meta)) {
    const bin = atob(payload);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  return new TextEncoder().encode(decodeURIComponent(payload));
}

/**
 * Rewrite every quoted "data:…" media URL in the built HTML — in card
 * attributes, focus templates and the embedded state JSON alike — into a
 * relative assets/ path, writing each unique blob out exactly once. Base64
 * data URLs never contain a double quote, so a quoted match is exact and
 * DOM-free. Served from the unzipped folder, both the page and a re-import
 * resolve the paths correctly.
 */
function externalizeHTML(html, prefix = 'assets/') {
  const table = new Map();      // data URL -> relative path
  const files = [];
  let n = 0;
  const out = html.replace(/"(data:[^"]*)"/g, (m, url) => {
    // Internal single-file tabling token (and the source literal that defines
    // it, embedded in a Studio copy) — NOT a real asset. Leave it untouched.
    if (url.startsWith('data:x-bento-asset')) return m;
    if (table.has(url)) return `"${table.get(url)}"`;
    let bytes;
    try { bytes = anyDataURLBytes(url); }
    catch (e) { return m; }      // undecodable — leave it inline
    const path = prefix + 'a' + (n++) + '.' + extFromDataURL(url);
    table.set(url, path);
    files.push({ name: path, bytes });
    return `"${path}"`;
  });
  return { html: out, files };
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function utf8Bytes(str) { return new TextEncoder().encode(str); }

/**
 * Build a store-only (uncompressed) ZIP Blob. entries: [{name, bytes?, text?}].
 * Store-only is fine — the media is already compressed — and needs no library.
 */
function makeZip(entries) {
  const files = entries.map(e => ({
    name: e.name,
    bytes: e.bytes != null ? e.bytes : utf8Bytes(e.text || '')
  }));
  const chunks = [];
  const central = [];
  let offset = 0;
  const u16 = v => new Uint8Array([v & 0xFF, (v >>> 8) & 0xFF]);
  const u32 = v => new Uint8Array([v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF]);
  const push = (arr, a) => arr.push(a instanceof Uint8Array ? a : new Uint8Array(a));

  for (const f of files) {
    const nameBytes = utf8Bytes(f.name);
    const crc = crc32(f.bytes);
    const size = f.bytes.length;

    const local = [];
    push(local, u32(0x04034b50));
    push(local, u16(20));
    push(local, u16(0x0800));
    push(local, u16(0));
    push(local, u16(0)); push(local, u16(0));
    push(local, u32(crc));
    push(local, u32(size));
    push(local, u32(size));
    push(local, u16(nameBytes.length));
    push(local, u16(0));
    push(local, nameBytes);
    for (const p of local) chunks.push(p);
    chunks.push(f.bytes);

    const cen = [];
    push(cen, u32(0x02014b50));
    push(cen, u16(20)); push(cen, u16(20));
    push(cen, u16(0x0800));
    push(cen, u16(0));
    push(cen, u16(0)); push(cen, u16(0));
    push(cen, u32(crc));
    push(cen, u32(size)); push(cen, u32(size));
    push(cen, u16(nameBytes.length));
    push(cen, u16(0)); push(cen, u16(0));
    push(cen, u16(0)); push(cen, u16(0));
    push(cen, u32(0));
    push(cen, u32(offset));
    push(cen, nameBytes);
    central.push(...cen);

    offset += local.reduce((s, p) => s + p.length, 0) + f.bytes.length;
  }

  const centralStart = offset;
  const centralSize = central.reduce((s, p) => s + p.length, 0);
  const eocd = [];
  push(eocd, u32(0x06054b50));
  push(eocd, u16(0)); push(eocd, u16(0));
  push(eocd, u16(files.length)); push(eocd, u16(files.length));
  push(eocd, u32(centralSize));
  push(eocd, u32(centralStart));
  push(eocd, u16(0));

  return new Blob([...chunks, ...central, ...eocd], { type: 'application/zip' });
}

/* ---- standalone HTML ---- */

async function buildHTML({ trim, inline, embedState, tableAssets = true }) {
  let items = state.items;
  let failed = [];
  // Same-origin assets/ paths are always inlined so the file is self-contained;
  // cross-origin remotes follow the "embed remote image" choice.
  ({ items, failed } = await inlineRemote(items, { localOnly: !inline }));

  const frame = frameFor(trim);
  const placed = shiftItems(items, frame);
  const cards = placed.slice().sort((a, b) => a.z - b.z)
    .map(i => itemHTML(i, true)).join('\n');

  // Full editable state (optional) and a small always-present map that the
  // overlay script needs, so lightbox captions and stories work either way.
  const editable = { ...state, items: placed, canvas: { w: frame.w, h: frame.h } };
  const stateJSON = embedState
    ? JSON.stringify(editable).replace(/</g, '\\u003c')
    : '';
  const depthJSON = JSON.stringify(placed
    .filter(i => i.story || i.title || i.body || i.name)
    .map(i => ({
      id: i.id, title: i.title || '', body: i.body || '', story: i.story || '',
      name: i.name || '', pages: i.pages || 0
    })))
    .replace(/</g, '\\u003c');

  // Pre-render the focus view for every Bento, so the exported page needs no
  // copy of the builder — the same function produced both.
  const focusTemplates = placed.map(i => {
    const f = focusBodyHTML(i);
    if (!f) return '';
    return `<template data-focus="${i.id}" data-kind="${esc(KIND_LABEL[f.kind] || 'Bento')}" ` +
      `data-title="${esc(i.title || i.name || KIND_LABEL[f.kind] || '')}"` +
      `${f.href ? ` data-href="${esc(f.href)}"` : ''}` +
      `${f.media ? ' data-media="1"' : ''}>` +
      `<div data-stage>${f.stage}</div><div data-foot>${f.foot}</div></template>`;
  }).join('\n');

  // A single-file export otherwise carries every asset three times over — once
  // in the card, once in its pre-rendered focus view, and once in the embedded
  // state. Store each big blob just once in an inline table and reference it by
  // index everywhere; a tiny resolver re-inflates the page on load, and
  // extractState() re-inflates the embedded state on re-import. (The zip path
  // skips this: externalizeHTML() already dedupes assets into files.)
  const assets = [];
  const assetIndex = new Map();
  const tokenize = str => !tableAssets ? str : str.replace(/"(data:[^"]*)"/g, (m, url) => {
    if (url.length < 256) return m;               // tiny inline SVGs stay inline
    let i = assetIndex.get(url);
    if (i === undefined) { i = assets.length; assets.push(url); assetIndex.set(url, i); }
    return `"data:x-bento-asset,${i}"`;
  });
  const cardsT = tokenize(cards);
  const focusT = tokenize(focusTemplates);
  const stateT = embedState ? tokenize(stateJSON) : '';
  const assetsJSON = JSON.stringify(assets).replace(/</g, '\\u003c');
  const assetScript = (tableAssets && assets.length)
    ? `<script type="application/json" id="bento-assets">${assetsJSON}<\/script>`
    : '';
  const resolverJS = (tableAssets && assets.length) ? `
  // Re-inflate tabled assets before anything reads the DOM.
  (function(){
    var A = [];
    try { A = JSON.parse(document.getElementById('bento-assets').textContent); } catch(e){}
    var deref = function(s){ return s == null ? s : String(s).replace(/data:x-bento-asset,(\\d+)/g, function(_, i){ return A[+i] || ''; }); };
    var g = document.getElementById('gal');
    if (g) g.innerHTML = deref(g.innerHTML);
    document.querySelectorAll('template[data-focus]').forEach(function(t){ t.innerHTML = deref(t.innerHTML); });
  })();` : '';

  const meta = [state.author && 'By ' + state.author, state.date].filter(Boolean).join(' · ');

  const html = `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(state.title || 'Bento Page')}</title>
<link rel="icon" href="${BENTO_FAVICON}">
${state.description ? `<meta name="description" content="${esc(state.description)}">` : ''}
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--canvasBg);font-family:var(--body)}
html,body{overflow-x:auto}
/* Extra top room so the fixed brand never lands on the first row of Bentos. */
#page{min-height:100vh;display:flex;padding:72px clamp(8px,2.2vmin,32px) clamp(8px,2.2vmin,32px)}
/* margin:auto centres the frame but, unlike justify-content, still lets you
   scroll to both edges when the composition is wider than the screen. */
#fit{position:relative;flex:none;margin:auto}
#gal{position:absolute;top:0;left:0;transform-origin:0 0;overflow:hidden}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#credit{position:fixed;left:0;right:0;bottom:0;padding:9px 14px;display:flex;gap:10px;justify-content:center;
  font:500 11px/1.3 var(--mono);color:var(--inkFaint);pointer-events:none}
#brand{position:fixed;z-index:40;top:16px;left:18px;display:flex;align-items:center;gap:9px;color:var(--ink);pointer-events:none}
#brand .bMark{width:22px;height:22px;flex:none}
#brand .bMark svg{display:block;fill:currentColor}
#brand b{display:block;font-family:var(--display,Georgia,serif);font-weight:500;font-size:14px;line-height:1.1;letter-spacing:var(--displayTrack,-.01em)}
#brand small{display:block;font-family:var(--mono);font-size:10.5px;opacity:.5;letter-spacing:.02em;margin-top:1px}
${pageCSS()}
${themeCSS(state.theme, ':root')}
${focusCSS()}
/* Depth overlays, mirrored from the Studio. */
.ovl{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:4vmin;background:rgba(6,6,8,.9);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ovl.on{display:grid}
.ovl img{max-width:min(920px,94vw);max-height:78vh;object-fit:contain;border-radius:6px;background:#fff;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.ovlCap{margin-top:14px;text-align:center;color:#f2efe9;font-family:var(--display);font-size:17px}
.ovlCap small{display:block;font-family:var(--body);font-size:12px;opacity:.6;margin-top:5px}
.ovlSheet{width:min(560px,100%);max-height:82vh;overflow:auto;padding:26px;border-radius:16px;
  background:#191a1e;color:#f2efe9;box-shadow:0 30px 90px rgba(0,0,0,.5)}
.ovlSheet h2{margin:0 0 12px;font-family:var(--display);font-size:23px;font-weight:500}
.ovlSheet p{margin:0 0 12px;font-size:14px;line-height:1.65}
.ovlX{position:fixed;top:16px;right:16px;width:40px;height:40px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.12);color:#f2efe9;border-radius:12px;font-size:20px;cursor:pointer}
.dvCtl{display:flex;align-items:center;gap:7px;padding:6px;border-radius:14px;flex-wrap:wrap;
  justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.dvCtl button{height:32px;padding:0 13px;font:550 12px/1 var(--body);color:#f2efe9;background:none;
  border:0;border-radius:9px;cursor:pointer}
.dvCtl button:hover{background:rgba(255,255,255,.18)}
.dvCtl span{font:11px/1 var(--mono);color:rgba(242,239,233,.75);padding:0 6px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

<body>
<h1 class="sr">${esc(state.title || 'Bento Page')}</h1>
${state.description ? `<p class="sr">${esc(state.description)}</p>` : ''}
<div id="brand" aria-hidden="true">
  <span class="bMark">${bentoMarkSVG('width="22" height="22"')}</span>
  <span class="bText"><b>Bento Page</b>${state.title ? `<small>${esc(state.title)}</small>` : ''}</span>
</div>
<div id="page">
  <div id="fit">
    <div class="gallery" id="gal" data-interactive="1" style="width:${frame.w}px;height:${frame.h}px">
${cardsT}
    </div>
  </div>
</div>
${meta ? `<div id="credit"><span>${esc(state.title || '')}</span><span>${esc(meta)}</span></div>` : ''}

<div class="focus" id="focus" role="dialog" aria-modal="true" aria-labelledby="focusTitle">
  <div class="focusBar">
    <div class="focusId"><span class="focusKind" id="focusKind"></span><b id="focusTitle"></b></div>
    <div class="focusActs" id="focusActs"></div>
    <button class="focusX" id="focusClose" aria-label="Close">×</button>
  </div>
  <div class="focusStage" id="focusStage"></div>
  <div class="focusFoot" id="focusFoot"></div>
  <button class="focusNav prev" id="focusPrev" aria-label="Previous">‹</button>
  <button class="focusNav next" id="focusNext" aria-label="Next">›</button>
</div>
${focusT}

${assetScript}
${embedState ? `<script type="application/json" id="bento-state">${stateT}<\/script>` : ''}
<script>
(function(){${resolverJS}
  var W=${frame.w}, H=${frame.h};
  var gal=document.getElementById('gal'), fit=document.getElementById('fit'), page=document.getElementById('page');
  // Below this scale the type stops being readable, so the page pans
  // instead of shrinking any further.
  var MIN_K = 0.42;
  function layout(){
    var padX=Math.min(64,Math.max(16,innerWidth*0.044))*2;
    var padY=Math.min(64,Math.max(16,innerHeight*0.044))*2;
    var k=Math.min(1,(innerWidth-padX)/W,(innerHeight-padY)/H);
    if(!isFinite(k)||k<=0)k=1;
    k=Math.min(1,Math.max(k,MIN_K));
    gal.style.transform='scale('+k+')';
    gal.style.setProperty('--k',k);
    fit.style.width=(W*k)+'px';
    fit.style.height=(H*k)+'px';
  }
  addEventListener('resize',layout,{passive:true});
  addEventListener('orientationchange',layout);
  layout();

  var order = [], current = null;
  document.querySelectorAll('template[data-focus]').forEach(function(t){ order.push(t.dataset.focus); });

  var wrap = document.getElementById('focus');
  var stage = document.getElementById('focusStage');
  var foot = document.getElementById('focusFoot');
  var acts = document.getElementById('focusActs');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]; }); }

  function mediaFor(id){
    var a = document.querySelector('.item[data-id="'+id+'"] a.hit');
    var h = a && a.getAttribute('href') || '';
    return h.indexOf('data:') === 0 ? h : '';
  }

  function hydrate(){
    var local = location.protocol === 'file:';
    stage.querySelectorAll('iframe').forEach(function(f){
      var w = f.closest('.fFrameWrap');
      // Embedded players can't run from a file:// page — show the watch link.
      if (local && w && w.querySelector('.fFall')) {
        w.classList.add('blocked');
        f.removeAttribute('data-src'); f.removeAttribute('data-srcdoc');
        return;
      }
      var src = f.getAttribute('data-src'), doc = f.getAttribute('data-srcdoc');
      if (doc !== null) f.srcdoc = doc; else if (src) f.src = src;
      f.removeAttribute('data-src'); f.removeAttribute('data-srcdoc');
      if (!w || !w.querySelector('.fBlocked')) return;
      var loaded = false;
      f.addEventListener('load', function(){ loaded = true; }, {once:true});
      setTimeout(function(){ if(!loaded) w.classList.add('blocked'); }, 3500);
    });
  }

  function openFocus(id){
    var t = document.querySelector('template[data-focus="'+id+'"]');
    if (!t) return false;
    var frag = t.content.cloneNode(true);
    current = String(id);
    document.getElementById('focusKind').textContent = t.dataset.kind || '';
    document.getElementById('focusTitle').textContent = t.dataset.title || '';
    stage.innerHTML = frag.querySelector('[data-stage]').innerHTML;
    foot.innerHTML = frag.querySelector('[data-foot]').innerHTML;

    var html = '';
    if (t.dataset.href) html += '<a class="primary" href="'+esc(t.dataset.href)+'" target="_blank" rel="noopener noreferrer">Open in new tab \u2197</a>';
    if (t.dataset.media && mediaFor(id)) html += '<button type="button" id="fSave">Download</button>';
    acts.innerHTML = html;
    var sv = document.getElementById('fSave');
    if (sv) sv.addEventListener('click', function(){
      var a = document.createElement('a');
      a.href = mediaFor(id); a.download = t.dataset.title || 'file';
      document.body.appendChild(a); a.click(); a.remove();
    });

    wrap.dataset.single = order.length > 1 ? '0' : '1';
    wrap.classList.add('on');
    document.body.style.overflow = 'hidden';
    hydrate();
    document.getElementById('focusClose').focus();
    return true;
  }

  function closeFocus(){
    wrap.classList.remove('on');
    stage.innerHTML = ''; foot.innerHTML = ''; acts.innerHTML = '';
    document.body.style.overflow = '';
    current = null;
  }
  function step(d){
    if (order.length < 2) return;
    var i = order.indexOf(current);
    openFocus(order[(i + d + order.length) % order.length]);
  }

  document.getElementById('focusClose').addEventListener('click', closeFocus);
  document.getElementById('focusPrev').addEventListener('click', function(){ step(-1); });
  document.getElementById('focusNext').addEventListener('click', function(){ step(1); });
  wrap.addEventListener('pointerdown', function(e){
    if (e.target.id === 'focus' || e.target.id === 'focusStage') closeFocus();
  });
  addEventListener('keydown', function(e){
    if (!wrap.classList.contains('on')) return;
    if (e.key === 'Escape') closeFocus();
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
  });

  document.getElementById('gal').addEventListener('click', function(ev){
    var node = ev.target.closest('.item');
    if (!node) return;
    if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button === 1) return;
    if (!ev.target.closest('a.hit') && !ev.target.closest('.dot')) return;
    ev.preventDefault();
    openFocus(node.dataset.id);
  });
})();
<\/script>
</body>
</html>`;
  return { html, failed, frame };
}


/* ---- Studio copy: the whole Studio with this page baked in ---- */

/**
 * Serialise the running application, with the page embedded, so that opening
 * the exported file gives you the Studio with this page already loaded —
 * not a read-only page. The app's own markup and script are taken from the live
 * document, so a Studio copy is always built from the version you are using.
 */
async function buildEditable({ inline }) {
  let items = state.items;
  let failed = [];
  // Same-origin assets/ paths are always inlined so the file is self-contained;
  // cross-origin remotes follow the "embed remote image" choice.
  ({ items, failed } = await inlineRemote(items, { localOnly: !inline }));

  const doc = document.documentElement.cloneNode(true);
  const q = sel => doc.querySelector(sel);

  // Everything below is rebuilt by boot(); shipping a snapshot of it would
  // only bloat the file and risk a stale first paint.
  for (const sel of ['#itemLayer', '#labelLayer', '#selectionLayer', '#inspector', '#pagePanel',
                     '#pageList', '#addGrid', '#themeGrid', '#toastWrap',
                     '#exportOpts', '#storyBody', '#pageStyle', '#themeStyle']) {
    const n = q(sel);
    if (n) n.innerHTML = '';
  }
  // The clone is taken mid-export, so the Go button is frozen in its
  // "Working…"/disabled state. Restore it or the Studio copy ships with an
  // export button that can never be clicked.
  const goBtn = q('#bExportGo'); if (goBtn) { goBtn.disabled = false; goBtn.textContent = 'Export'; }
  for (const n of doc.querySelectorAll('#guideLayer .guide')) n.remove();
  for (const n of doc.querySelectorAll('.drawer.open')) n.classList.remove('open');
  for (const n of doc.querySelectorAll('.modalWrap.on, .lightbox.on, .focus.on')) n.classList.remove('on');
  for (const n of doc.querySelectorAll('.scrim.on')) n.classList.remove('on');
  for (const n of doc.querySelectorAll('input[type="file"]')) n.removeAttribute('value');
  for (const n of doc.querySelectorAll('img[src^="data:"], img[src^="blob:"]')) n.removeAttribute('src');
  for (const sel of ['#focusStage', '#focusFoot', '#focusActs']) {
    const n = q(sel); if (n) n.innerHTML = '';
  }
  const bt = q('#brandTitle'); if (bt) bt.textContent = state.title || 'Untitled Page';
  // The copy must open with a clean right-hand side, whatever was on screen
  // when it was made, and with no half-finished rename in the frame chip.
  const pn = q('#panel'); if (pn) pn.hidden = true;
  for (const n of doc.querySelectorAll('.bLabelEdit, .frameEdit')) n.remove();
  const fnm = q('#frameName'); if (fnm) { fnm.hidden = false; fnm.textContent = state.title || 'Untitled Page'; }

  const body = doc.querySelector('body');
  if (body) body.setAttribute('data-mode', 'edit');

  // If this copy is itself made from a Studio copy (or a hosted one), the clone
  // already carries an embedded state — and its asset table. Drop both, or the
  // stale first #bento-state wins on boot (getElementById returns it) and the
  // page loads the old asset/token paths instead of the freshly inlined ones.
  for (const n of doc.querySelectorAll('#bento-state, #bento-assets')) n.remove();

  // The page itself, read by boot() on the other side.
  const payload = { ...state, items, frame: { ...state.frame }, updated: state.updated || Date.now() };
  const tag = document.createElement('script');
  tag.type = 'application/json';
  tag.id = 'bento-state';
  tag.textContent = JSON.stringify(payload).replace(/</g, '\\u003c');
  const mainScript = [...doc.querySelectorAll('script:not([type])')].pop();
  if (mainScript) mainScript.parentNode.insertBefore(tag, mainScript);
  else doc.querySelector('body')?.appendChild(tag);

  const titleEl = doc.querySelector('title');
  if (titleEl) titleEl.textContent = (state.title || 'Untitled Page') + ' · Bento Studio';

  return { html: '<!doctype html>\n' + doc.outerHTML, failed };
}

/* ---- PNG ---- */

/**
 * Properties that must be frozen to absolute values before rasterising.
 * The card stylesheet sizes type in container-query units, which do not
 * resolve inside the SVG-image rasteriser — so we measure them against the
 * live stylesheet first and bake the results in. Without this the PNG's
 * typography silently drifts from the Studio.
 */
const FROZEN_PROPS = [
  'font-size', 'line-height', 'letter-spacing', 'word-spacing',
  'font-family', 'font-weight', 'font-style', 'text-transform',
  'padding-top', 'padding-right', 'padding-bottom', 'padding-left',
  'row-gap', 'column-gap', 'text-align', 'color'
];

function freezeComputed(root) {
  for (const n of [root, ...root.querySelectorAll('*')]) {
    if (n.tagName === 'STYLE') continue;
    const cs = getComputedStyle(n);
    let extra = '';
    for (const prop of FROZEN_PROPS) {
      const v = cs.getPropertyValue(prop);
      if (v) extra += `${prop}:${v};`;
    }
    const prev = n.getAttribute('style');
    n.setAttribute('style', (prev ? prev + ';' : '') + extra);
  }
}

async function buildPNG({ trim, scale = 2 }) {
  // Remote media cannot load inside a rasterised SVG, so inline it first.
  const { items, failed } = await inlineRemote(state.items);
  const frame = frameFor(trim);
  const placed = shiftItems(items, frame);
  const W = Math.round(frame.w), H = Math.round(frame.h);

  FLAT = true;   // swap iframes/video for static equivalents
  let markup;
  try {
    markup = placed.slice().sort((a, b) => a.z - b.z).map(i => itemHTML(i, false)).join('');
  } finally { FLAT = false; }

  // Lay the composition out for real, off-screen, so the live stylesheet
  // resolves every container-relative size. Then freeze what we measured.
  const stage = document.createElement('div');
  stage.className = 'gallery';
  stage.setAttribute('data-interactive', '0');
  stage.style.cssText =
    `position:fixed;left:-99999px;top:0;width:${W}px;height:${H}px;overflow:hidden;contain:strict`;
  stage.innerHTML = markup;
  document.body.appendChild(stage);

  let doc;
  try {
    // Mark overflow inside the off-screen copy at its real size.
    for (const node of stage.querySelectorAll('.item')) {
      const parts = [];
      for (const n of node.querySelectorAll('.bdy, .md, .q')) {
        if (n.scrollHeight <= n.clientHeight + 1) continue;
        parts.push(n.classList.contains('md') ? 'md' : n.classList.contains('q') ? 'q' : 'bdy');
      }
      if (parts.length) node.dataset.clip = parts.join(' ');
      else node.removeAttribute('data-clip');
    }
    freezeComputed(stage);
    // Carry the canvas surface across explicitly — including the theme's
    // texture, which a `background` shorthand would silently drop.
    const cvs = getComputedStyle(el.canvas);
    stage.style.setProperty('position', 'relative');
    stage.style.setProperty('left', 'auto');
    stage.style.setProperty('top', 'auto');
    stage.style.setProperty('contain', 'none');
    stage.style.setProperty('background-color', cvs.backgroundColor);
    stage.style.setProperty('background-image', cvs.backgroundImage);
    stage.style.setProperty('background-size', cvs.backgroundSize);
    stage.style.setProperty('background-repeat', cvs.backgroundRepeat);
    stage.style.setProperty('background-position', '0 0');
    doc = stage.outerHTML;
  } finally {
    stage.remove();
  }

  // The page stylesheet still ships along for layout, backgrounds, masks
  // and image treatment; only type metrics come from the frozen values.
  const css = (pageCSS() + themeCSS(state.theme, '.gallery'))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;');

  doc = xhtmlify(doc)
    .replace('<div class="gallery"', '<div xmlns="http://www.w3.org/1999/xhtml" class="gallery"')
    .replace('>', `><style>${css}</style>`);

  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${W * scale}" height="${H * scale}" viewBox="0 0 ${W} ${H}">` +
    `<foreignObject x="0" y="0" width="${W}" height="${H}">${doc}</foreignObject></svg>`;

  // Validate before rasterising: an XML parse error otherwise surfaces only
  // as a silently blank image.
  const parsed = new DOMParser().parseFromString(svg, 'image/svg+xml');
  const perr = parsed.getElementsByTagName('parsererror');
  if (perr.length) {
    throw new Error('Could not build the image from this composition (' +
      (perr[0].textContent || '').trim().slice(0, 90) + ')');
  }

  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  const img = await new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('The browser refused to rasterise the composition'));
    im.src = url;
  });

  const cv = document.createElement('canvas');
  cv.width = W * scale;
  cv.height = H * scale;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = getComputedStyle(el.canvas).backgroundColor || '#ffffff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);

  const blob = await new Promise((res, rej) =>
    cv.toBlob(b => b ? res(b) : rej(new Error('Could not encode the PNG')), 'image/png'));
  return { blob, failed, frame, W: cv.width, H: cv.height, svg };
}

/* ---- export modal ---- */

/* Held outside the DOM so re-rendering the options never resets a choice. */
const exportOpts = { fmt: 'html', flavour: 'page', trim: false, inline: true, scale: 2, pack: 'single' };

function openExport() {
  exportOpts.fmt = 'html';
  exportOpts.flavour = 'page';
  exportOpts.trim = false;
  exportOpts.inline = true;
  exportOpts.scale = 2;
  exportOpts.pack = 'single';
  syncExportUI();
  $('#exportModal').classList.add('on');
  setTimeout(() => $('#bExportGo').focus(), 60);
}

function syncExportUI() {
  $$('#exportChoice button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.fmt === exportOpts.fmt)));

  const remote = remoteURLs().length;
  const trimmed = contentBounds(36);
  const outside = itemsOutsideFrame().length;
  const canTrim = state.items.length > 0 &&
    (trimmed.w !== state.frame.w || trimmed.h !== state.frame.h ||
     trimmed.x !== state.frame.x || trimmed.y !== state.frame.y);
  if (!canTrim) exportOpts.trim = false;

  const editable = exportOpts.fmt === 'html' && exportOpts.flavour === 'editable';
  if (editable) exportOpts.trim = false;      // the Studio needs its whole canvas
  const outW = exportOpts.trim ? trimmed.w : state.frame.w;
  const outH = exportOpts.trim ? trimmed.h : state.frame.h;

  $('#exportOpts').innerHTML = `
    ${exportOpts.fmt === 'html' ? `<div class="field" style="margin:4px 0 10px"><label>What the file should be</label>
      <div class="exportChoice">
        <button data-flav="page" aria-pressed="${exportOpts.flavour === 'page'}">
          <b>A page to share</b>
          <small>Opens as the finished page. Links, images, documents and stories all work. Smallest file. Can still be reopened here with “Open a page…”.</small>
        </button>
        <button data-flav="editable" aria-pressed="${exportOpts.flavour === 'editable'}">
          <b>A Studio copy</b>
          <small>Opens as the Studio with the page already loaded, so you can keep working in the file itself. Adds about ${Math.round(document.documentElement.outerHTML.length / 1024)} KB — the Studio.</small>
        </button>
      </div></div>` : ''}
    ${exportOpts.fmt === 'html' ? `<div class="field" style="margin:4px 0 10px"><label>How to package it</label>
      <div class="exportChoice">
        <button data-pack="single" aria-pressed="${exportOpts.pack === 'single'}">
          <b>Single file</b>
          <small>One .html with every asset stored inside it. Works offline, opens anywhere, and stays the re-editable master.</small>
        </button>
        <button data-pack="zip" aria-pressed="${exportOpts.pack === 'zip'}">
          <b>Folder (.zip)</b>
          <small>A small index.html beside an assets/ folder, zipped — best for hosting. Serve the unzipped folder; the page loads fast and the big files stay separate.</small>
        </button>
      </div></div>` : ''}
    <label class="checkRow"><input type="checkbox" data-opt="trim"${exportOpts.trim ? ' checked' : ''}${(canTrim && !editable) ? '' : ' disabled'}>
      <span>Use the content bounds instead of the frame
        <small>${editable
          ? 'A Studio copy keeps your frame exactly as you set it.'
          : canTrim
            ? `Ignore the frame and wrap tightly around every Bento: ${state.frame.w}×${state.frame.h} → ${Math.round(trimmed.w)}×${Math.round(trimmed.h)}.`
            : 'Your frame already matches the content.'}</small></span></label>
    ${(outside && !exportOpts.trim && !editable) ? `<p class="help" style="color:var(--danger);margin:-2px 0 10px">${outside} Bento${outside === 1 ? '' : 's'} sit outside the frame and will be cropped. Tick the box above, or use “Fit frame to content”.</p>` : ''}
    ${remote ? `<label class="checkRow"><input type="checkbox" data-opt="inline"${exportOpts.inline ? ' checked' : ''}>
      <span>Embed ${remote} remote image${remote === 1 ? '' : 's'}
        <small>Makes the file work offline and forever, at the cost of size. Turn this off to keep linking to the originals.</small></span></label>` : ''}

    ${exportOpts.fmt === 'png' ? `<div class="field" style="margin-top:8px"><label>Resolution</label><div class="chipRow">
      ${[1, 2, 3].map(s => `<button class="chip" data-scale="${s}" aria-pressed="${s === exportOpts.scale}">${s}× · ${Math.round(outW * s)}px</button>`).join('')}
    </div></div>
    <p class="help">Video, audio and embedded pages become static cards in an image.</p>` : ''}
    <p class="help" style="margin-bottom:0">Output: <strong>${Math.round(outW)}×${Math.round(outH)}</strong>${
      exportOpts.fmt === 'png' ? ` at ${exportOpts.scale}× → ${Math.round(outW * exportOpts.scale)}×${Math.round(outH * exportOpts.scale)}px` : ''
    }. This is the export frame you set on the canvas.</p>`;

  $$('#exportOpts [data-opt]').forEach(c => c.addEventListener('change', () => {
    exportOpts[c.dataset.opt] = c.checked;
    syncExportUI();
  }));
  $$('#exportOpts [data-scale]').forEach(b => b.addEventListener('click', () => {
    exportOpts.scale = num(b.dataset.scale, 2);
    syncExportUI();
  }));
  $$('#exportOpts [data-flav]').forEach(b => b.addEventListener('click', () => {
    exportOpts.flavour = b.dataset.flav;
    syncExportUI();
  }));
  $$('#exportOpts [data-pack]').forEach(b => b.addEventListener('click', () => {
    exportOpts.pack = b.dataset.pack;
    syncExportUI();
  }));
}

$$('#exportChoice button').forEach(b => b.addEventListener('click', () => {
  exportOpts.fmt = b.dataset.fmt;
  syncExportUI();
}));
$('#bExportCancel').addEventListener('click', () => $('#exportModal').classList.remove('on'));

$('#bExportGo').addEventListener('click', async () => {
  const { fmt, flavour, trim, inline, scale, pack } = exportOpts;
  const btn = $('#bExportGo');
  btn.disabled = true;
  btn.textContent = 'Working…';
  const busy = flash(fmt === 'png' ? 'Rendering image…' : 'Building file…');

  try {
    if (fmt === 'html') {
      const { html, failed, frame } = flavour === 'editable'
        ? { ...(await buildEditable({ inline })), frame: { w: state.frame.w, h: state.frame.h } }
        : await buildHTML({ trim, inline, embedState: true, tableAssets: pack !== 'zip' });

      let blob, name;
      if (pack === 'zip') {
        // Pull the media out into assets/ beside a small index.html, then
        // store-zip the lot. Everything else about the page is unchanged.
        const { html: outHTML, files } = externalizeHTML(html);
        blob = makeZip([{ name: 'index.html', text: outHTML }, ...files]);
        name = safeFilename('zip', flavour === 'editable' ? 'studio' : 'page');
      } else {
        blob = new Blob([html], { type: 'text/html' });
        name = safeFilename('html', flavour === 'editable' ? 'studio' : 'page');
      }
      download(name, blob);
      busy();
      $('#exportModal').classList.remove('on');
      const zipNote = pack === 'zip' ? ' (zip — unzip to host)' : '';
      flash(flavour === 'editable'
        ? `Studio copy exported · ${formatBytes(blob.size)}${pack === 'zip' ? zipNote : ' — open it to keep editing'}`
        : `Exported ${frame.w}×${frame.h} · ${formatBytes(blob.size)}${zipNote}`);
      if (failed.length) flash(`${failed.length} remote image${failed.length === 1 ? '' : 's'} could not be embedded — the file links to them instead`, 'warn');
    } else {
      const { blob, failed, W, H } = await buildPNG({ trim, scale });
      download(safeFilename('png'), blob);
      busy();
      $('#exportModal').classList.remove('on');
      flash(`Exported ${W}×${H} · ${formatBytes(blob.size)}`);
      if (failed.length) flash(`${failed.length} remote image${failed.length === 1 ? '' : 's'} could not be embedded and will be blank`, 'warn');
    }
  } catch (err) {
    busy();
    console.error(err);
    flash(err?.message || 'Export failed', 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Export';
  }
});

/* --------------------------------------------------------------------------
   27. IMPORT
   An exported page can be reopened and kept editing — export is not a
   one-way door.
   -------------------------------------------------------------------------- */

function extractState(text) {
  const t = String(text);
  const m = t.match(/<script[^>]*id=["']bento-state["'][^>]*>([\s\S]*?)<\/script>/i);
  const json = m ? m[1] : t;
  const st = JSON.parse(json.replace(/\\u003c/g, '<'));
  // Re-inflate any assets that a single-file export stored once in the table.
  const am = t.match(/<script[^>]*id=["']bento-assets["'][^>]*>([\s\S]*?)<\/script>/i);
  if (am && st && Array.isArray(st.items)) {
    try {
      const A = JSON.parse(am[1].replace(/\\u003c/g, '<'));
      const deref = v => (typeof v === 'string')
        ? v.replace(/data:x-bento-asset,(\d+)/g, (_, i) => A[+i] || '') : v;
      // Re-inflate EVERY string field, not just image/data/poster — tokens can
      // also live inside an html/embed field, and a survivor would later be
      // mistaken for a real asset on re-export.
      for (const it of st.items) for (const k of Object.keys(it)) if (typeof it[k] === 'string') it[k] = deref(it[k]);
    } catch (e) {}
  }
  return st;
}

async function importFile(file) {
  try {
    const raw = extractState(await fileToText(file));
    const next = migrate(raw);
    next.id = uid();                       // never clobber an existing page
    if (!/copy|imported/i.test(next.title)) next.title = next.title || 'Imported Page';
    await Store.put(next.id, next);
    adoptState(next, 'Opened “' + next.title + '”');
  } catch (err) {
    console.error(err);
    flash('That file has no editable page data inside it', 'err');
  }
}

/* --------------------------------------------------------------------------
   28. CHROME WIRING
   -------------------------------------------------------------------------- */



function buildThemeGrid() {
  $('#themeGrid').innerHTML = Object.entries(THEMES).map(([id, t]) => {
    const [bg, surface, accent] = t.swatch;
    return `
    <button class="themeCard" data-theme="${id}" aria-pressed="false">
      <span class="themeSwatch" aria-hidden="true" style="background:${bg}"><i style="background:${surface}"></i><i style="background:${accent}"></i><i style="background:${t.vars.ink}"></i></span>
      <span><b>${t.label.toUpperCase()}</b><small>${t.note}</small></span>
    </button>`;
  }).join('');
  $$('#themeGrid .themeCard').forEach(b =>
    b.addEventListener('click', () => setTheme(b.dataset.theme)));
}

function wireChrome() {
  $('#bUndo').addEventListener('click', () => History.step('undo'));
  $('#bRedo').addEventListener('click', () => History.step('redo'));
  $('#bZoomIn').addEventListener('click', () => zoomBy(1.15));
  $('#bZoomOut').addEventListener('click', () => zoomBy(1 / 1.15));
  $('#bZoomFit').addEventListener('click', () => { view.zoom = 'fit'; layout(); renderSelection(); });
  $('#bPreview').addEventListener('click', () => setMode('preview'));
  $('#bExitPreview').addEventListener('click', () => setMode('edit'));
  $('#bExport').addEventListener('click', openExport);

  $('#bNewPage').addEventListener('click', newPage);
  $('#brand').addEventListener('click', () => {
    selectFrame(false); view.sel.clear(); renderSelection(); renderInspector();
    setPanel(ui.panel && ui.panelMode === 'page' ? false : true, 'page');
  });
  $('#bFitFrame').addEventListener('click', fitFrameToContent);
  $('#bFrame').addEventListener('click', () => {
    selectFrame(!view.frameSel);
    if (view.frameSel) {
      setPanel(true);
      flash('Drag the frame or its handles — this is what gets exported');
    }
  });

  const fi = $('#fileInput');
  fi.setAttribute('data-all', fi.getAttribute('accept'));
  $('#toolUpload').addEventListener('click', () => {
    pickTarget = null;
    fi.multiple = true;
    fi.accept = fi.getAttribute('data-all');
    fi.click();
  });
  fi.addEventListener('change', async ev => {
    const files = [...ev.target.files];
    ev.target.value = '';
    if (!files.length) return;
    if (pickTarget) {
      const item = byId(pickTarget.id);
      const kind = pickTarget.kind;
      pickTarget = null;
      if (!item) return;
      try {
        if (kind === 'poster') {
          History.begin();
          item.poster = await fileToDataURL(files[0]);
          refreshItem(item);
          renderInspector();
          History.commit('Set preview image');
          flash('Preview image set');
        } else {
          await replaceOn(item, files[0]);
        }
      } catch { flash('Could not read that file', 'err'); }
      return;
    }
    await handleFiles(files, view.lastPointer || viewportCentre());
  });

  $('#bImport').addEventListener('click', () => $('#importInput').click());
  $('#importInput').addEventListener('change', async ev => {
    const f = ev.target.files[0];
    ev.target.value = '';
    if (f) await importFile(f);
  });

  /* Drop anywhere on the stage; the Bento lands where it was dropped. */
  const stage = el.stage;
  let dragDepth = 0;
  stage.addEventListener('dragenter', ev => {
    if (![...ev.dataTransfer.types].includes('Files')) return;
    ev.preventDefault();
    if (++dragDepth === 1) el.canvas.style.outline = '2px dashed var(--focus)';
  });
  stage.addEventListener('dragover', ev => {
    if (![...ev.dataTransfer.types].includes('Files')) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'copy';
  });
  stage.addEventListener('dragleave', () => {
    if (--dragDepth <= 0) { dragDepth = 0; el.canvas.style.outline = ''; }
  });
  stage.addEventListener('drop', async ev => {
    ev.preventDefault();
    dragDepth = 0;
    el.canvas.style.outline = '';
    const files = [...(ev.dataTransfer?.files || [])];
    if (!files.length) return;
    const at = toLogical(ev.clientX, ev.clientY);
    if (files.length === 1 && /\.(html?|json)$/i.test(files[0].name)) {
      // An exported page dropped in is almost certainly meant to be opened.
      const txt = await fileToText(files[0]);
      if (/id=["']bento-state["']/.test(txt) || /"items"\s*:/.test(txt)) {
        const ok = await askConfirm('Open this page?',
          `“${files[0].name}” looks like an exported Bento Page. Open it, or embed it as a Bento instead?`, 'Open it');
        if (ok) return importFile(files[0]);
      }
    }
    await handleFiles(files, at);
  });

  /* Remember where the pointer is so new Bentos land somewhere sensible. */
  stage.addEventListener('pointermove', ev => {
    if (gesture) return;
    view.lastPointer = toLogical(ev.clientX, ev.clientY);
  }, { passive: true });

  const relayout = debounce(() => { layout(); renderSelection(); }, 90);
  // Clicking outside the "more types" popover should close it.
  addEventListener('pointerdown', ev => {
    if ($('#railMore').hidden) return;
    if (ev.target.closest('#railMore, #toolMore')) return;
    $('#railMore').hidden = true;
    $('#toolMore').setAttribute('aria-expanded', 'false');
  }, true);
  addEventListener('resize', relayout);
  addEventListener('orientationchange', relayout);
}

/* --------------------------------------------------------------------------
   29. BOOT
   A bad saved blob must never leave a blank, unrecoverable screen.
   -------------------------------------------------------------------------- */

async function boot() {
  $('#pageStyle').textContent = pageCSS();
  $('#focusStyle').textContent = focusCSS();
  // The brand and the tab icon are both drawn from the one shared mark.
  $('#favicon').setAttribute('href', BENTO_FAVICON);
  $('#brandMark').innerHTML = bentoMarkSVG('width="100%" height="100%"');
  buildRail();
  buildThemeGrid();
  wireChrome();
  setPanel(false);
  setTool('');

  const mode = await Store.init();
  if (mode === 'none') {
    flash('This browser is blocking local storage — export your work to keep it', 'warn');
  }

  // A Studio copy carries its page inside it.
  let embedded = null;
  try {
    const tag = $('#bento-state');
    if (tag && tag.textContent.trim()) embedded = migrate(JSON.parse(tag.textContent));
  } catch (err) {
    console.warn('embedded page unreadable', err);
    flash('The page embedded in this file could not be read', 'warn');
  }

  if (embedded) {
    // Reloading the file must not throw away edits made since it was exported.
    let localCopy = null;
    try { localCopy = await Store.get(embedded.id); } catch {}
    let use = embedded, note = 'Opened the page stored in this file';
    if (localCopy) {
      try {
        const local = migrate(localCopy);
        if (num(local.updated, 0) > num(embedded.updated, 0)) {
          use = local;
          note = 'Opened your newer local copy of this page';
        }
      } catch {}
    }
    state = use;
    applyTheme();
    layout({ centreFrame: true });
    render();
    syncHistoryUI();
    renderPageList();
    Store.setLast(state.id);
    save();
    flash(note);
    return;
  }

  let loaded = null;
  const lastId = Store.last();
  if (lastId) {
    let raw;
    try { raw = await Store.get(lastId); }
    catch (err) { flash('Could not read your last page: ' + (err?.message || ''), 'err'); }
    if (raw) {
      try { loaded = migrate(raw); }
      catch (err) {
        const key = Store.quarantine(raw);
        console.error('migrate failed', err);
        flash('Your saved page could not be read, so a fresh one was started' +
          (key ? ' (the old data is kept aside)' : ''), 'warn');
      }
    }
  }

  state = loaded || migrate(defaultPage(innerWidth, innerHeight));
  applyTheme();
  layout({ centreFrame: true });
  render();
  syncHistoryUI();
  renderPageList();
  if (!loaded) save();
  else Store.setLast(state.id);
}

boot().catch(err => {
  console.error(err);
  // Last-resort recovery: never leave the user staring at nothing.
  document.body.innerHTML =
    `<div style="max-width:460px;margin:16vh auto;padding:28px;font:14px/1.6 system-ui;color:#f1eee8;
      background:#191a1e;border-radius:16px">
      <h1 style="font:500 24px Georgia,serif;margin:0 0 10px">Bento Studio could not start</h1>
      <p style="opacity:.7">${esc(err?.message || 'Unknown error')}</p>
      <button id="rescue" style="margin-top:14px;padding:10px 16px;border-radius:10px;border:0;
        background:#f1eee8;color:#191a1e;font-weight:600;cursor:pointer">Start a fresh page</button>
    </div>`;
  document.getElementById('rescue').onclick = () => {
    try {
      Object.keys(localStorage).filter(k => k.startsWith('bento:') && !k.startsWith('bento:corrupt'))
        .forEach(k => localStorage.removeItem(k));
    } catch {}
    location.reload();
  };
});
</script>
